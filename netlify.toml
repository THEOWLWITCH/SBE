[build]
  publish = "app"
  command = ""
  # חיסכון (08/10/2026): בונים רק מ-main. דחיפה לענף אחר או PR לא מפעילים בנייה.
  ignore = "test \"$BRANCH\" != \"main\""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# קישור מתנה קצר ל"יש מה לעשות" (20/10/2026): be-good.co.il/g/<קוד>
[[redirects]]
  from = "/g/:id"
  to = "/yesh-ma-laasot.html?g=:id"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
