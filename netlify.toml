[build]
  publish = "app"
  command = ""
  # חיסכון (08/10/2026): בונים רק מ-main. דחיפה לענף אחר או PR לא מפעילים בנייה.
  ignore = "test \"$BRANCH\" != \"main\""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# קישור מתנה קצר ל"יש מה לעשות" (20/10/2026): be-good.co.il/g/<קוד>
[[redirects]]
  from = "/g/:id"
  to = "/yesh-ma-laasot.html?g=:id"
  status = 301

# התנסות קצרה ככלי עצמאי (16/11/2026): אותו קובץ כמו תרגול לפי תרחיש, והדף מזהה את הכתובת ונפתח ישר על התרחיש המוכן
[[redirects]]
  from = "/quick-practice.html"
  to = "/practice.html"
  status = 200

[[redirects]]
  from = "/quick-practice"
  to = "/practice.html"
  status = 200

# מחקר שיחות מאתגרות (18/11/2026): התרגול במסלול של הסטודנטיות (talk-study.html), אותו קובץ במצב מחקר
[[redirects]]
  from = "/talk-practice.html"
  to = "/practice.html"
  status = 200

[[redirects]]
  from = "/talk-practice"
  to = "/practice.html"
  status = 200

# תכנון השיחה במסלול הסטודנטיות (23/11/2026): אותו קובץ של תכנון שיחה, במצב מחקר
[[redirects]]
  from = "/talk-plan.html"
  to = "/conversation-planner.html"
  status = 200

[[redirects]]
  from = "/talk-plan"
  to = "/conversation-planner.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
