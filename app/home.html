<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המרחב שלי</title>
<script src="lib/access-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- המרחב שלי (30/09/2026): מסך הבית של כל מי שנכנס/ה בקוד. מה שמופיע כאן נגזר
     מההרשאות שהשרת החזיר לקוד (sbe.session.perms / sbe.session.info, נשמרו
     ב-entry.html). מנהל/ת מוסד מנהל/ת כאן את קודי הצוות; מרצה — קודים לסטודנטים.
     כל פעולה נבדקת שוב בשרת (harness/lib/access.mjs) מול האסימון החתום. -->
<style>
:root{
  --ground:#EDEFF1; --surface:#FCFCFD; --surface-2:#E4E7EA;
  --ink:#141C24; --muted:#5C6771; --hair:#CDD3D8;
  --spoken:#2E5A7D; --spoken-soft:#DCE7EF;
  --hidden:#8F5F2E; --hidden-soft:#F5EAD9;
  --auto:#4A6B5A; --auto-soft:#DFE9E2;
  --brick:#8C3A34; --brick-soft:#F5E4E2;
  --shadow:rgba(20,28,36,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
    --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
    --spoken:#82AECE; --spoken-soft:#1E2E3A;
    --hidden:#CE9C5E; --hidden-soft:#332617;
    --auto:#83B599; --auto-soft:#1B2A22;
    --brick:#CF7C74; --brick-soft:#331E1C;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
  --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
  --spoken:#82AECE; --spoken-soft:#1E2E3A;
  --hidden:#CE9C5E; --hidden-soft:#332617;
  --auto:#83B599; --auto-soft:#1B2A22;
  --brick:#CF7C74; --brick-soft:#331E1C;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{direction:rtl;background:var(--ground);color:var(--ink);margin:0;
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;padding:0 16px 28px;}
.wrap{max-width:760px;margin:0 auto;}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;flex-wrap:wrap;}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(22px,5vw,28px);margin:0;}
.who{font-size:14px;color:var(--muted);margin:2px 0 0;}
.who b{color:var(--ink);}
.out{font-family:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:6px;border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);cursor:pointer;}
.banner{border:1px solid var(--hair);border-inline-start:4px solid var(--hidden);background:var(--hidden-soft);color:var(--ink);
  border-radius:8px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;line-height:1.55;}
.banner.danger{border-inline-start-color:var(--brick);background:var(--brick-soft);}
.banner a{color:var(--spoken);font-weight:700;}
h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:18px;margin:22px 0 10px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.tile{display:block;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:13px 15px;
  text-decoration:none;color:var(--ink);box-shadow:0 1px 3px var(--shadow);transition:border-color .12s;}
.tile:hover{border-color:var(--spoken);}
.tile b{display:block;font-size:15.5px;margin-bottom:3px;}
.tile span{font-size:13px;color:var(--muted);line-height:1.45;display:block;}
.empty{background:var(--surface);border:1px dashed var(--hair);border-radius:10px;padding:16px;color:var(--muted);font-size:14.5px;}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow);}
.card h3{margin:0 0 6px;font-size:16px;}
.card p.sub{margin:0 0 10px;font-size:13.5px;color:var(--muted);}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 0 3px;}
input,select{font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--ground);border:1px solid var(--hair);
  border-radius:6px;padding:7px 10px;width:100%;}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--spoken);
  background:var(--spoken);color:#fff;cursor:pointer;}
:root[data-theme="dark"] .btn{color:#0F1418;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0F1418;} }
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair);}
.btn.sm{padding:4px 10px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;}
.row>div{flex:1;min-width:150px;}
.perms{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;}
.perm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:99px;padding:4px 11px;font-size:13.5px;
  cursor:pointer;background:var(--ground);user-select:none;}
.perm input{width:auto;margin:0;}
.perm.dis{opacity:.4;cursor:not-allowed;}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--spoken-soft);color:var(--spoken);margin:1px;}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;}
.st.ok{background:var(--auto-soft);color:var(--auto);}
.st.off{background:var(--brick-soft);color:var(--brick);}
.st.warn{background:var(--hidden-soft);color:var(--hidden);}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:6px;border-bottom:2px solid var(--hair);}
td{padding:7px 6px;border-bottom:1px solid var(--hair);vertical-align:top;}
.code{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;font-weight:600;letter-spacing:.05em;}
.newcodes{background:var(--auto-soft);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin-top:10px;}
.newcodes .code{font-size:17px;}
.msg{font-size:13.5px;font-weight:600;margin-top:8px;}
.msg.err{color:var(--brick);}
.tablewrap{overflow-x:auto;}
.brand{display:block;width:min(190px,48vw);height:auto;margin:14px auto 0;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand{background:#EEF1F4;border-radius:12px;padding:8px 12px;} }
:root[data-theme="dark"] .brand{background:#EEF1F4;border-radius:12px;padding:8px 12px;}
</style>
</head>
<body>
<div class="wrap">
<img class="brand" src="assets/begood-logo.webp" alt="Begood — חינוך לחוסן">
<header>
  <div>
    <h1>המרחב שלי</h1>
    <p class="who" id="who"></p>
  </div>
  <button class="out" id="logout">יציאה</button>
</header>
<div id="banners"></div>

<h2>הכלים שלי</h2>
<div id="tiles"></div>

<div id="admin"></div>
<div id="lecturer"></div>
</div>

<script>
"use strict";
const API = "https://sbe-server.onrender.com/api/access";
const $ = (id) => document.getElementById(id);
const el = (t, a = {}, ...k) => { const n = document.createElement(t);
  for (const [x, v] of Object.entries(a)) { if (x === "class") n.className = v; else if (v !== false && v != null) n.setAttribute(x, v === true ? "" : v); }
  k.flat().forEach(c => n.append(c)); return n; };
const ss = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const jparse = (s, d) => { try { return JSON.parse(s) ?? d; } catch (e) { return d; } };

const TOKEN = ss("sbe.session.token") || "";
const PERMS = jparse(ss("sbe.session.perms"), []);
const INFO = jparse(ss("sbe.session.info"), {});
const has = (p) => PERMS.includes(p);
const fmtDate = (ymd) => ymd ? ymd.split("-").reverse().join(".") : "";

// מה כל הרשאה אומרת — בשפה פשוטה (אותה רשימה כמו PERMS בשרת).
const PERM_LABEL = {
  fac_trainee: "הנחיית סטודנטים", fac_parent: "הנחיית הורים", fac_youth: "הנחיית נוער",
  conv: "תכנון שיחה", activity: "תכנון פעילות", academic: "משוב לעבודות",
  lecturer: "קודים לסטודנטים", resilience: "חוסן חברתי", leadership: "נוגי — מנהיגות", practi: "פרקטי — יועצת לחוסן",
};
const PRESETS = [
  ["מחנך/ת", ["resilience"]], ["פרקטי בלבד", ["practi"]], ["הנהלה", ["leadership", "resilience"]], ["מנחה סטודנטים", ["fac_trainee"]], ["מנחה הורים", ["fac_parent"]],
  ["מנחה נוער", ["fac_youth"]], ["מרצה", ["lecturer", "academic"]],
];

async function api(action, extra = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ action, token: TOKEN, ...extra }) });
  const d = await r.json().catch(() => ({}));
  d._status = r.status; return d;
}

// ── כותרת ובאנרים ──
{
  const who = $("who");
  const kindLabel = { instadmin: "מנהל/ת מוסד", staff: "צוות", student: "סטודנט/ית", legacy: "צוות (קוד מוסד)", "academic-legacy": "משוב לעבודות" }[INFO.kind] || "";
  who.append(INFO.label ? el("b", {}, INFO.label) : "", INFO.label && (INFO.inst || kindLabel) ? " · " : "",
    INFO.inst || "", INFO.inst && kindLabel ? " · " : "", kindLabel);
  if (INFO.inst) { try { sessionStorage.setItem("sbe_inst", INFO.inst); } catch (e) {} } // search.html — "התרחישים של המוסד"
  const box = $("banners");
  (INFO.notices || []).forEach(n => {
    const b = el("div", { class: "banner" + (n.level === "danger" ? " danger" : "") });
    const renewLink = INFO.kind === "instadmin" ? el("a", { href: "renew.html" }, "לבקשת חידוש") : "פנו למנהל/ת המוסד.";
    if (n.type === "sub-ending") b.append("המנוי של המוסד מסתיים ב-" + fmtDate(n.subEnd) + " (עוד " + n.daysLeft + " ימים). ", renewLink);
    else if (n.type === "grace") b.append("המנוי של המוסד הסתיים. נותרו " + n.daysLeft + " ימים לחידוש לפני שהכניסה תיחסם. ", renewLink);
    else if (n.type === "code-ending") b.append("תוקף הקוד שלך מסתיים ב-" + fmtDate(n.expiresAt) + ". כדאי לבקש קוד חדש ממי שנתן/ה לך אותו.");
    box.append(b);
  });
  $("logout").addEventListener("click", () => { location.href = "entry.html?logout=1"; });
}

// ── הכלים ──
{
  const T = [];
  const fac = PERMS.some(p => /^fac_/.test(p));
  if (has("fac_trainee")) T.push(["input-screen.html", "יצירת תרחיש — סטודנטים", "דמויות ופרמטרים; השאר מוצע על ידי המערכת"]);
  if (has("fac_parent")) T.push(["parent-input-screen.html", "יצירת תרחיש — הורים", "שתי דמויות, ארבע גישות הוריות"]);
  if (has("fac_youth")) T.push(["student-input-screen.html", "יצירת תרחיש — נוער", "משחק תפקידים בין שני בני נוער"]);
  if (fac) T.push(["facilitator-screen.html", "פתיחת סדנה", "קוד הסדנה נוצר אוטומטית"],
    ["feedback-results.html", "תוצאות משוב", "משוב מנחה, מתנסה וצופה על הסדנאות"],
    ["search.html", "חיפוש במאגר התרחישים", "תרחישי המוסד והמאגר המשותף"]);
  if (has("resilience")) T.push(["resilience-team.html", "חוסן חברתי", "פתיחת כיתה, QR לשאלון, תוצאות וסיכום והמלצות"]);
  if (has("resilience") || has("practi")) T.push(["resilience-advisor.html", "פרקטי: יועצת לפיתוח חוסן חברתי", "בלי שאלון: מתארים את הכיתה ומקבלים ניתוח והמלצות מבוססי מחקר"]);
  if (has("leadership")) T.push(["leadership-advisor.html", "נוגי: יועצת למנהיגות שתומכת בחוסן חברתי", "להנהלה, לרכזים ולצוותי תלמידים: שאלון פתיחה, דוח מסכם, דוח המלצות ושיחת המשך"]);
  if (has("resilience") || has("leadership") || has("practi")) T.push(["resilience-checklist.html", "רשימת בקרה למנהיגות מקדמת חוסן", "עשר פעולות עם מבחן ועדות, לפי רמה וגיל, ושבע שאלות לבדיקה תקופתית — בדיקה עצמית שאפשר לשמור ולהדפיס"]);
  if (has("resilience") || has("leadership") || has("practi")) T.push(["message-writer.html", "כתיבת הודעה ברוח חוסן", "כותבים מה רוצים לומר ומקבלים הודעה לצוות, להורים או לתלמידים — כתובה מההתחלה לפי עשרת עקרונות החוסן"]);
  if (has("conv")) T.push(["conversation-planner.html", "תכנון שיחה", "הכנה לשיחה אמיתית — בעל פה או בכתב"]);
  if (has("activity")) T.push(["activity-planner.html", "תכנון פעילות", "תכנון פעילות חינוכית או ניתוח פעילות קיימת"]);
  if (has("academic")) T.push(["academic-review.html", "משוב לעבודה אקדמית", "משוב לפי קריטריונים לפני הגשה"]);
  const box = $("tiles");
  if (!T.length && INFO.kind !== "instadmin" && !has("lecturer")) {
    box.append(el("div", { class: "empty" }, "עדיין לא נפתחו לך כלים. פנו למי שנתן/ה לך את הקוד."));
  } else {
    const g = el("div", { class: "tiles" });
    T.concat([["sources-library.html", "ספריית המקורות", "המקורות התיאורטיים של המערכת"]])
      .forEach(([h, t, d]) => g.append(el("a", { class: "tile", href: h }, el("b", {}, t), el("span", {}, d))));
    box.append(g);
  }
}

function statusOf(c) {
  const today = new Date().toISOString().slice(0, 10);
  if (c.revoked) return ["בוטל", "off"];
  if (c.expiresAt && c.expiresAt < today) return ["פג תוקף", "off"];
  if (c.maxUses && c.uses >= c.maxUses) return ["נוצל", "off"];
  return ["פעיל", "ok"];
}
function copyBtn(text, label = "העתקה") {
  const b = el("button", { class: "btn ghost sm" }, label);
  b.addEventListener("click", () => navigator.clipboard && navigator.clipboard.writeText(text)
    .then(() => { b.textContent = "הועתק ✓"; setTimeout(() => b.textContent = label, 1800); }).catch(() => {}));
  return b;
}

// ── מנהל/ת מוסד: קודי צוות ──
async function renderAdmin() {
  if (INFO.kind !== "instadmin") return;
  const box = $("admin"); box.textContent = "";
  box.append(el("h2", {}, "קודי הצוות של המוסד"));
  const card = el("div", { class: "card" });
  card.append(el("p", { class: "sub" }, "טוען... (לפעמים עד דקה)"));
  box.append(card);
  const d = await api("codesList").catch(() => ({}));
  card.textContent = "";
  if (!d.codes) { card.append(el("p", { class: "msg err" }, d._status === 403 ? "תוקף הכניסה פג. צאו והיכנסו שוב." : "אין כרגע חיבור לשרת. נסו לרענן בעוד רגע.")); return; }
  const ceiling = d.ceiling || {};
  const open = Object.keys(PERM_LABEL).filter(p => ceiling[p]);
  const sub = d.sub || {};
  card.append(el("p", { class: "sub" },
    sub.subEnd ? "המנוי של המוסד בתוקף עד " + fmtDate(sub.subEnd) + ". קודי הצוות פוקעים לכל המאוחר אז." : "המנוי של המוסד ללא תאריך סיום.",
    " מה שפתוח למוסד: ", open.length ? open.map(p => PERM_LABEL[p]).join(", ") : "עדיין שום דבר — פנו למנהלת המערכת."));

  // יצירת קוד
  const f = el("div", { class: "card" });
  f.append(el("h3", {}, "קוד חדש לאיש/אשת צוות"));
  f.append(el("p", { class: "sub" }, "אפשר קוד לאדם אחד או לקבוצה (למשל \"מחנכות שכבה ה׳\"). מסמנים כל צירוף של הרשאות מתוך מה שפתוח למוסד."));
  const lbl = el("input", { placeholder: "שם או תיאור (למשל: רחל כהן — מחנכת ה׳2)", maxlength: "60" });
  const permsBox = el("div", { class: "perms" });
  const cbs = {};
  Object.keys(PERM_LABEL).forEach(p => {
    const cb = el("input", { type: "checkbox", disabled: !ceiling[p] });
    cbs[p] = cb;
    permsBox.append(el("label", { class: "perm" + (ceiling[p] ? "" : " dis"), title: ceiling[p] ? "" : "לא פתוח למוסד" }, cb, PERM_LABEL[p]));
  });
  const presets = el("div", { class: "presets" }, "בחירה מהירה:");
  PRESETS.forEach(([name, ps]) => {
    if (!ps.every(p => ceiling[p])) return;
    const b = el("button", { class: "btn ghost sm", type: "button" }, name);
    b.addEventListener("click", () => ps.forEach(p => { cbs[p].checked = true; }));
    presets.append(b);
  });
  const exp = el("select", {},
    el("option", { value: "" }, "עד סוף המנוי"), el("option", { value: "30" }, "חודש"),
    el("option", { value: "90" }, "3 חודשים"), el("option", { value: "365" }, "שנה"), el("option", { value: "date" }, "עד תאריך…"));
  const expDate = el("input", { type: "date" }); expDate.hidden = true;
  exp.addEventListener("change", () => { expDate.hidden = exp.value !== "date"; });
  const go = el("button", { class: "btn" }, "הפקת הקוד");
  const msg = el("div", {});
  go.addEventListener("click", async () => {
    const perms = Object.keys(cbs).filter(p => cbs[p].checked);
    if (!perms.length) { msg.className = "msg err"; msg.textContent = "צריך לסמן לפחות הרשאה אחת."; return; }
    let expiresAt = null;
    if (exp.value === "date") expiresAt = expDate.value || null;
    else if (exp.value) expiresAt = new Date(Date.now() + Number(exp.value) * 864e5).toISOString().slice(0, 10);
    go.disabled = true; msg.className = "msg"; msg.textContent = "מפיקה...";
    const r = await api("codeCreate", { kind: "staff", perms, label: lbl.value.trim(), expiresAt }).catch(() => ({}));
    go.disabled = false;
    if (!r.code) { msg.className = "msg err"; msg.textContent = r.error === "above ceiling" ? "אחת ההרשאות לא פתוחה למוסד." : "ההפקה לא הצליחה. נסו שוב."; return; }
    msg.className = ""; msg.textContent = "";
    msg.append(el("div", { class: "newcodes" }, "הקוד החדש: ", el("span", { class: "code" }, r.code.code), " ", copyBtn(r.code.code),
      el("div", { class: "sub", style: "font-size:13px;margin-top:4px" }, "מוסרים אותו לאיש/אשת הצוות. נכנסים איתו במסך הכניסה, בשדה \"הקוד שלך\".")));
    Object.values(cbs).forEach(cb => { cb.checked = false; }); lbl.value = "";
    loadList();
  });
  f.append(el("label", {}, "למי"), lbl, el("label", {}, "הרשאות"), presets, permsBox,
    el("div", { class: "row" }, el("div", {}, el("label", {}, "תוקף"), exp), el("div", {}, expDate)),
    el("div", { style: "margin-top:10px" }, go), msg);
  box.append(f);

  // רשימה
  const lc = el("div", { class: "card" });
  box.append(lc);
  function loadList(list) {
    const draw = (codes) => {
      lc.textContent = "";
      lc.append(el("h3", {}, "הקודים שהופקו (" + codes.length + ")"));
      if (!codes.length) { lc.append(el("p", { class: "sub" }, "עדיין לא הופקו קודים.")); return; }
      const t = el("table", {}, el("tr", {}, ...["למי", "הקוד", "הרשאות", "תוקף", "מצב", ""].map(h => el("th", {}, h))));
      codes.sort((a, b) => b.createdAt.localeCompare(a.createdAt)).forEach(c => {
        const [stl, stc] = statusOf(c);
        const tr = el("tr", {}, el("td", {}, c.label || (c.kind === "student" ? "סטודנט/ית" : "—")), el("td", {}, el("span", { class: "code" }, c.code)),
          el("td", {}, ...(c.perms || []).map(p => el("span", { class: "chip" }, PERM_LABEL[p] || p))),
          el("td", {}, c.expiresAt ? fmtDate(c.expiresAt) : "סוף המנוי"), el("td", {}, el("span", { class: "st " + stc }, stl)));
        const cell = el("td", {});
        if (stc === "ok") {
          const rv = el("button", { class: "btn ghost sm" }, "ביטול");
          rv.addEventListener("click", async () => {
            if (!confirm("לבטל את הקוד " + c.code + "? מי שמשתמש/ת בו לא תוכל/י להיכנס יותר.")) return;
            await api("codeRevoke", { code: c.code }); loadList();
          });
          cell.append(rv);
        }
        tr.append(cell); t.append(tr);
      });
      lc.append(el("div", { class: "tablewrap" }, t));
    };
    if (list) return draw(list);
    api("codesList").then(r => draw((r.codes || []).filter(c => c.kind === "staff")));
  }
  loadList(d.codes.filter(c => c.kind === "staff"));
}

// ── מרצה: קודים לסטודנטים (משוב לעבודות) ──
async function renderLecturer() {
  if (!has("lecturer")) return;
  const box = $("lecturer"); box.textContent = "";
  box.append(el("h2", {}, "קודים לסטודנטים — משוב לעבודות"));
  const card = el("div", { class: "card" });
  card.append(el("p", { class: "sub" }, "טוען..."));
  box.append(card);
  let d = await api("codesList").catch(() => ({}));
  const draw = () => {
    card.textContent = "";
    if (!d.codes) { card.append(el("p", { class: "msg err" }, "אין כרגע חיבור לשרת. נסו לרענן בעוד רגע.")); return; }
    const lim = (d.settings && d.settings.academic) || { maxActive: 50, days: 7, uses: 3 };
    const mine = d.codes.filter(c => c.kind === "student");
    const active = mine.filter(c => statusOf(c)[1] === "ok").length;
    card.append(el("p", { class: "sub" }, "כל קוד מיועד לסטודנט/ית אחד/ת: בתוקף " + lim.days + " ימים ומאפשר עד " + lim.uses +
      " הפקות משוב. אפשר להחזיק עד " + lim.maxActive + " קודים פעילים בו-זמנית. פעילים עכשיו: " + active + "."));
    const room = Math.max(0, lim.maxActive - active);
    const cnt = el("input", { type: "number", min: "1", max: String(Math.max(1, room)), value: String(Math.min(room || 1, 10)) });
    const lbl = el("input", { placeholder: "קורס או קבוצה (לא חובה)", maxlength: "60" });
    const go = el("button", { class: "btn", disabled: room === 0 }, "הפקת קודים");
    const msg = el("div", {});
    go.addEventListener("click", async () => {
      const n = Math.max(1, Math.min(room, Number(cnt.value) || 1));
      go.disabled = true; msg.className = "msg"; msg.textContent = "מפיקה...";
      const r = await api("codeCreate", { kind: "student", count: n, label: lbl.value.trim() }).catch(() => ({}));
      if (!r.codes) { msg.className = "msg err"; msg.textContent = r.error === "limit" ? "הגעת למספר הקודים הפעילים המרבי." : "ההפקה לא הצליחה. נסו שוב."; go.disabled = false; return; }
      d = await api("codesList").catch(() => d);
      draw();
      const list = r.codes.map(c => c.code).join("\n");
      const nb = el("div", { class: "newcodes" }, el("b", {}, r.codes.length + " קודים חדשים (תוקף עד " + fmtDate(r.codes[0].expiresAt) + "):"),
        el("div", { class: "code", style: "white-space:pre-wrap;margin:6px 0" }, list), copyBtn(list, "העתקת כל הקודים"));
      card.insertBefore(nb, card.children[2] || null);
    });
    card.append(el("div", { class: "row" }, el("div", {}, el("label", {}, "כמה קודים"), cnt), el("div", {}, el("label", {}, "תיאור"), lbl),
      el("div", { style: "flex:0" }, go)), msg);
    if (room === 0) card.append(el("p", { class: "msg err" }, "הגעת ל-" + lim.maxActive + " קודים פעילים. קודים חדשים יתאפשרו כשקודים יפוגו או ינוצלו."));
    if (mine.length) {
      const t = el("table", {}, el("tr", {}, ...["הקוד", "תיאור", "הפקות", "תוקף", "מצב", ""].map(h => el("th", {}, h))));
      mine.sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 200).forEach(c => {
        const [stl, stc] = statusOf(c);
        const cell = el("td", {});
        if (stc === "ok") {
          const rv = el("button", { class: "btn ghost sm" }, "ביטול");
          rv.addEventListener("click", async () => { await api("codeRevoke", { code: c.code }); d = await api("codesList"); draw(); });
          cell.append(rv);
        }
        t.append(el("tr", {}, el("td", {}, el("span", { class: "code" }, c.code)), el("td", {}, c.label || "—"),
          el("td", {}, (c.uses || 0) + " / " + c.maxUses), el("td", {}, fmtDate(c.expiresAt)), el("td", {}, el("span", { class: "st " + stc }, stl)), cell));
      });
      card.append(el("div", { class: "tablewrap" }, t));
    }
  };
  draw();
}

renderAdmin();
renderLecturer();
</script>
