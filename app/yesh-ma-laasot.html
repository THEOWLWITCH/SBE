     אותו קובץ מופץ גם כקובץ עצמאי (הלוגו בתוכו). קישור מתנה: ?to=&from=&msg= (ו-lang=ar). ראו CLAUDE.md. -->

<style>
/* עיצוב לחירום (19/10/2026): לשוניות עם איקונים בולטים ומילה או שתיים, מסך בית של אריחים בלי גלילה,
   רקע לבן עם מסגרות בצבעי הלוגו (כחול כהה, טורקיז, ירוק, שמש), כרטיס כיס אפור. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#F3F5F7; --fg:#0F2B45; --muted:#55657A; --line:#DCE3EA;
  --navy:#1B4F7A; --blue:#1C6FA8; --teal:#1A9BB5; --green:#3A9E6B; --sun:#FFC929; --amber:#D69A00;
  --frame:rgba(26,155,181,.55); --accent:var(--navy); --on-accent:#fff; --calm:var(--teal);
  --pocket:#E9EDF1; --pocket-line:#D2DAE2;
  --font-display:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:16px; --tabs-h:64px;
}
html[lang="ar"]{
  --font-display:"Noto Sans Arabic","Rubik",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  --font-body:"Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1420; --surface:#101C2A; --surface2:#16263A; --fg:#E8EEF5; --muted:#A3B2C7; --line:#26384D;
  --navy:#9CC8EA; --blue:#7AB8E8; --teal:#5FD0DE; --green:#79CF9B; --amber:#F2C14E; --frame:rgba(95,208,222,.5);
  --pocket:#1A2634; --pocket-line:#2A3A4D; --on-accent:#0B1420; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1420; --surface:#101C2A; --surface2:#16263A; --fg:#E8EEF5; --muted:#A3B2C7; --line:#26384D;
  --navy:#9CC8EA; --blue:#7AB8E8; --teal:#5FD0DE; --green:#79CF9B; --amber:#F2C14E; --frame:rgba(95,208,222,.5);
  --pocket:#1A2634; --pocket-line:#2A3A4D; --on-accent:#0B1420; color-scheme:dark }

html{font-size:106.25%;direction:rtl}
html.fs1{font-size:118.75%} html.fs2{font-size:131.25%}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#FFC929}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;text-wrap:balance;margin:0;color:var(--fg)}
h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:28px;height:28px;flex:none;display:block}
.ic.sm{width:20px;height:20px}.ic.lg{width:40px;height:40px}.ic.xl{width:48px;height:48px}

/* header */
header.top{position:relative;z-index:1;background:#FFC929;color:#0f2b45}
.top .row1{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.15rem;font-weight:700;color:#0f2b45}
.brand small{display:block;color:#5b4a1f;font-size:.8rem;line-height:1.35}
.tools{display:flex;gap:6px}
.bglogo{flex:none;display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:4px 6px}
.bglogo img{height:34px;width:auto;display:block}
@media screen and (max-width:520px){.top .row1{gap:8px;padding-block:8px}.bglogo{padding:3px 5px}.bglogo img{height:26px}.brand h1{font-size:1.02rem;white-space:nowrap}.brand small{display:none}.tools{gap:4px}.iconbtn{min-width:40px;min-height:40px;padding:0 6px}}
.bgline{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bgline img{height:30px;width:auto;background:#fff;border-radius:6px;padding:3px 5px;border:1px solid var(--line)}
html.embed .bglogo{display:none}
.iconbtn{min-width:44px;min-height:44px;border-radius:10px;border:1px solid #0f2b4533;background:#ffffff8c;color:#0f2b45;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;padding:0 8px}
.langbtn{font-family:"Noto Sans Arabic","Heebo",system-ui,sans-serif;font-size:.95rem;padding:0 10px}

main{padding-block:12px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:12px}

/* 104 / 100 */
.infobar{display:flex;gap:8px}
.infobar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:.9rem;line-height:1.2}
.infobar a b{font-family:var(--font-display);font-size:1.25rem;color:var(--navy);font-variant-numeric:tabular-nums}
.infobar a span{color:var(--muted)}

/* הכפתור הראשי: שיפוע הלוגו, אייקון חי */
.hero{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:16px;min-height:104px;padding:14px 18px;border-radius:24px;text-align:right;border:0;color:#fff;
  background:linear-gradient(115deg,#1B4F7A 0%,#1A9BB5 52%,#3A9E6B 100%);background-size:180% 180%;animation:heroBg 9s ease-in-out infinite alternate;
  box-shadow:0 14px 30px -14px rgba(27,79,122,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);transform:translateX(120%);animation:sweep 4.5s ease-in-out 1.2s infinite;pointer-events:none}
.hero:active{transform:scale(.985)}
.hero .htxt{flex:1;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.hero strong{font-family:var(--font-display);font-size:clamp(1.3rem,6.2vw,1.75rem);white-space:nowrap;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.1}
.hero .hsub{font-size:.9rem;font-weight:600;color:#FFE27A}
.hero .go{position:relative;z-index:1;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.45);animation:nudge 1.6s ease-in-out infinite}
.hero .go svg{width:22px;height:22px;transform:scaleX(-1)}
html[dir="ltr"] .hero .go svg{transform:none}
.beacon{position:relative;z-index:1;flex:none;width:76px;height:76px;display:grid;place-items:center}
.beacon .core{position:relative;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,201,41,.9),0 8px 18px -6px rgba(0,0,0,.35)}
.beacon .rip{position:absolute;inset:3px;border-radius:50%;border:3px solid #FFC929;opacity:0;animation:ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.beacon .rip.r2{animation-delay:.8s}.beacon .rip.r3{animation-delay:1.6s;border-color:#fff}
.nowart{width:54px;height:54px;overflow:visible}
.nowart .sun{transform-origin:38.5px 9.5px;animation:sun 2.4s ease-in-out infinite}
.nowart .halo{transform-origin:38.5px 9.5px;animation:halo 2.4s ease-in-out infinite}
.nowart .kid{transform-box:fill-box;transform-origin:center bottom;animation:bob 2.4s ease-in-out infinite}
.nowart .kid.k2{animation-delay:.3s}
.nowart .wv{stroke-dasharray:6 4;animation:wave 1.8s linear infinite}
@keyframes heroBg{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes sweep{0%{transform:translateX(120%)}55%,100%{transform:translateX(-120%)}}
@keyframes ripple{0%{transform:scale(.92);opacity:.85}100%{transform:scale(1.42);opacity:0}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.0}50%{transform:scale(2.3);opacity:.45}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}
@keyframes wave{to{stroke-dashoffset:-20}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
html[dir="ltr"] .hero .go{animation-name:nudgeL}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* אריחי הבית */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:12px 6px 10px;border-radius:20px;
  border:1.5px solid var(--frame);background:var(--surface);color:var(--fg);font-family:var(--font-display);font-size:1.02rem;font-weight:600;text-align:center;line-height:1.2;
  box-shadow:0 6px 14px -12px rgba(27,79,122,.6);transition:transform .18s ease,box-shadow .18s ease,border-color .18s;animation:tileIn .5s cubic-bezier(.2,.7,.3,1.2) both}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#3A9E6B,#1A9BB5,#1B4F7A)}
.tile::after{content:"";position:absolute;top:8px;right:7px;width:46px;height:58px;border-top:2px solid #FFC929;border-right:2px solid #FFC929;border-top-right-radius:15px;pointer-events:none;
  -webkit-mask:linear-gradient(to left,#000 30%,transparent),linear-gradient(to bottom,#000 30%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(to left,#000 30%,transparent) intersect,linear-gradient(to bottom,#000 30%,transparent)}
.tile .ic.lg{width:50px;height:50px;padding:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--frame);transition:transform .25s cubic-bezier(.2,.7,.3,1.4)}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 22px -14px rgba(27,79,122,.7)}
.tile:hover .ic.lg{transform:scale(1.1) rotate(-4deg)}
.tile:active{transform:scale(.97)}
.tile:nth-child(3n+2){border-color:rgba(27,79,122,.45)}.tile:nth-child(3n){border-color:rgba(58,158,107,.55)}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}
@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.hero,.hero::after,.hero .go,.beacon .rip,.nowart *,.tile{animation:none!important}.hero::after{display:none}.tile{transition:none}}
@media screen and (max-width:340px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{display:flex;flex-direction:column;gap:12px}
.phead{display:flex;align-items:center;gap:10px}
.phead h2{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--navy);font-weight:500}

.card{background:var(--surface);border:1.5px solid var(--frame);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card > h2{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:500}
.lead{color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--frame);background:var(--surface);color:var(--navy);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.primary,.btn[aria-pressed="true"]{background:linear-gradient(100deg,#1B4F7A,#1A9BB5);color:#fff;border-color:transparent}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--blue);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:44px;text-align:right}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.95rem;color:var(--fg)}
.seg button[aria-pressed="true"]{border-color:var(--teal);color:var(--navy);font-weight:700;box-shadow:inset 0 0 0 1px var(--teal)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px}
.steps button b{font-family:var(--font-display);font-size:1.35rem;color:var(--navy)}
.steps button small{font-size:.72rem;color:var(--muted)}
.steps button[aria-current="step"]{border:2px solid var(--teal);box-shadow:0 4px 12px -8px var(--teal)}
.steps button[aria-current="step"] b{color:var(--teal)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media screen and (max-width:520px){.dd{grid-template-columns:1fr}}
.dd > div{border-radius:12px;padding:10px 12px;min-width:0;background:var(--surface);border:1px solid var(--line)}
.do{border-inline-start:4px solid var(--green)!important} .dont{border-inline-start:4px solid var(--amber)!important}
.dd h4{margin:0 0 4px;font-size:.95rem}
.do h4{color:var(--green)} .dont h4{color:var(--amber)}
.dd ul{margin:0;padding-inline-start:18px}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--amber);background:var(--surface);padding:10px 12px;border-radius:10px;font-size:.95rem}
.phrase{display:flex;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--teal);border-radius:12px;padding:9px 12px}
.phrase q{flex:1;quotes:none;font-weight:500;min-width:0}
.copy{flex:none;min-width:40px;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}

.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:6px}
.ringwrap{width:230px;height:230px;max-width:100%;display:grid;place-items:center;position:relative}
.ring{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#BDE7EE,#1A9BB5 55%,#1B4F7A);transform:scale(1);transition:transform 1s ease-in-out;box-shadow:0 10px 30px -12px rgba(27,79,122,.6)}
.ringwrap::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--frame)}
.phase{font-family:var(--font-display);font-size:1.55rem;text-align:center;color:var(--navy)}
.count{font-size:2.4rem;font-family:var(--font-display);font-variant-numeric:tabular-nums;line-height:1;color:var(--teal)}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--muted);font-size:.92rem}
.toggle input{width:22px;height:22px;accent-color:var(--teal)}
@media (prefers-reduced-motion: reduce){.ring{transition:none!important}}

.gitem{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.gitem input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--teal)}
.gitem b{font-family:var(--font-display);font-size:1.4rem;line-height:1;color:var(--teal);min-width:1.2ch}
.gitem.done{opacity:.55} .gitem.done span{text-decoration:line-through}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1B4F7A,#1A9BB5,#3A9E6B);transition:width .3s}

.hgrid{display:grid;grid-template-columns:1fr;gap:8px}
.hcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.hcard summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:54px;cursor:pointer}
.hcard summary::-webkit-details-marker{display:none}
.hcard summary .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);border:1.5px solid var(--teal);color:var(--navy);font-family:var(--font-display);font-weight:700}
.hcard summary .t{flex:1}
.hcard summary .t small{display:block;color:var(--muted);font-size:.85rem}
.hcard .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.hcard ul{margin:0;padding-inline-start:18px}

.filters{display:flex;flex-direction:column;gap:12px}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:4px}
.summaryline{font-size:.92rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.badge.p{border-color:var(--teal);color:var(--teal);font-weight:500}
.match{font-size:.9rem;border:1px solid var(--line);border-inline-start:4px solid var(--amber);border-radius:10px;padding:8px 12px}
.plan{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.plan .mins{grid-row:span 2;min-width:56px;text-align:center;border-radius:10px;border:1.5px solid var(--frame);padding:6px 4px;font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;line-height:1.2;color:var(--navy)}
.plan .mins small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.plan h4{margin:0;font-size:1rem}
.say{display:flex;flex-direction:column;gap:8px}
.adapt{display:flex;flex-direction:column;gap:8px}
.adapt div{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:.95rem}
.adapt div b{display:block;font-size:.85rem;color:var(--teal);font-weight:500}
.alarmbox{border:1.5px solid var(--blue);border-radius:12px;padding:10px 12px;font-size:.95rem}
.alarmbox b{color:var(--blue)}

/* כרטיס כיס: אפור */
.pocket{background:var(--pocket);color:var(--fg);border:1px solid var(--pocket-line);border-radius:18px;padding:16px;display:grid;gap:12px}
.pocket h2{font-size:1.15rem}
.pocket .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pocket .cols > div{min-width:0}
.pocket h3{font-size:.9rem;color:var(--navy);font-family:var(--font-body);font-weight:700;margin-bottom:4px}
.pocket ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.9rem;line-height:1.4}
.pocket li{display:flex;gap:6px}
.pocket li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:.45em;background:var(--teal)}
.pocket li.x::before{background:transparent;border:2px solid var(--amber)}
.pocket .foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--pocket-line);padding-top:8px}
.fav{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fav .h{display:flex;align-items:center;gap:8px}
.fav .h h3{flex:1;font-size:1rem}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.credits{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-block:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--green)}
.dev{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}

/* לשוניות */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px -14px rgba(15,43,69,.5);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;min-height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--muted);position:relative}
nav.tabs button .ic{width:30px;height:30px;filter:grayscale(1);opacity:.55;transition:opacity .15s}
nav.tabs button[aria-selected="true"]{color:var(--navy);font-weight:700}
nav.tabs button[aria-selected="true"] .ic{filter:none;opacity:1}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#1B4F7A,#1A9BB5,#3A9E6B)}

.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .wrap{padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
.ovhead{display:flex;align-items:center;gap:10px}
.ovhead h2{flex:1}
.closebtn{min-width:46px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.bigsay{font-family:var(--font-display);font-size:1.5rem;line-height:1.4;color:var(--navy);border-radius:18px;padding:16px;
  border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(100deg,#1B4F7A,#1A9BB5,#3A9E6B) border-box}
.threedo{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:n}
.threedo li{display:flex;gap:12px;align-items:flex-start;font-size:1.06rem;counter-increment:n}
.threedo li::before{content:counter(n);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--teal);color:var(--navy);font-weight:700;font-family:var(--font-display)}
.nowgo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nowgo button{min-height:96px;border-radius:18px;border:1.5px solid var(--frame);background:var(--surface);color:var(--fg);font-family:var(--font-display);font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;line-height:1.2}
.flag{border:1px solid var(--line);border-inline-start:4px solid var(--amber);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.flag h3{font-size:1.02rem}
.boundary{border:2px solid var(--navy);color:var(--navy);border-radius:14px;padding:12px 14px;font-family:var(--font-display);font-size:1.08rem}

.devlink{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.menulist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;counter-reset:m}
@media screen and (max-width:420px){.menulist{grid-template-columns:1fr}}
.menulist li{counter-increment:m;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.menulist li::before{content:counter(m);flex:none;min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--teal);color:var(--navy);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media screen and (max-width:560px){.signs{grid-template-columns:1fr}}
.signs > div{border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:12px;padding:10px 12px;min-width:0}
.signs h4{margin:0 0 4px;font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--navy)}
.signs ul{margin:0;padding-inline-start:18px;font-size:.93rem;display:grid;gap:2px}
.rules{border-radius:12px;padding:10px 12px;border:1px solid var(--frame);font-size:.93rem}
.rules b{display:block;color:var(--teal);margin-bottom:2px}
.rules ul{margin:0;padding-inline-start:18px}
.stopgo{display:grid;gap:6px;margin-top:4px}
.stopgo div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stopgo b{font-family:var(--font-display);color:var(--teal);min-width:3.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px #0008}
.toast button{border:0;background:none;color:#fff;font-weight:700;text-decoration:underline;min-height:40px}

.gift{position:fixed;inset:0;z-index:70;background:rgba(15,43,69,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.giftcard{background:var(--surface);color:var(--fg);border-radius:22px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 20px 50px -12px #0008;text-align:center}
.giftcard .top{background:#FFC929;padding:22px 18px 16px;display:grid;justify-items:center;gap:10px;color:#0f2b45}
.giftcard .bow{font-size:2.6rem;line-height:1}
.giftcard h2{font-size:1.45rem;color:#0f2b45}
.giftcard .body{padding:16px 18px 20px;display:grid;gap:12px}
.giftcard .from{font-weight:700;color:var(--teal)}
.giftcard blockquote{margin:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-inline-start:3px solid var(--teal);font-size:1.02rem;white-space:pre-line;text-align:right}
.giftcard .btn.primary{justify-content:center;font-size:1.05rem;min-height:52px}
.giftcard small{color:var(--muted)}
.ribbon{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;border:1.5px solid var(--sun);font-size:.92rem}

/* ===== חתימה אחידה: פס עליון בצבעי הלוגו וקשת צהובה בפינה הימנית, ותנועה עדינה בכל המסכים ===== */
.card,.pocket,.nowgo button,.bigsay{position:relative;overflow:hidden}
.card::before,.pocket::before,.nowgo button::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#3A9E6B,#1A9BB5,#1B4F7A);pointer-events:none}
.card::after,.pocket::after,.nowgo button::after,.bigsay::after{content:"";position:absolute;top:8px;right:7px;width:46px;height:58px;border-top:2px solid #FFC929;border-right:2px solid #FFC929;border-top-right-radius:15px;pointer-events:none;
  -webkit-mask:linear-gradient(to left,#000 30%,transparent),linear-gradient(to bottom,#000 30%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(to left,#000 30%,transparent) intersect,linear-gradient(to bottom,#000 30%,transparent)}
.card{border-radius:20px;padding:18px 18px 16px;box-shadow:0 8px 20px -16px rgba(27,79,122,.55)}
.card > h2,.phead h2,.ovhead h2{padding-inline-end:34px}
.pocket{border-radius:20px;padding:20px 18px 16px}

/* כניסה רכה של מסכים, לוחות וכרטיסים */
.view:not([hidden]),.panel:not([hidden]){animation:viewIn .35s ease both}
.view .card,.panel .card,.pocket{animation:cardIn .5s cubic-bezier(.2,.7,.3,1.1) both}
.view .card:nth-of-type(2),.panel .card:nth-of-type(2){animation-delay:.08s}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* כותרת הלוח וכפתור החזרה */
.phead h2,.ovhead h2{position:relative;padding-bottom:6px}
.phead h2::after,.ovhead h2::after{content:"";position:absolute;bottom:0;right:0;width:46px;height:3px;border-radius:3px;background:linear-gradient(90deg,#FFC929,#1A9BB5);animation:grow .6s .1s cubic-bezier(.2,.7,.3,1.2) both;transform-origin:right}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.back,.closebtn{border-color:var(--frame);color:var(--navy);transition:transform .15s,box-shadow .15s}
.back:hover,.closebtn:hover{box-shadow:0 6px 14px -10px rgba(27,79,122,.7);transform:translateY(-1px)}


/* כפתורים */
.btn{border-radius:14px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 16px -12px rgba(27,79,122,.8)}
.btn:active{transform:scale(.97)}
.btn.primary,.btn[aria-pressed="true"]{background:linear-gradient(110deg,#1B4F7A,#1A9BB5 60%,#3A9E6B);background-size:160% 100%;transition:background-position .4s,transform .15s,box-shadow .15s;box-shadow:0 8px 18px -12px rgba(27,79,122,.9)}
.btn.primary:hover{background-position:100% 0}
.btn.primary,.btn[aria-pressed="true"],.btn.ghost[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button{transition:all .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(110deg,#1B4F7A,#1A9BB5);color:#fff;border-color:transparent;box-shadow:0 6px 14px -10px rgba(27,79,122,.9)}

/* הדקה הראשונה */
.overlay:not([hidden]) .wrap{animation:sheetIn .4s cubic-bezier(.2,.7,.3,1.1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.threedo li{padding:4px 0;animation:cardIn .45s cubic-bezier(.2,.7,.3,1.1) both}
.threedo li:nth-child(2){animation-delay:.12s}.threedo li:nth-child(3){animation-delay:.24s}
.threedo li::before{width:36px;height:36px;border:0;color:#fff;background:linear-gradient(135deg,#1B4F7A,#1A9BB5 60%,#3A9E6B);box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px #FFC929;font-size:1.05rem}
.bigsay{padding:20px 20px 18px;border-width:2.5px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(100deg,#1B4F7A,#1A9BB5,#3A9E6B,#1A9BB5,#1B4F7A) border-box;background-size:100% 100%,300% 100%;animation:borderFlow 6s linear infinite,cardIn .5s .3s both}
@keyframes borderFlow{to{background-position:0 0,300% 0}}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--teal);letter-spacing:.02em}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:#FFC929;box-shadow:0 0 0 3px rgba(255,201,41,.25)}
.nowgo button{min-height:108px;border-radius:20px;font-weight:600;box-shadow:0 6px 14px -12px rgba(27,79,122,.6);transition:transform .18s,box-shadow .18s;animation:tileIn .5s cubic-bezier(.2,.7,.3,1.2) both;animation-delay:.4s}
.nowgo button:nth-child(2){animation-delay:.47s;border-color:rgba(27,79,122,.45)}.nowgo button:nth-child(3){animation-delay:.54s;border-color:rgba(58,158,107,.55)}
.nowgo .ic.lg{width:50px;height:50px;padding:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--frame);transition:transform .25s cubic-bezier(.2,.7,.3,1.4)}
.nowgo button:hover{transform:translateY(-3px);box-shadow:0 14px 22px -14px rgba(27,79,122,.7)}
.nowgo button:hover .ic.lg{transform:scale(1.1) rotate(-4deg)}
.flag{border-inline-start-color:#FFC929;border-radius:16px;animation:cardIn .45s both}

/* מעש"ה: שלבים */
.steps button{border-radius:16px;border-color:var(--frame);transition:transform .2s,box-shadow .2s,background .2s}
.steps button:hover{transform:translateY(-2px)}
.steps button[aria-current="step"]{border-color:transparent;background:linear-gradient(135deg,#1B4F7A,#1A9BB5 60%,#3A9E6B);box-shadow:0 10px 18px -12px rgba(27,79,122,.9),inset 0 -3px 0 #FFC929}
.steps button[aria-current="step"] b,.steps button[aria-current="step"] small{color:#fff}
#masehBody{animation:cardIn .4s both}
.dd > div{border-radius:14px;animation:cardIn .45s both}.dd > div:nth-child(2){animation-delay:.08s}
.phrase{border-radius:14px;border-inline-start-width:4px;transition:transform .15s,box-shadow .15s}
.phrase:hover{transform:translateX(-2px);box-shadow:0 6px 14px -12px rgba(27,79,122,.7)}
.copy{transition:color .15s,border-color .15s}.copy:hover{color:var(--teal);border-color:var(--teal)}

/* כרטיסים נפתחים: עקרונות, לדבר */
.hcard{border-color:var(--frame);border-radius:16px;transition:box-shadow .2s}
.hcard[open]{box-shadow:0 10px 20px -16px rgba(27,79,122,.7);border-color:var(--teal)}
.hcard summary .dot{border:0;color:#fff;background:linear-gradient(135deg,#1B4F7A,#1A9BB5 60%,#3A9E6B);transition:transform .3s cubic-bezier(.2,.7,.3,1.4)}
.hcard[open] summary .dot{transform:rotate(-8deg) scale(1.08);box-shadow:0 0 0 2.5px var(--surface),0 0 0 4px #FFC929}
.hcard[open] .body{animation:cardIn .35s both}

/* נשימה */
.ringwrap::before{border:2px dashed var(--frame);animation:spin 40s linear infinite}
.ringwrap::after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px solid #FFC929;opacity:.5;animation:haloRing 4s ease-in-out infinite}
.ring{background:radial-gradient(circle at 36% 30%,#fff 0,#BDE7EE 14%,#1A9BB5 55%,#1B4F7A);box-shadow:0 14px 34px -12px rgba(27,79,122,.7),0 0 0 6px rgba(26,155,181,.12)}
.phase{font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes haloRing{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.04);opacity:.7}}

/* קרקוע */
.gitem{border-color:var(--frame);border-radius:16px;transition:transform .15s,box-shadow .15s,opacity .3s;animation:cardIn .45s both}
.gitem:nth-child(2){animation-delay:.05s}.gitem:nth-child(3){animation-delay:.1s}.gitem:nth-child(4){animation-delay:.15s}.gitem:nth-child(5){animation-delay:.2s}
.gitem:hover{transform:translateY(-1px);box-shadow:0 8px 16px -12px rgba(27,79,122,.7)}
.gitem b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;flex:none;color:#fff;font-size:1.15rem;background:linear-gradient(135deg,#1B4F7A,#1A9BB5 60%,#3A9E6B)}
.gitem.done{opacity:.6}.gitem.done b{background:#FFC929;color:#0f2b45}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,#1B4F7A,#1A9BB5,#3A9E6B,#FFC929)}

/* פעילות */
.plan li{animation:cardIn .45s both}.plan li:nth-child(2){animation-delay:.08s}.plan li:nth-child(3){animation-delay:.16s}
.plan .mins{border:0;color:#fff;background:linear-gradient(135deg,#1B4F7A,#1A9BB5 60%,#3A9E6B);box-shadow:inset 0 -3px 0 #FFC929;border-radius:14px}
.plan .mins small{color:#E6F6F9}
.badge.p{background:linear-gradient(110deg,#1B4F7A,#1A9BB5);color:#fff;border-color:transparent}
.match{border-inline-start-color:#FFC929;border-radius:14px}

/* כרטיס כיס ושמורים */
.pocket h3{display:flex;align-items:center;gap:6px}
.pocket h3::before{content:"";width:14px;height:3px;border-radius:3px;background:#FFC929}
.fav{border-color:var(--frame);border-radius:16px;animation:cardIn .45s both}

/* לשוניות */
nav.tabs button[aria-selected="true"] .ic{animation:pop .35s cubic-bezier(.2,.7,.3,1.6)}
nav.tabs button[aria-selected="true"]::before{background:linear-gradient(90deg,#1B4F7A,#1A9BB5,#3A9E6B,#FFC929)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}

@media (prefers-reduced-motion: reduce){
  .view,.panel,.card,.pocket,.overlay .wrap,.threedo li,.bigsay,.nowgo button,.flag,#masehBody,.dd > div,.hcard .body,.ringwrap::before,.ringwrap::after,.gitem,.plan li,.fav,nav.tabs .ic,.phead h2::after,.ovhead h2::after{animation:none!important}
  .btn,.tile,.gitem,.phrase,.steps button{transition:none}
}

/* פרח ונר */
.fcscene{display:none;width:270px;max-width:100%}
.fcscene svg{width:100%;height:auto;display:block;overflow:visible}
.breath.kids .fcscene{display:block}.breath.kids .ringwrap{display:none}
.fcscene .petals{transform-origin:190px 82px;transition:transform var(--d,3s) ease-in-out}
.fcscene .scent path{opacity:0;stroke-dasharray:22;stroke-dashoffset:22}
.fcscene .flame{transform-origin:70px 104px;animation:flick 2.2s ease-in-out infinite}
.fcscene .glow{transform-origin:70px 92px;animation:glow 2.2s ease-in-out infinite}
.fcscene .puff path{opacity:0}
.fcscene[data-k="in"] .petals{transform:scale(1.14) rotate(8deg)}
.fcscene[data-k="in"] .scent path{animation:scent 1.6s ease-out infinite}
.fcscene[data-k="in"] .scent path:nth-child(2){animation-delay:.35s}.fcscene[data-k="in"] .scent path:nth-child(3){animation-delay:.7s}
.fcscene[data-k="out"] .flame{animation:lean 1.4s ease-in-out infinite}
.fcscene[data-k="out"] .puff path{animation:puff 1.4s ease-in-out infinite}
.fcscene[data-k="out"] .puff path:nth-child(2){animation-delay:.25s}.fcscene[data-k="out"] .puff path:nth-child(3){animation-delay:.5s}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
@keyframes scent{0%{opacity:0;stroke-dashoffset:22;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-8px)}}
@keyframes lean{0%,100%{transform:rotate(-10deg) scale(.96,1)}50%{transform:rotate(-22deg) scale(.9,.94)}}
@keyframes puff{0%{opacity:0;transform:translateX(10px)}35%{opacity:.75}100%{opacity:0;transform:translateX(-26px)}}
@media (prefers-reduced-motion: reduce){.fcscene *{animation:none!important;transition:none!important}.fcscene[data-k="in"] .scent path{opacity:.7;stroke-dashoffset:0}.fcscene[data-k="out"] .puff path{opacity:.7}.fcscene[data-k="out"] .flame{transform:rotate(-14deg)}}

.speedrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.seg.sm button{min-height:36px;padding:0 12px;font-size:.88rem}
.fcscene .flower,.fcscene .candle{transition:transform .7s cubic-bezier(.3,.7,.3,1),opacity .6s ease}
.fcscene[data-k="in"] .flower{transform:translateX(-60px)}
.fcscene[data-k="in"] .candle{opacity:0;transform:translateX(60px) scale(.9)}
.fcscene[data-k="out"] .candle{transform:translateX(60px)}
.fcscene[data-k="out"] .flower{opacity:0;transform:translateX(-60px) scale(.9)}
.fcscene .candle{transform-origin:70px 178px}.fcscene .flower{transform-origin:190px 178px}

/* תפריט ויסות: כל פריט בצבע אחר מצבעי הלוגו */
.menulist li{--c:#1B4F7A;--cf:#fff;border-color:var(--frame);border-radius:14px;align-items:center;animation:cardIn .4s both;transition:transform .15s,box-shadow .15s}
.menulist li:nth-child(4n+2){--c:#1A9BB5}
.menulist li:nth-child(4n+3){--c:#3A9E6B}
.menulist li:nth-child(4n){--c:#FFC929;--cf:#0f2b45}
.menulist li::before{min-width:30px;height:30px;border:0;background:var(--c);color:var(--cf);font-size:.9rem;box-shadow:0 3px 8px -4px var(--c)}
.menulist li:hover{transform:translateY(-1px);box-shadow:0 8px 16px -12px rgba(27,79,122,.7)}
.menulist li:nth-child(2){animation-delay:0.04s}.menulist li:nth-child(3){animation-delay:0.08s}.menulist li:nth-child(4){animation-delay:0.12s}.menulist li:nth-child(5){animation-delay:0.16s}.menulist li:nth-child(6){animation-delay:0.20s}.menulist li:nth-child(7){animation-delay:0.24s}.menulist li:nth-child(8){animation-delay:0.28s}.menulist li:nth-child(9){animation-delay:0.32s}.menulist li:nth-child(10){animation-delay:0.36s}.menulist li:nth-child(11){animation-delay:0.40s}.menulist li:nth-child(12){animation-delay:0.44s}
@media (prefers-reduced-motion: reduce){.menulist li{animation:none!important;transition:none}}

/* כרטיסים נפתחים: משפט לדוגמה בצד, וחץ */
.hcard summary .chev{flex:none;width:20px;height:20px;color:var(--teal);transform:rotate(90deg);transition:transform .25s}
.hcard[open] summary .chev{transform:rotate(-90deg)}
.hcard summary .ill{display:none}
@media screen and (min-width:640px){
  .hcard summary .ill{display:block;flex:none;width:96px;height:64px;margin-inline-start:auto;transition:transform .35s cubic-bezier(.2,.7,.3,1.3)}

}

/* קרקוע: איור לכל חוש */
.gitem{align-items:center}
.gitem span{flex:1;min-width:0}
.gitem .ill{flex:none;width:72px;height:48px;transition:transform .3s cubic-bezier(.2,.7,.3,1.3),opacity .3s,filter .3s}
.gitem:hover .ill{transform:translateY(-2px) scale(1.06)}
.gitem.done .ill{filter:grayscale(.6);opacity:.6}
@media screen and (max-width:520px){.gitem{gap:8px;padding:10px}.gitem .ill{width:46px;height:31px}.gitem b{width:34px;height:34px;font-size:1.05rem}}

const tx=a=>lang==="ar"?Object.assign({},a,AR[a.id]):a;

/* ================= toast & copy ================= */
let toastT;
function toast(msg,actLabel,actFn){
  $("#toastMsg").textContent=msg;const b=$("#toastAct");
  if(actLabel){b.hidden=false;b.textContent=actLabel;b.onclick=()=>{actFn();$("#toast").hidden=true}}else{b.hidden=true;b.onclick=null}
  $("#toast").hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{$("#toast").hidden=true},actLabel?6000:2200);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);
  toast(ok?t("copied"):t("copyFail"));
}
function copy(text){try{navigator.clipboard.writeText(text).then(()=>toast(t("copied")),()=>fallbackCopy(text))}catch(e){fallbackCopy(text)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b)copy(b.getAttribute("data-copy"))});
const phraseHTML=s=>`<div class="phrase"><q>${esc(s)}</q><button class="copy" data-copy="${esc(s)}" aria-label="${t("copyAria")}">${ICON_COPY}</button></div>`;

/* ================= settings ================= */
let theme=store.get("theme",null); if(theme) root.setAttribute("data-theme",theme);
$("#themeBtn").onclick=()=>{const dark=root.getAttribute("data-theme")?root.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme=dark?"light":"dark";root.setAttribute("data-theme",theme);store.set("theme",theme)};
let fs=store.get("fs",0);
const applyFs=()=>{root.classList.remove("fs1","fs2");if(fs)root.classList.add("fs"+fs);$("#fsBtn").textContent=lang==="ar"?["أ+","أ++","أ"][fs]:["א+","א++","א"][fs]};
$("#fsBtn").onclick=()=>{fs=(fs+1)%3;applyFs();store.set("fs",fs)};
$("#langBtn").onclick=()=>{lang=lang==="he"?"ar":"he";store.set("lang",lang);renderAll()};

/* ================= tabs & overlays ================= */
const TABS=["now","breath","ground","gen","pocket"];
function showTab(k){
  if(!TABS.includes(k))k="now";
  $$("nav.tabs [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===k?"true":"false"));
  TABS.forEach(x=>{$("#v-"+x).hidden=x!==k});
  if(k==="now")showPanel(null);
  store.set("tab",k);window.scrollTo(0,0);
}
function showPanel(id){
  $$("#v-now .panel").forEach(p=>{p.hidden=p.id!=="p-"+id});
  ["#homeTiles","#nowBtn"].forEach(s=>{$(s).hidden=!!id});
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const p=e.target.closest("[data-panel]");if(p)showPanel(p.dataset.panel);if(e.target.closest("[data-back]"))showPanel(null)});
$$("nav.tabs [role=tab]").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let lastFocus=null;
function openOv(id){lastFocus=document.activeElement;$$(".overlay").forEach(o=>o.hidden=true);const o=$("#ov-"+id);o.hidden=false;o.scrollTop=0;document.body.style.overflow="hidden";const c=o.querySelector("[data-close]");c&&c.focus()}
function closeOv(){$$(".overlay").forEach(o=>o.hidden=true);document.body.style.overflow="";lastFocus&&lastFocus.focus&&lastFocus.focus()}
$("#nowBtn").onclick=()=>openOv("now");
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o)openOv(o.dataset.open);if(e.target.closest("[data-close]"))closeOv()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv()});
$$("#ov-now [data-go]").forEach(b=>b.onclick=()=>{
  closeOv();const g=b.dataset.go;
  if(g==="breath"){showTab("breath");startBreath()}
  if(g==="ground"){showTab("ground")}
  if(g==="act"){F.space="shelter";F.equip="none";F.dur="10";store.set("filters",F);renderFilters();runGen(0);showTab("gen")}
});

/* ================= static text ================= */
function renderStatic(){
  root.setAttribute("lang",lang);root.setAttribute("dir","rtl");
  document.title=t("appName");
  $$("[data-t]").forEach(el=>{el.textContent=t(el.dataset.t)});
  $$("[data-ta]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.ta))});
  const lb=$("#langBtn");lb.textContent=t("langBtn");lb.setAttribute("lang",lang==="he"?"ar":"he");lb.setAttribute("aria-label",t("langLabel"));
  $$("[data-infobar]").forEach(el=>{el.innerHTML=`<a href="tel:104"><svg class="ic sm" aria-hidden="true"><use href="#i-phone"/></svg><b>104</b><span>${t("hot104")}</span></a><a href="tel:100"><svg class="ic sm" aria-hidden="true"><use href="#i-phone"/></svg><b>100</b><span>${t("hot100")}</span></a>`});
  $("#nowThree").innerHTML=t("nowThree").map(s=>`<li>${esc(s)}</li>`).join("");
  const li=arr=>arr.map(([s,x])=>`<li${x?' class="x"':""}>${esc(s)}</li>`).join("");
  $("#pocketCard").innerHTML=`<h2>${t("pocketTitle")}</h2><div class="cols"><div><h3>${t("during")}</h3><ul>${li(t("pocketDuring"))}</ul></div><div><h3>${t("after")}</h3><ul>${li(t("pocketAfter"))}</ul></div></div><div class="foot">${t("pocketFoot")}</div>`;
  $("#selfList").innerHTML=t("self").map(s=>`<li>${esc(s)}</li>`).join("");
  $("#flagList").innerHTML=FLAGS[lang].map(f=>`<div class="flag"><h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></div>`).join("");
  $("#sensitive").innerHTML=SENS[lang].map(s=>`<div class="adapt"><div><b>${esc(s[0])}</b>${esc(s[1])}</div></div>`).join("");
  const TK=L(TALK);
  $("#talkList").innerHTML=TK.map((s,i)=>`<details class="hcard"${i===0?" open":""}><summary><span class="dot">${i+1}</span><span class="t"><b>${s.n}</b><small>${s.how}</small></span><svg class="ill" aria-hidden="true"><use href="#il-${["listen","empathy","valid","groundt"][i]||"listen"}"/></svg><svg class="chev" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-back"/></svg></summary><div class="body">${s.say.map(phraseHTML).join("")}</div></details>`).join("");
  $("#talkAge").innerHTML=`<div class="do"><h4>${t("youngTitle")}</h4><ul>${TALK.young.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="do"><h4>${t("olderTitle")}</h4><ul>${TALK.older.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="dont" style="grid-column:1/-1"><h4>${t("dontH")}</h4><ul>${TALK.avoid.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  $("#menuList").innerHTML=L(MENU).map(x=>`<li>${esc(x)}</li>`).join("");
  $("#signs").innerHTML=`<h3>${t("signsTitle")}</h3><p class="lead">${t("signsLead")}</p><div class="signs">${L(SIGNS).map(([age,arr])=>`<div><h4 dir="ltr" style="text-align:right">${age}</h4><ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div><p class="lead" style="font-size:.9rem">${t("signsNd")}</p>`;
  $("#stopgo").innerHTML=`<h3 style="margin-top:6px">${t("stopTitle")}</h3><p class="lead">${t("stopLead")}</p><div class="stopgo">${L(STOPGO).map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("")}</div><h3 style="margin-top:10px">${t("buddyTitle")}</h3><p>${t("buddyText")}</p>`;
  $("#hobfoll").innerHTML=Object.entries(HOB[lang]).map(([hk,h])=>`<details class="hcard"><summary><span class="dot">${h.n[0]}</span><span class="t"><b>${h.n}</b><small>${h.s}</small></span><svg class="ill" aria-hidden="true"><use href="#il-${hk}"/></svg><svg class="chev" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-back"/></svg></summary><div class="body"><ul>${h.acts.map(a=>`<li>${a}</li>`).join("")}</ul>${phraseHTML(h.say)}</div></details>`).join("");
  applyFs();
}

/* ================= MASEH ================= */
let mi=0,quick=false;
function renderMaseh(){
  const M=MASEH[lang];
  $("#masehSteps").innerHTML=M.map((s,i)=>`<button role="tab" aria-current="${i===mi&&!quick?"step":"false"}" data-i="${i}"><b>${s.l}</b><small>${s.n}</small></button>`).join("");
  $$("#masehSteps button").forEach(b=>b.onclick=()=>{quick=false;mi=+b.dataset.i;renderMaseh()});
  $("#masehQuick").setAttribute("aria-pressed",quick?"true":"false");
  $("#masehPrev").hidden=quick;$("#masehNext").hidden=quick;
  if(quick){$("#masehBody").innerHTML=`<div style="display:grid;gap:12px">`+M.map(s=>`<div><h3>${s.l} · ${s.n}</h3><p class="lead">${s.goal}</p>${phraseHTML(s.say[0])}</div>`).join("")+`</div>`;return}
  const s=M[mi];
  $("#masehBody").innerHTML=`<div style="display:grid;gap:12px"><h3>${s.l} · ${s.n}</h3><p>${s.goal}</p>
    <div class="dd"><div class="do"><h4>${t("doH")}</h4><ul>${s.dos.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="dont"><h4>${t("dontH")}</h4><ul>${s.donts.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
    ${s.warn?`<p class="note">${s.warn}</p>`:""}<div class="eyebrow">${t("sayLabel")}</div><div style="display:grid;gap:8px">${s.say.map(phraseHTML).join("")}</div></div>`;
  $("#masehPrev").disabled=mi===0;$("#masehNext").textContent=mi===3?t("restart"):t("next");
}
$("#masehPrev").onclick=()=>{if(mi>0){mi--;renderMaseh()}};
$("#masehNext").onclick=()=>{mi=(mi+1)%4;renderMaseh()};
$("#masehQuick").onclick=()=>{quick=!quick;renderMaseh()};

/* ================= Breathing ================= */
let speed=store.get("bspeed",1);if(![1,1.5,2].includes(speed))speed=1;let actx=null;
let mode="gentle",bTimer=null,pi=0,left=0,elapsed=0,wake=null,bState="ready";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderModes(){
  $("#breathModes").innerHTML=Object.entries(MODES).map(([k,m])=>`<button data-m="${k}" aria-pressed="${k===mode}">${m[lang].name}</button>`).join("");
  $$("#breathModes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;resetBreath();renderModes()});
  $(".breath").classList.toggle("kids",mode==="kids");
  $("#bSpeed").innerHTML=[[1,"sp1"],[1.5,"sp2"],[2,"sp3"]].map(([v,k])=>`<button data-sp="${v}" aria-pressed="${v===speed}">${t(k)}</button>`).join("");
  $$("#bSpeed button").forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;store.set("bspeed",speed);const was=bState;resetBreath();renderModes();if(was==="running")startBreath()});
}
function setPhase(){
  const M=MODES[mode],sec=Math.round(M.sec[pi]*speed),kind=M.kind[pi];left=sec;
  $("#phase").textContent=M[lang].ph[pi];$("#count").textContent=left;
  const ring=$("#ring");ring.style.transitionDuration=reduce?"0s":sec+"s";
  if(kind==="in")ring.style.transform="scale(1.9)";else if(kind==="out")ring.style.transform="scale(1)";
  const fc=$("#fc");fc.style.setProperty("--d",sec+"s");fc.dataset.k=kind;
  if($("#snd").checked)chime(kind);
  if($("#vib").checked){try{navigator.vibrate&&navigator.vibrate(kind==="in"?120:kind==="out"?[60,60,60]:40)}catch(e){}}
}
function tick(){
  left--;elapsed++;
  if(left>0){$("#count").textContent=left;return}
  pi=(pi+1)%MODES[mode].sec.length;
  if(pi===0&&elapsed>=120){stopBreath(true);return}
  setPhase();
}
async function startBreath(){
  if(bTimer)return;
  if(bState!=="paused"){pi=0;elapsed=0;setPhase()}
  bState="running";bTimer=setInterval(tick,1000);
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}
}
function stopBreath(done){
  clearInterval(bTimer);bTimer=null;try{wake&&wake.release()}catch(e){}wake=null;
  if(done){bState="done";$("#phase").textContent=t("done");$("#count").innerHTML="&nbsp;";$("#ring").style.transform="scale(1)";$("#fc").dataset.k="";$("#breathHint").textContent=t("doneHint")}
  else if(bState==="running")bState="paused";
}
function resetBreath(){
  clearInterval(bTimer);bTimer=null;try{wake&&wake.release()}catch(e){}wake=null;bState="ready";pi=0;elapsed=0;
  $("#phase").textContent=t("ready");$("#count").innerHTML="&nbsp;";const r=$("#ring");r.style.transitionDuration="0.4s";r.style.transform="scale(1)";$("#fc").dataset.k="";$("#breathHint").textContent=MODES[mode][lang].hint;
}
function audio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){actx=null}return actx}
function chime(kind){
  const a=audio();if(!a)return;const t0=a.currentTime;
  const f=kind==="in"?528:kind==="out"?396:440;
  const out=a.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.09,t0+.03);out.gain.exponentialRampToValueAtTime(.0005,t0+2.6);
  const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;out.connect(lp);lp.connect(a.destination);
  [[1,1],[2.01,.25],[3,.08]].forEach(([m,g])=>{const o=a.createOscillator(),gg=a.createGain();o.type="sine";o.frequency.value=f*m;gg.gain.value=g;o.connect(gg);gg.connect(out);o.start(t0);o.stop(t0+2.7)});
}
$("#snd").checked=store.get("bsnd",false);
$("#snd").onchange=e=>{store.set("bsnd",e.target.checked);if(e.target.checked){audio();chime("hold")}};
$("#bStart").addEventListener("click",()=>{if($("#snd").checked)audio()});
$("#bStart").onclick=startBreath;$("#bPause").onclick=()=>stopBreath(false);$("#bReset").onclick=resetBreath;

/* ================= Grounding ================= */
let gm="adult",gDone=[false,false,false,false,false];
function renderG(){
  $$("#gModes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===gm?"true":"false"));
  $("#gList").innerHTML=G[lang][gm].map((s,i)=>`<label class="gitem${gDone[i]?" done":""}"><input type="checkbox" id="g${i}" ${gDone[i]?"checked":""}><b>${5-i}</b><span>${s}</span><svg class="ill" aria-hidden="true"><use href="#il-${["eye","hand","ear","nose","taste"][i]}"/></svg></label>`).join("");
  $$("#gList input").forEach((c,i)=>c.onchange=()=>{gDone[i]=c.checked;renderG()});
  const p=Math.round(gDone.filter(Boolean).length/5*100);$("#gBar").style.width=p+"%";
  $("#gPct").textContent=p===100?t("gDone"):p+t("pct");
}
$$("#gModes button").forEach(b=>b.onclick=()=>{gm=b.dataset.g;renderG()});
$("#gReset").onclick=()=>{gDone=[false,false,false,false,false];renderG()};

/* ================= Generator ================= */
let F=Object.assign({},DEF,store.get("filters",{}));
let ranked=[],ri=0,current=null,currentMiss=[];
function eqOk(a,av){return a==="none"||av==="various"||a===av}
function score(a){
  let s=0,miss=[];const chk=(ok,w,key)=>{if(ok)s+=w;else miss.push(key)};
  chk(a.ages.includes(F.age),6,"age");chk(a.sp.includes(F.space),5,"space");chk(eqOk(a.eq,F.equip),5,"equip");
  chk(a.du.includes(F.dur),3,"dur");chk(a.gr.includes(F.group),2,"group");chk(a.fo.includes(F.focus),2,"focus");chk(a.ex.includes(F.exp),1,"exp");
  return {a,s,miss};
}
function rank(){ranked=A.map(score).sort((x,y)=>y.s-x.s||x.miss.length-y.miss.length)}
function renderFilters(){
  const O=OPT[lang];
  $("#filters").innerHTML=Object.entries(O).map(([k,v])=>`<div><div class="flabel">${v.label}</div><div class="seg" role="group" aria-label="${v.label}">${Object.entries(v.o).map(([ok,ol])=>`<button data-f="${k}" data-v="${ok}" aria-pressed="${F[k]===ok}">${ol}</button>`).join("")}</div></div>`).join("");
  $$("#filters button").forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;store.set("filters",F);renderFilters();runGen(0)});
  $("#fSummary").textContent=Object.keys(O).filter(k=>k!=="exp").map(k=>O[k].o[F[k]]).join(" · ");
}
function planText(a0){
  const a=tx(a0),T=TIMES[F.dur],m=t("min");
  return `${a.t}\n${t("principle")}: ${PR[lang][a.pr]}. ${a.why}\n\n1. ${t("s1")} (${T[0]} ${m}): ${a.o}\n2. ${t("s2")} (${T[1]} ${m}): ${a.b}\n3. ${t("s3short")} (${T[2]} ${m}): ${a.c}\n\n${t("sayAct")}:\n${a.say.map(s=>"• "+s).join("\n")}\n\n${t("alarm")} ${a.al}\n${t("shelterAdLong")}: ${a.ad}\n\n${t("closeTitle")}: ${L(CLOSEQ).join(" ")}\n${t("rulesTitle")}:\n${L(RULES).map(r=>"• "+r).join("\n")}`;
}
function cardHTML(a0,miss,isFav){
  const a=tx(a0),T=TIMES[F.dur],O=OPT[lang];
  const missTxt=miss&&miss.length?`<p class="match">${t("match")}${miss.map(m=>O[m].label+" ("+O[m].o[F[m]]+")").join(", ")}.</p>`:"";
  return `<article class="card" data-id="${a.id}">
   <div><div class="eyebrow">${t("actEyebrow")}</div><h2>${a.t}</h2></div>
   <div class="badges"><span class="badge p">${PR[lang][a.pr]}</span>${a.ages.map(x=>`<span class="badge">${O.age.o[x]}</span>`).join("")}<span class="badge">${a.du.map(d=>O.dur.o[d]).join(" / ")}</span><span class="badge">${O.equip.o[a.eq]}</span></div>
   ${missTxt}<p><b>${t("why")}</b> ${a.why}</p>
   <ol class="plan">
    <li><span class="mins">${T[0]}<small>${t("min")}</small></span><h4>${t("s1")}</h4><p>${a.o}</p></li>
    <li><span class="mins">${T[1]}<small>${t("min")}</small></span><h4>${t("s2")}</h4><p>${a.b}</p></li>
    <li><span class="mins">${T[2]}<small>${t("min")}</small></span><h4>${t("s3")}</h4><p>${a.c}</p></li>
   </ol>
   <div class="eyebrow">${t("sayAct")}</div><div class="say">${a.say.map(phraseHTML).join("")}</div>
   <div class="alarmbox"><b>${t("alarm")}</b> ${a.al}</div>
   <div class="adapt"><div><b>${t("shelterAd")}</b>${a.ad}</div>${GENERIC[lang].map(g=>`<div><b>${g[0]}</b>${g[1]}</div>`).join("")}</div>
   <div class="rules"><b>${t("closeTitle")}</b>${L(CLOSEQ).join(" · ")}</div>
   <div class="rules"><b>${t("rulesTitle")}</b><ul>${L(RULES).map(r=>`<li>${r}</li>`).join("")}</ul></div>
   <div class="btnrow"><button class="btn ${isFav?"":"primary"}" data-fav="${a.id}">${isFav?t("savedBtn"):t("save")}</button><button class="btn" data-copyplan="${a.id}">${ICON_COPY} ${t("copyPlan")}</button></div></article>`;
}
let favs=store.get("favs",[]);
function showResult(r){current=r.a;currentMiss=r.miss;$("#result").innerHTML=cardHTML(r.a,r.miss,favs.includes(r.a.id))}
function runGen(i){rank();ri=i;showResult(ranked[ri%ranked.length])}
$("#gAnother").onclick=()=>{runGen((ri+1)%Math.min(ranked.length,8))};
$("#gSurprise").onclick=()=>{rank();const pool=ranked.filter(r=>!r.miss.includes("age")&&!r.miss.includes("equip"));const P=pool.length?pool:ranked;showResult(P[Math.floor(Math.random()*P.length)])};
$("#gResetF").onclick=()=>{F=Object.assign({},DEF);store.set("filters",F);renderFilters();runGen(0)};
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){const id=f.dataset.fav;if(favs.includes(id)){favs=favs.filter(x=>x!==id);toast(t("favRemoved"))}else{favs.push(id);toast(t("favSaved"))}store.set("favs",favs);refreshFavButtons();renderFavs()}
  const c=e.target.closest("[data-copyplan]");if(c){copy(planText(A.find(x=>x.id===c.dataset.copyplan)))}
  const rm=e.target.closest("[data-rm]");if(rm){const id=rm.dataset.rm,idx=favs.indexOf(id);favs=favs.filter(x=>x!==id);store.set("favs",favs);renderFavs();refreshFavButtons();toast(t("removed"),t("undo"),()=>{favs.splice(idx,0,id);store.set("favs",favs);renderFavs();refreshFavButtons()})}
});
function refreshFavButtons(){$$("[data-fav]").forEach(b=>{const on=favs.includes(b.dataset.fav);b.textContent=on?t("savedBtn"):t("save");b.classList.toggle("primary",!on)})}
function renderFavs(){
  const list=favs.map(id=>A.find(a=>a.id===id)).filter(Boolean).map(tx);
  $("#savedCount").textContent=list.length?list.length+t("savedN"):"";
  if(!list.length){$("#favList").innerHTML=`<p class="empty">${t("emptyFav")}</p>`;return}
  $("#favList").innerHTML=list.map(a=>`<details class="fav"><summary class="h" style="list-style:none;cursor:pointer;min-height:44px"><h3>${a.t}</h3><span class="badge p">${PR[lang][a.pr]}</span></summary>
   <p>${a.o}</p><p>${a.b}</p><p>${a.c}</p><div class="alarmbox"><b>${t("alarm")}</b> ${a.al}</div>
   <div class="btnrow"><button class="btn" data-copyplan="${a.id}">${ICON_COPY} ${t("copyShort")}</button><button class="btn ghost" data-rm="${a.id}">${t("remove")}</button></div></details>`).join("");
}

/* ================= init ================= */
function renderAll(){
  renderStatic();renderMaseh();renderModes();resetBreath();renderG();renderFilters();
  if(current){showResult({a:current,miss:currentMiss})}else{runGen(0)}
  renderFavs();
}
/* ================= gift link: ?to=&from=&msg= ================= */
const clip=(s,n)=>String(s||"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,n);
const GIFT={to:clip(QS.get("to"),60),from:clip(QS.get("from"),60),msg:String(QS.get("msg")||"").replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g," ").trim().slice(0,400)};
const isGift=QS.has("gift")||GIFT.to||GIFT.from||GIFT.msg;
function renderGift(){
  if(!isGift)return;
  const rb=$("#giftRibbon");
  if(GIFT.from){rb.textContent=t("giftRibbon")+GIFT.from;rb.hidden=false}
  $("#giftTitle").textContent=t("giftFor")+(GIFT.to?", "+GIFT.to:"");
  $("#giftFrom").textContent=GIFT.from?t("giftFrom")+GIFT.from:"";$("#giftFrom").hidden=!GIFT.from;
  $("#giftMsg").textContent=GIFT.msg;$("#giftMsg").hidden=!GIFT.msg;
  $("#giftDesc").textContent=t("giftDesc");$("#giftOpen").textContent=t("giftOpen");$("#giftTip").textContent=t("giftTip");
}
if(isGift){
  let seen=false;try{seen=sessionStorage.getItem("edu_giftSeen")===location.search}catch(e){}
  if(!seen){$("#gift").hidden=false;setTimeout(()=>{$("#giftOpen").focus()},50)}
  $("#giftOpen").onclick=()=>{$("#gift").hidden=true;try{sessionStorage.setItem("edu_giftSeen",location.search)}catch(e){}};
}
const _renderStatic=renderStatic;renderStatic=function(){_renderStatic();renderGift()};
renderAll();
showTab("now");
})();
