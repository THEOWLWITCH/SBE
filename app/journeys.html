<style>
:root{
  --ground:#EDEFF1; --surface:#FCFCFD; --surface-2:#E4E7EA;
  --ink:#141C24; --muted:#5C6771; --hair:#CDD3D8;
  --spoken:#2E5A7D; --spoken-soft:#DCE7EF;
  --hidden:#8F5F2E; --hidden-soft:#F5EAD9;
  --auto:#4A6B5A; --auto-soft:#DFE9E2;
  --brick:#8C3A34; --brick-soft:#F5E4E2;
  --deep:#5B2D8E; --deep-soft:#EDE3F7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
    --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
    --spoken:#82AECE; --spoken-soft:#1E2E3A;

    --auto:#83B599; --auto-soft:#1B2A22;
    --brick:#CF7C74; --brick-soft:#331E1C;
    --deep:#A97FCC; --deep-soft:#2A1A42; color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
  --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
  --spoken:#82AECE; --spoken-soft:#1E2E3A;

  --brick:#CF7C74; --brick-soft:#331E1C;
  --deep:#A97FCC; --deep-soft:#2A1A42; color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Assistant","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;
  background:var(--ground);color:var(--ink);direction:rtl}
.topnav{font-size:13px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--hair);
  display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.topnav button,.topnav a{font:inherit;font-weight:600;padding:4px 10px;border-radius:12px;border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.topnav .crumb{margin-inline-start:auto;color:var(--muted);font-size:12px}
.wrap{max-width:820px;margin:0 auto;padding:1.2rem 1rem 4rem}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(20,28,36,.07)}
h1{font-family:"Frank Ruhl Libre",serif;font-size:1.8rem;line-height:1.2;margin-bottom:.35rem}
h2{font-size:1.12rem;color:var(--spoken);margin-bottom:.6rem}
h3{font-size:1rem;margin:.9rem 0 .4rem}
p{margin-bottom:.5rem}
.muted{color:var(--muted);font-size:.9rem}
label{display:block;font-weight:700;font-size:.9rem;margin:.7rem 0 .25rem}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:.95rem;padding:.5rem .65rem;
  border:1px solid var(--hair);border-radius:7px;background:var(--ground);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.addrow{display:flex;gap:.5rem;margin-top:.45rem}
.addrow input{flex:1}
.addrow .btn{white-space:nowrap;padding:.45rem .8rem;font-size:.88rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
.btn{display:inline-block;font:inherit;font-weight:700;padding:.65rem 1.1rem;border-radius:8px;border:none;cursor:pointer;
  background:var(--spoken);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--hair);color:var(--ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.dim{border-top:1px solid var(--hair);padding-top:.6rem;margin-top:.8rem}
.dim:first-of-type{border-top:none;margin-top:0;padding-top:0}
.q{padding:.55rem 0;border-bottom:1px dashed var(--hair)}
.q:last-child{border-bottom:none}
.q .qt{font-weight:600}
.q .look{font-size:.82rem;color:var(--muted);margin:.1rem 0 .35rem}
.q.miss .qt{color:var(--brick)}
.scale{display:flex;flex-wrap:wrap;gap:.35rem}
.scale label{margin:0;font-weight:500;font-size:.85rem;border:1px solid var(--hair);border-radius:99px;padding:.22rem .7rem;cursor:pointer;background:var(--ground)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label.on{background:var(--spoken);border-color:var(--spoken);color:#fff}
.rev{font-size:.72rem;font-weight:700;color:var(--brick);background:var(--brick-soft);border-radius:99px;padding:.05rem .45rem;margin-inline-start:.3rem}
.score-row{display:flex;align-items:center;gap:.6rem;margin:.35rem 0}
.score-label{flex:0 0 42%;font-size:.88rem}
.bar{flex:1;height:9px;background:var(--hair);border-radius:5px;overflow:hidden}
.bar>div{height:100%}
.val{flex:0 0 2.6rem;text-align:center;font-weight:700;font-size:.85rem;border-radius:5px}
.t3{background:var(--auto)}.t3b{background:var(--auto-soft);color:var(--auto)}
.t2{background:var(--hidden)}.t2b{background:var(--hidden-soft);color:var(--hidden)}
.t1{background:var(--brick)}.t1b{background:var(--brick-soft);color:var(--brick)}
.t0{background:var(--deep)}.t0b{background:var(--deep-soft);color:var(--deep)}
.flag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:.05rem .5rem;background:var(--brick-soft);color:var(--brick);margin-inline-start:.4rem}
.intro{background:var(--spoken-soft);border-inline-start:3px solid var(--spoken);border-radius:6px;padding:.75rem 1rem;margin-bottom:.8rem}
.lens{background:var(--surface-2);border-radius:6px;padding:.7rem 1rem;margin-bottom:.8rem;font-size:.95rem}
.act{border:1px solid var(--hair);border-radius:9px;padding:.7rem .9rem;margin:.55rem 0;background:var(--surface)}
.act-t{font-weight:700}
.act-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}
.act-tag{font-size:.72rem;padding:.12rem .5rem;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:700}
.act-tag.kind{background:var(--spoken-soft);color:var(--spoken)}
.act-tag.circle{background:var(--auto-soft);color:var(--auto)}
.act-tag.game{background:var(--brick-soft);color:var(--brick)}
.act-d{font-size:.93rem;margin:.2rem 0}
.act-m{font-size:.84rem;color:var(--muted)}
.basis{font-size:.78rem;color:var(--muted);margin-top:.3rem}
.basis a,a.ref{color:var(--spoken);font-weight:600;text-decoration:none;direction:ltr;unicode-bidi:isolate}
ul.tl{padding-inline-start:1.2rem}
ul.tl li{margin:.25rem 0}
.err{color:var(--brick);font-weight:600;margin-top:.5rem}
.addmore{margin:.35rem 0 .2rem}
.addmore summary{cursor:pointer;color:var(--spoken);font-size:.85rem;font-weight:600}
.ctag{font-size:.7rem;font-weight:700;color:var(--auto);background:var(--auto-soft);border-radius:99px;padding:.05rem .45rem;margin-inline-start:.35rem}
.chat .thinking{color:var(--muted);font-style:italic}
.chat .msg{border-radius:9px;padding:.7rem .95rem;margin:.6rem 0;font-size:.95rem;line-height:1.65}
.chat .me{white-space:pre-wrap}
.rich>*:last-child{margin-bottom:0}
.rich p{margin:0 0 .7rem}
.rich h4{font-size:.98rem;color:var(--spoken);margin:.9rem 0 .35rem}
.rich h4:first-child{margin-top:0}
.rich ul,.rich ol{margin:.15rem 0 .75rem;padding-inline-start:1.35rem}
.rich li{margin:.3rem 0}
.rich li::marker{color:var(--spoken)}
#report h2{margin-top:1.6rem}
#report .card>h2:first-child{margin-top:0}
.act-d{line-height:1.6}
.chat .me{background:var(--spoken-soft);margin-inline-end:15%}

#fb-fab{position:fixed;inset-inline-start:16px;bottom:16px;z-index:50;font:inherit;font-weight:700;font-size:.9rem;
  padding:.6rem 1rem;border-radius:22px;border:none;background:var(--spoken);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(20,28,36,.28)}
dialog#fb-dlg{border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:var(--ink);max-width:460px;width:92vw;padding:0}
dialog#fb-dlg::backdrop{background:rgba(10,14,18,.55)}
#fb-dlg .fbh{padding:.9rem 1.1rem;border-bottom:1px solid var(--hair);font-weight:700}
#fb-dlg .fbb{padding:.6rem 1.1rem 1rem}
#fb-dlg .fbf{padding:.7rem 1.1rem;border-top:1px solid var(--hair);display:flex;gap:.5rem}
dialog#rw-dlg{border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:var(--ink);max-width:720px;width:94vw;padding:0}
dialog#rw-dlg::backdrop{background:rgba(10,14,18,.55)}
#rw-dlg .fbh{padding:.9rem 1.1rem;border-bottom:1px solid var(--hair);font-weight:700}
#rw-dlg .fbb{padding:.6rem 1.1rem 1rem;max-height:70vh;overflow:auto}
#rw-dlg .fbf{padding:.7rem 1.1rem;border-top:1px solid var(--hair);display:flex;gap:.5rem}
.rw-check{list-style:none;padding:0;margin:.3rem 0;font-size:.9rem}
.rw-check li{padding:.25rem 0;border-bottom:1px dashed var(--hair)}
.rw-check li.on b{color:var(--auto)}.rw-check li.off b{color:var(--muted)}
.rw-new{border:1px solid var(--hair);border-radius:8px;padding:.7rem .9rem;background:var(--surface-2)}
@page{size:A4;margin:20mm 22mm}
@media print{.topnav,.no-print,#form-area,#fb-fab{display:none!important}body{background:#fff;font-size:11.5pt;line-height:1.6}
  .wrap{max-width:none;padding:0}.card{box-shadow:none;border:none;padding:0}
  #report{break-before:page}
  h2,h3,h4{break-after:avoid}.act,.rich li,.intro,.lens,.score-row{break-inside:avoid}
  .bar,.bar>div,.val,.intro,.lens,.act-tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<nav class="topnav no-print">
  <button type="button" onclick="history.back()">→ חזרה</button>
  <a href="admin.html?role=sys">⌂ מסך הניהול</a>
  <span class="crumb">Begood › ניהול › המסעות</span>

<div class="wrap" id="app" style="max-width:980px"></div>
<script>
(function(){
'use strict';
// המסעות — מסך הניהול (מנהלת המערכת בלבד): כל המסעות והתקדמותם, אישור הצעות, משוב, תעודות, שינוי אבני דרך,
// שרשורים, קישורי קהילת הווטסאפ וייצוא מחקרי. הכול בשפה חיובית.
const J = window.SBE_JOURNEY, SRC = window.SBE_ADVISOR_SOURCES;
const AI_SERVER = 'https://sbe-server.onrender.com', ACCESS = AI_SERVER + '/api/access';
const F = k=>document.getElementById(k);
let IS_SYS=false;try{IS_SYS=sessionStorage.getItem('sbe.session.homeUrl')==='admin.html?role=sys';}catch(e){}
if(!IS_SYS){document.documentElement.style.display='none';location.replace('entry.html');return;}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;}
function withRefs(text){ // טקסט עם [מפתח] → קישורים למקורות; מפתח לא מוכר נשאר טקסט
  const frag=document.createDocumentFragment();
  String(text||'').split(/(\[[A-Za-z]+[0-9]{4}\])/).forEach(part=>{
    const m=part.match(/^\[([A-Za-z]+[0-9]{4})\]$/);
    if(m&&SRC.byKey[m[1]]&&SRC.byKey[m[1]].hidden){frag.appendChild(document.createTextNode('[ד״ר יעל שדה, Begood]'));}
    else if(m&&SRC.byKey[m[1]]){const a=el('a','ref',m[1]);a.href='resilience-advisor-sources.html#'+m[1];a.target='_blank';a.title=SRC.byKey[m[1]].apa;frag.appendChild(document.createTextNode('['));frag.appendChild(a);frag.appendChild(document.createTextNode(']'));}
    else if(!m)frag.appendChild(document.createTextNode(part)); // מפתח שאינו ברשימה — לא מוצג
  });
  return frag;
}
function inlineRich(text){ // **מודגש** → הדגשה, [מפתח] → קישור; כוכביות בודדות לא מוצגות
  const frag=document.createDocumentFragment();
  String(text||'').split(/\*\*([^*]+)\*\*/).forEach((part,i)=>{
    part=part.replace(/\*\*/g,'');
    if(i%2){const b=el('b');b.appendChild(withRefs(part));frag.appendChild(b);}else frag.appendChild(withRefs(part));
  });
  return frag;
}
// טקסט ארוך → פסקאות, תבליטים, רשימות ממוספרות ותת־כותרות, עם רווח ביניהם (לקריאה נוחה)
function richText(text){
  const box=el('div','rich');let list=null;
  const close=()=>{list=null;};
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line){close();return;}
    let m;
    if((m=line.match(/^#{1,6}\s*(.+)$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    if((m=line.match(/^(?:[-•*●▪]|–)\s+(.+)$/))){if(!list||list.tagName!=='UL'){list=el('ul');box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[1]));list.appendChild(li);return;}
    if((m=line.match(/^(\d{1,2})[.)]\s+(.+)$/))){if(!list||list.tagName!=='OL'){list=el('ol');list.start=+m[1];box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[2]));list.appendChild(li);return;}
    if((m=line.match(/^\*\*([^*]+)\*\*[:：]?$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    close();const p=el('p');p.appendChild(inlineRich(line));box.appendChild(p);
  });
  return box;
}
async function complete(system,messages,maxTokens){
  // ברקע, עם שאילת מצב (lib/ai-call.js) — בקשה ארוכה אחת נקטעה בדרך (06/10/2026)
  return String(await sbeCallAI(AI_SERVER,{system,messages,maxTokens},480000)||'');
}



function accessApi(body){return fetch(ACCESS,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json().catch(()=>({})).then(d=>{d._status=r.status;return d;}));}
function token(){try{return sessionStorage.getItem('sbe.session.token')||'';}catch(e){return '';}}
const api = (action, extra) => accessApi({ action, token: token(), ...(extra || {}) });
const fmt = d => d ? String(d).slice(0,10).split('-').reverse().map((x,i)=>i===2?x.slice(2):x).join('.') : '';
const today = () => new Date().toISOString().slice(0,10);
const daysTo = d => Math.round((Date.parse(d) - Date.parse(today())) / 864e5);
const unitT = k => (J.UNITS.find(u => u.k === k) || {}).t || '';
const clT = c => (J.CLUSTERS.find(x => x.k === +c) || {}).t || '';
const stT = s => (J.STAGES.find(x => x.k === +s) || {}).t || '';
// טבלאות (07/10/2026), בקו אחיד עם שאר התוצרים: אשכולות, מכשולים ואבני דרך
function clusterTable(p){ return SBE_TABLE(['האשכול','איפה אתם','מה כבר יש','הצעד הבא'], (p.clusters || []).map(x => [el('b', null, clT(x.c)), el('span', 'cl-chip', stT(x.stage)), x.strength || null, x.next || null]), 'jr-cl'); }
function failTable(p){ return SBE_TABLE(['מכשול בדרך','מה ראינו','הגשר שאפשר לבנות'], (p.fails || []).map(f => [el('b', null, J.ICON.obstacle + ' ' + ((J.FAILS.find(x => x.k === f.type) || {}).t || 'מכשול') + (f.critical ? ', חשוב לטפל' : '')), f.seen || null, f.bridge ? J.ICON.bridge + ' ' + f.bridge : null]), 'jr-fl'); }
function milestoneTable(ms){ return SBE_TABLE(['#','אבן הדרך','שלב','יעדים ואיך יודעים שהושגו'], ms.map((m, i) => { const ul = el('ul'); (m.goals || []).forEach(g => { const li = el('li'); li.appendChild(el('b', null, clT(g.c) + ': ')); li.appendChild(document.createTextNode((g.goal || '') + (g.measure ? ' — ' + g.measure : ''))); ul.appendChild(li); });
  return [String(i + 1), el('b', null, (m.gate ? J.ICON.gate + ' ' : '') + (m.title || '')), stT(m.stage), ul.childNodes.length ? ul : null]; }), 'jr-ms'); }

const draftKey = id => window.sbeUserKey ? sbeUserKey('sbe.journey.draft.' + id) : 'sbe.journey.draft.' + id;
function loadDraft(id){ try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}') || {}; } catch(e){ return {}; } }
function saveDraft(id, d){ try { localStorage.setItem(draftKey(id), JSON.stringify(d)); } catch(e){} }
function btn(text, cls, fn){ const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
function card(){ const c = el('div', 'card'); F('app').appendChild(c); return c; }
function errLine(c){ const e = el('p', 'err'); e.hidden = true; c.appendChild(e); return t => { e.textContent = t || ''; e.hidden = !t; }; }
function parseJSON(t){ const m = String(t || '').match(/\{[\s\S]*\}/); if (!m) throw new Error('לא התקבל מבנה תקין'); return JSON.parse(m[0]); }


// מפת המסע: חמש תחנות
function journeyMap(j){
  const box = el('div', 'jmap'); const ms = j.milestones || [];
  const cur = ms.length ? ((ms.find(m => m.status !== 'approved') || {}).stage || 6) : (j.startStage || 1);
  J.STAGES.forEach(s => { const st = el('div', 'st' + (s.k < cur ? ' reached' : '') + (s.k === cur ? ' now' : ''));
    st.appendChild(el('div', 'dot', s.k < cur ? '✓' : s.k)); st.appendChild(el('div', 'nm', s.t)); st.appendChild(el('div', 'sb', s.sub));
    const mine = ms.filter(m => m.stage === s.k); if (mine.length) st.appendChild(el('div', 'cnt', mine.filter(m => m.status === 'approved').length + '/' + mine.length)); box.appendChild(st); });
  return box;
}
function ta(v, ph, h){ const t = document.createElement('textarea'); t.value = v || ''; if (ph) t.placeholder = ph; if (h) t.style.minHeight = h; return t; }

// ── הלוח: כל המסעות ──
async function viewBoard(){
  const app = F('app'); app.textContent = '';
  const c = card(); c.appendChild(el('h1', null, 'לוח המסעות: אישורים ומשוב'));
  c.appendChild(el('p', 'muted', 'כל המסעות והתקדמותם: מוצג רק לך. מה שממתין לך מופיע ראשון.'));
  const bar0 = el('div', 'btns');
  const tryA = el('a', 'btn btn-ghost', 'למסך המשתתפים'); tryA.href = 'journey.html'; tryA.style.textDecoration = 'none'; bar0.appendChild(tryA);
  // אישור בתוך העמוד (ולא confirm של הדפדפן, שלפעמים חסום): לחיצה ראשונה מסבירה, השנייה יוצרת.
  const demoBox = el('div'); demoBox.hidden = true; demoBox.style.cssText = 'margin-top:.6rem';
  demoBox.appendChild(el('p', 'muted', 'ייווצרו שלושה מסעות דמו: כיתה בשלב הבחירות, בית ספר באמצע הדרך וקהילה שהשלימה את המסע. הם מסומנים "דמו", לא נכנסים למחקר ולא שולחים מיילים.'));
  const demoSt = el('p', 'muted'); demoSt.setAttribute('aria-live', 'polite');
  const demoGo = btn('כן, ליצור את מסעות הדמו', '', async () => {
    demoGo.disabled = true; demoB.disabled = true; demoSt.className = 'muted'; demoSt.textContent = 'מתחילה... (בפעם הראשונה השרת יכול להתעורר עד דקה)';
    try { await SBE_JOURNEY_DEMO.run(api, t => { demoSt.textContent = t; }); demoSt.textContent = 'נוצרו שלושה מסעות דמו ✓'; setTimeout(viewBoard, 600); }
    catch(e) { demoSt.className = 'err'; demoSt.textContent = 'היצירה לא הושלמה: ' + e.message; demoGo.disabled = false; demoB.disabled = false; }
  });
  demoBox.appendChild(demoGo); demoBox.appendChild(demoSt);
  const demoB = btn('יצירת מסעות דמו', 'btn-ghost', () => { demoBox.hidden = !demoBox.hidden; }); bar0.appendChild(demoB);
  c.appendChild(bar0); c.appendChild(demoBox);
  const w = el('p', 'muted', 'טוענת...'); c.appendChild(w);
  const d = await api('jrAll'); w.remove();

// ── מסע אחד ──
let JR = null;
async function viewOne(id){
  const app = F('app'); app.textContent = ''; const w = card(); w.appendChild(el('p', 'muted', 'טוענת...'));
  const d = await api('jrGet', { id }); app.textContent = '';
  if (!d.journey) { card().appendChild(el('p', 'err', 'לא נמצא.')); return; }

  c.appendChild(el('h1', null, j.unitName)); c.appendChild(el('p', 'muted', [unitT(j.unit), j.by, j.inst, 'נפתח ' + fmt(j.created), j.consent && j.consent.research ? 'הסכמה למחקר ✓' : 'בלי הסכמה למחקר'].filter(Boolean).join(' · ')));
  c.appendChild(journeyMap(j));

    if (p.summary) { const sp = el('div', 'intro'); sp.appendChild(richText(p.summary)); pc.appendChild(sp); }
    pc.appendChild(clusterTable(p));
    if ((p.fails || []).length) pc.appendChild(failTable(p));
  }
  if (j.choices) {
    const cc = card(); cc.appendChild(el('h2', null, 'הבחירות שלהם והשיקולים'));
    Object.keys(j.choices).forEach(k => { const v = j.choices[k] || {}; const r = el('div', 'dec'); r.appendChild(el('b', null, ({ startCluster: 'אשכול פתיחה', lead: 'מי מוביל', obstacle: 'מכשול ראשון', drill: 'התרגיל', pace: 'קצב' }[k] || k) + ': ' + (v.option || '')));
      r.appendChild(el('div', null, 'מה הוביל אותם: ' + [].concat(v.reasons || [], v.explain ? [v.explain] : []).join(' · ')));
      if ((v.who || []).length) r.appendChild(el('div', 'muted', 'שותפים להחלטה: ' + v.who.join(', '))); if (v.hard) r.appendChild(el('div', 'muted', 'מה היה מאתגר: ' + v.hard)); cc.appendChild(r); });
  }
  if (j.status === 'review') reviewPlan(j);

  if (j.status === 'active') editMilestones(j);
  threadBox(null);
  const del = card(); del.appendChild(btn('מחיקת המסע', 'btn-ghost', async () => { if (!confirm('למחוק את המסע לצמיתות?')) return; await api('jrDelete', { id: j.id }); location.hash = ''; }));

// עריכת אבני דרך (טבלה פשוטה): כותרת, שלב, שער, מועד, יעדים, מה מגישים
function msEditor(list, withDue){
  const box = el('div');
  list.forEach((m, i) => {
    const r = el('div', 'ms'); const row = el('div', 'row2');
    const a = el('div'); a.appendChild(el('label', null, (i + 1) + '. כותרת')); const t = document.createElement('input'); t.type = 'text'; t.value = m.title || ''; t.addEventListener('input', () => { m.title = t.value; }); a.appendChild(t);
    const b = el('div'); b.appendChild(el('label', null, 'שלב · שער' + (withDue ? ' · מועד' : ''))); const ln = el('div'); ln.style.cssText = 'display:flex;gap:.4rem;flex-wrap:wrap';
    const s = document.createElement('select'); s.style.width = 'auto'; J.STAGES.forEach(x => { const o = el('option', null, x.t); o.value = x.k; if (+m.stage === x.k) o.selected = true; s.appendChild(o); }); s.addEventListener('change', () => { m.stage = +s.value; });
    const g = el('label'); g.style.cssText = 'display:flex;gap:.3rem;align-items:center;margin:0;font-weight:500'; const gc = document.createElement('input'); gc.type = 'checkbox'; gc.style.width = 'auto'; gc.checked = !!m.gate; gc.addEventListener('change', () => { m.gate = gc.checked; }); g.appendChild(gc); g.appendChild(document.createTextNode('שער'));
    ln.appendChild(s); ln.appendChild(g);
    if (withDue) { const dd = document.createElement('input'); dd.type = 'date'; dd.style.width = 'auto'; dd.value = m.due || ''; dd.addEventListener('change', () => { m.due = dd.value; }); ln.appendChild(dd); }
    b.appendChild(ln); row.appendChild(a); row.appendChild(b); r.appendChild(row);
    r.appendChild(el('label', null, 'יעדים (יעד בכל שורה): מספר אשכול | היעד | איך יודעים'));
    const gt = ta((m.goals || []).map(x => [x.c, x.goal, x.measure || ''].join(' | ')).join('\n'), '', '4rem');
    gt.addEventListener('input', () => { m.goals = gt.value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(x => x[1]).map(([c, goal, measure]) => ({ c: +c || 1, goal, measure })); }); r.appendChild(gt);
    r.appendChild(el('label', null, 'מה מגישים: פריט בכל שורה')); const st = ta((m.submit || []).join('\n'), '', '3rem'); st.addEventListener('input', () => { m.submit = st.value.split('\n').map(x => x.trim()).filter(Boolean); }); r.appendChild(st);
    box.appendChild(r);
  });
  return box;
}
async function draftReply(kind, ctx, target, b){
  b.disabled = true; const old = b.textContent; b.textContent = 'כותבת טיוטה...';
  try { target.value = (await complete(J.replySystem(kind), [{ role: 'user', content: ctx }], 4000)).trim(); } catch(e) { alert('הטיוטה לא נכתבה: ' + e.message); }
  b.disabled = false; b.textContent = old;
}
function reviewPlan(j){
  const c = card(); c.appendChild(el('h2', null, 'אישור המסע'));
  const plan = JSON.parse(JSON.stringify(((j.plan || {}).milestones) || []));
  const start = document.createElement('input'); start.type = 'date'; start.value = today(); start.style.width = 'auto';
  c.appendChild(el('label', null, 'תאריך היציאה לדרך')); c.appendChild(start);

  const err = errLine(c); const bar = el('div', 'btns');

  c.appendChild(bar);

function adminMilestone(m, i){

    c.appendChild(b); });

    box.appendChild(el('label', null, 'הערכה לתעודה (מעודדת, רק מה שעולה מההגשות)')); const asx = ta('', '', '5rem'); box.appendChild(asx);
    box.appendChild(el('label', null, 'ההתקדמויות שיופיעו בתעודה: פריט בכל שורה')); const prg = ta('', '', '5rem'); box.appendChild(prg);
    const prior = (JR.milestones || []).filter(x => x.cert).map(x => (x.cert.progress || []).join('; ')).join('; ');

function editMilestones(j){
