<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מנוי — חידוש או רכישה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEFF1; --surface:#FCFCFD; --surface-2:#E4E7EA;
  --ink:#141C24; --muted:#5C6771; --hair:#CDD3D8;
  --spoken:#2E5A7D; --spoken-soft:#DCE7EF;
  --hidden:#8F5F2E; --hidden-soft:#F5EAD9;
  --auto:#4A6B5A; --auto-soft:#DFE9E2;
  --brick:#8C3A34; --brick-soft:#F5E4E2;
  --shadow:rgba(20,28,36,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
    --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
    --spoken:#82AECE; --spoken-soft:#1E2E3A;
    --hidden:#CE9C5E; --hidden-soft:#332617;
    --auto:#83B599; --auto-soft:#1B2A22;
    --brick:#CF7C74; --brick-soft:#331E1C;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
  --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
  --spoken:#82AECE; --spoken-soft:#1E2E3A;
  --hidden:#CE9C5E; --hidden-soft:#332617;
  --auto:#83B599; --auto-soft:#1B2A22;
  --brick:#CF7C74; --brick-soft:#331E1C;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{direction:rtl;background:var(--ground);color:var(--ink);margin:0;
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;padding:0 16px 28px;}
.wrap{max-width:760px;margin:0 auto;}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;flex-wrap:wrap;}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(22px,5vw,28px);margin:0;}
.who{font-size:14px;color:var(--muted);margin:2px 0 0;}
.who b{color:var(--ink);}
.out{font-family:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:6px;border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);cursor:pointer;}
.banner{border:1px solid var(--hair);border-inline-start:4px solid var(--hidden);background:var(--hidden-soft);color:var(--ink);
  border-radius:8px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;line-height:1.55;}
.banner.danger{border-inline-start-color:var(--brick);background:var(--brick-soft);}
.banner a{color:var(--spoken);font-weight:700;}
h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:18px;margin:22px 0 10px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.tile{display:block;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:13px 15px;
  text-decoration:none;color:var(--ink);box-shadow:0 1px 3px var(--shadow);transition:border-color .12s;}
.tile:hover{border-color:var(--spoken);}
.tile b{display:block;font-size:15.5px;margin-bottom:3px;}
.tile span{font-size:13px;color:var(--muted);line-height:1.45;display:block;}
.empty{background:var(--surface);border:1px dashed var(--hair);border-radius:10px;padding:16px;color:var(--muted);font-size:14.5px;}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow);}
.card h3{margin:0 0 6px;font-size:16px;}
.card p.sub{margin:0 0 10px;font-size:13.5px;color:var(--muted);}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:8px 0 3px;}
input,select{font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--ground);border:1px solid var(--hair);
  border-radius:6px;padding:7px 10px;width:100%;}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--spoken);
  background:var(--spoken);color:#fff;cursor:pointer;}
:root[data-theme="dark"] .btn{color:#0F1418;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0F1418;} }
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair);}
.btn.sm{padding:4px 10px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap;}
.row>div{flex:1;min-width:150px;}
.perms{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;}
.perm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:99px;padding:4px 11px;font-size:13.5px;
  cursor:pointer;background:var(--ground);user-select:none;}
.perm input{width:auto;margin:0;}
.perm.dis{opacity:.4;cursor:not-allowed;}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--spoken-soft);color:var(--spoken);margin:1px;}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;}
.st.ok{background:var(--auto-soft);color:var(--auto);}
.st.off{background:var(--brick-soft);color:var(--brick);}
.st.warn{background:var(--hidden-soft);color:var(--hidden);}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px;}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:6px;border-bottom:2px solid var(--hair);}
td{padding:7px 6px;border-bottom:1px solid var(--hair);vertical-align:top;}
.code{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;font-weight:600;letter-spacing:.05em;}
.newcodes{background:var(--auto-soft);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin-top:10px;}
.newcodes .code{font-size:17px;}
.msg{font-size:13.5px;font-weight:600;margin-top:8px;}
.msg.err{color:var(--brick);}
.tablewrap{overflow-x:auto;}

.back{font-size:13px;color:var(--spoken);font-weight:600;text-decoration:none;display:inline-block;margin-top:16px;}
.prose p,.prose li{font-size:15px;line-height:1.7;}
.prose ul{padding-inline-start:1.2rem;margin:.3rem 0 .8rem;}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start;}
.lvl .n{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:22px;color:var(--spoken);line-height:1.1;}
.lvl b{display:block;font-size:15.5px;}
.lvl span{font-size:14px;color:var(--muted);line-height:1.6;display:block;}
.brand{display:block;width:min(190px,48vw);height:auto;margin:14px auto 0;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand{background:#EEF1F4;border-radius:12px;padding:8px 12px;} }
:root[data-theme="dark"] .brand{background:#EEF1F4;border-radius:12px;padding:8px 12px;}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="entry.html">→ למסך הכניסה</a>
<img class="brand" src="assets/begood-logo.webp" alt="Begood — חינוך לחוסן">

<header><div><h1>מנוי — חידוש או רכישה</h1><p class="who">ממלאים את הפרטים ובוחרים את המערכות. אין צורך בתשלום כאן — ניצור אתכם קשר טלפוני להשלמת המנוי ולהסדרת התשלום.</p></div></header>
<!-- בקשת חידוש (30/09/2026): טופס בלי טקסט חופשי. אין סליקה — הבקשה נשמרת
     בשרת ומופיעה למנהלת המערכת במסך הניהול ← מוסדות ← "בקשות חידוש", והיא
     מתקשרת להאריך ולקבל פרטי תשלום. התאריך נרשם אוטומטית בשרת. -->
<style>
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:4px;}
.sys label{display:flex;gap:8px;align-items:center;margin:0;padding:8px 10px;border:1px solid var(--hair);border-radius:8px;
  background:var(--ground);font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.sys input{width:auto;margin:0;}
.per{display:flex;gap:14px;margin-top:4px;}
.per label{display:flex;gap:6px;align-items:center;margin:0;font-size:14.5px;color:var(--ink);font-weight:600;}
.per input{width:auto;margin:0;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
@media(max-width:560px){.two{grid-template-columns:1fr;}}
</style>
<div class="card" id="form">
  <label>סוג הבקשה</label>
  <div class="per">
    <label><input type="radio" name="type" value="renew" checked> חידוש מנוי קיים</label>
    <label><input type="radio" name="type" value="new"> רכישת מנוי חדש</label>
  </div>
  <div class="two">
    <div><label for="fullName">שם מלא *</label><input id="fullName" maxlength="60" autocomplete="name"></div>
    <div><label for="instSel">שם המוסד *</label>
      <select id="instSel"><option value="">— טוען את רשימת המוסדות... —</option></select>
      <input id="instName" maxlength="80" autocomplete="organization" placeholder="שם המוסד החדש" hidden style="margin-top:6px"></div>
    <div><label for="email">מייל *</label><input id="email" type="email" maxlength="80" dir="ltr" autocomplete="email"></div>
    <div><label for="phone">טלפון נייד *</label><input id="phone" type="tel" maxlength="15" dir="ltr" autocomplete="tel" placeholder="05X-XXXXXXX"></div>
  </div>
  <label>המערכות במנוי *</label>
  <div class="sys" id="systems"></div>
  <label>תקופה</label>
  <div class="per">
    <label><input type="radio" name="period" value="year" checked> שנה</label>
    <label><input type="radio" name="period" value="half"> חצי שנה</label>
  </div>
  <div id="codeWrap"><label for="code">קוד מנהל/ת המוסד (לא חובה)</label>
  <input id="code" class="code" dir="ltr" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX"></div>
  <p class="sub" style="margin:4px 0 0">תאריך הבקשה נרשם אוטומטית.</p>
  <div style="margin-top:12px"><button class="btn" id="send">שליחת הבקשה</button></div>
  <div id="msg"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// המערכות — אותן הרשאות כמו בשרת (PERMS). "משוב לעבודות" כולל גם הפקת קודים לסטודנטים.
const SYSTEMS = [
  ["הנחיית סדנאות — סטודנטים", ["fac_trainee"]], ["הנחיית סדנאות — הורים", ["fac_parent"]], ["הנחיית סדנאות — נוער", ["fac_youth"]],
  ["חוסן חברתי", ["resilience"]], ["נוגי — יועצת למנהיגות תומכת חוסן", ["leadership"]], ["פרקטי — יועצת לחוסן", ["practi"]], ["מסע אל החוסן", ["journey"]], ["כתיבה מקדמת חוסן", ["writer"]], ["ננה — מהוראה להנחיה", ["nana"]], ["סטודיו חוסן", ["studio"]], ["תכנון שיחה", ["conv"]], ["תכנון פעילות", ["activity"]], ["משוב לעבודות", ["academic", "lecturer"]],
];
SYSTEMS.forEach(([l, ps], i) => {
  const cb = Object.assign(document.createElement("input"), { type: "checkbox", id: "s" + i });
  cb.dataset.perms = ps.join(",");
  const lb = document.createElement("label"); lb.append(cb, l); $("systems").append(lb);
});
// המוסד: רשימה נפתחת של המוסדות שיש להם מנוי, ו"מוסד חדש" — שדה טקסט.
const NEW_INST = "__new__";
function syncType(){
  const isNew = document.querySelector("input[name=type]:checked").value === "new";
  if (isNew) $("instSel").value = NEW_INST;
  $("instName").hidden = $("instSel").value !== NEW_INST;
  $("codeWrap").hidden = isNew;
}
document.querySelectorAll("input[name=type]").forEach(r => r.addEventListener("change", syncType));
$("instSel").addEventListener("change", () => {
  if ($("instSel").value === NEW_INST) document.querySelector("input[name=type][value=new]").checked = true;
  else if ($("instSel").value) document.querySelector("input[name=type][value=renew]").checked = true;
  syncType();
});
fetch("https://sbe-server.onrender.com/api/access", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "renewInstitutions" }) })
  .then(r => r.json()).then(d => d.names || []).catch(() => [])
  .then(names => {
    const sel = $("instSel"); sel.textContent = "";
    const add = (v, t) => sel.append(Object.assign(document.createElement("option"), { value: v, textContent: t }));
    add("", "— בחרו מוסד —");
    names.forEach(n => add(n, n));
    add(NEW_INST, "מוסד חדש / לא ברשימה");
    if (!names.length) sel.value = NEW_INST;
    syncType();
  });
$("send").addEventListener("click", async () => {
  const systems = [...document.querySelectorAll("#systems input[data-perms]:checked")].flatMap(cb => cb.dataset.perms.split(","));
  const phone = $("phone").value.replace(/[^\d+]/g, "");
  const type = document.querySelector("input[name=type]:checked").value;
  const instName = $("instSel").value === NEW_INST ? $("instName").value.trim() : $("instSel").value;
  const body = { action: "renewRequest", type, fullName: $("fullName").value.trim(), instName,
    email: $("email").value.trim(), phone, systems, other: "", period: document.querySelector("input[name=period]:checked").value,
    code: type === "new" ? "" : $("code").value.trim() };
  const msg = $("msg"); msg.className = "msg err";
  if (!body.fullName || !body.instName) { msg.textContent = "כדי לשלוח, נשמח לשם מלא ולמוסד (או להקליד מוסד חדש)."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { msg.textContent = "כתובת המייל לא תקינה."; return; }
  if (!/^(\+972|0)5\d{8}$/.test(phone)) { msg.textContent = "מספר הטלפון הנייד לא תקין (למשל 050-1234567)."; return; }
  if (!systems.length) { msg.textContent = "כדי לשלוח, סמנו לפחות מערכת אחת."; return; }
  $("send").disabled = true; msg.className = "msg"; msg.textContent = "שולחת... (לפעמים עד דקה)";
  try {
    const r = await fetch("https://sbe-server.onrender.com/api/access", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (d.ok) {
      // תאריך בפורמט ישראלי: 07.10.26, 12:01
      const t = new Date(d.at), z = (n) => String(n).padStart(2, "0");
      const when = z(t.getDate()) + "." + z(t.getMonth() + 1) + "." + String(t.getFullYear()).slice(2) + ", " + z(t.getHours()) + ":" + z(t.getMinutes());
      $("form").textContent = "";
      const p = document.createElement("p"); p.className = "msg";
      p.textContent = "בקשתך התקבלה (" + when + "). ניצור איתך קשר טלפוני בהקדם.";
      $("form").append(p); return;
    }
    msg.className = "msg err";
    msg.textContent = r.status === 429 ? "כבר התקבלו כמה בקשות מהמוסד הזה — ניצור קשר בקרוב." : "השליחה לא הצליחה. בדקו את הפרטים ונסו שוב.";
  } catch (e) { msg.className = "msg err"; msg.textContent = "אין כרגע חיבור לשרת. נסו שוב בעוד רגע."; }
  $("send").disabled = false;
});
</script>
</div>
</body>
</html>
