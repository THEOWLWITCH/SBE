<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>לימודי חוסן חברתי · Begood</title>
  <script src="lib/access-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="lib/studies.css">
  <script src="lib/studies-client.js" defer></script>
  <script src="lib/studies-viewer.js" defer></script>
  <script src="lib/screens-menu.js" defer></script>
<style>.studies-wip{margin:6px 0 14px;padding:10px 16px;background:#fff;border:1px solid #e3e9ef;border-top:2px solid #FFC929;border-radius:12px;color:#1d3f63;font-size:1rem}.studies-wip b{font-weight:700}:root[data-theme="dark"] .studies-wip{background:#14273b;color:#e7eef5;border-color:#2b4157;border-top-color:#FFC929}</style>
<style>.studies-header.studies-banner{border:0;box-shadow:none;background:none;margin:18px 0 4px}.studies-banner .hero-banner{margin:0;line-height:0}.studies-banner .hero-banner img{width:100%;max-width:460px;height:auto;border-radius:0}:root[data-theme="dark"] .studies-banner .hero-banner img{background:#fff;border-radius:10px;padding:6px 12px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .studies-banner .hero-banner img{background:#fff;border-radius:10px;padding:6px 12px}}</style>
</head>
<body class="studies-page" data-crumb="לימודי חוסן חברתי">
  <a class="studies-skip" href="#studies-library">לחומרי הלימוד</a>
  <div class="studies-wrap">
    <nav class="studies-topnav" aria-label="ניווט">
      <a id="studies-home" href="home.html">→ המרחב שלי</a>
      <span>Begood · לומדים יחד</span>
    </nav>
    <header class="studies-header studies-banner">
      <h1 class="hero-banner"><img src="assets/studies-banner.webp" alt="לימודי חוסן חברתי" width="1200" height="260"></h1>
    </header>
    <!-- 29/10/2026: "בינתיים תכתוב כאן - בבניה". מסירים כשהחומרים מוכנים. -->
    <p class="studies-wip sbe-no-theme" role="status"><span aria-hidden="true">🚧</span> <b>בבנייה</b> · חומרי הלימוד מתווספים בימים אלה.</p>
    <main id="studies-library" tabindex="-1">
      <div class="studies-intro">
        <div>
          <p class="studies-eyebrow">ידע, השראה ומבט משותף</p>
          <h2>חומרי הלימוד שלנו</h2>
          <p>מצגות, מסמכים וקישורים להעמקה בחוסן החברתי.</p>
        </div>
        <span id="studies-count" class="studies-count" hidden></span>
      </div>
      <nav id="studies-groups" class="studies-groups" aria-label="קבוצות חומרי לימוד" hidden></nav>
      <div id="studies-content" aria-busy="true">
        <div class="studies-state" role="status">
          <span class="studies-state-icon" aria-hidden="true">◌</span>
          <h2>חומרי הלימוד בדרך</h2>
          <p>טוענים את הספרייה...</p>
        </div>
      </div>
    </main>
    <footer class="studies-footer">Begood · חוסן חברתי מתחיל ביחד</footer>
  </div>
</body>
</html>
