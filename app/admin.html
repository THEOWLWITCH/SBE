<meta charset="UTF-8">
<title>ניהול</title>
<script src="lib/access-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#EDEFF1; --surface:#FCFCFD; --surface-2:#E4E7EA;
  --ink:#141C24; --muted:#5C6771; --hair:#CDD3D8;
  --spoken:#2E5A7D; --spoken-soft:#DCE7EF;
  --hidden:#8F5F2E; --hidden-soft:#F5EAD9;
  --auto:#4A6B5A; --auto-soft:#DFE9E2;
  --brick:#8C3A34; --brick-soft:#F5E4E2;
  --shadow:rgba(20,28,36,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
    --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
    --spoken:#82AECE; --spoken-soft:#1E2E3A;
    --hidden:#CE9C5E; --hidden-soft:#332617;
    --auto:#83B599; --auto-soft:#1B2A22;
    --brick:#CF7C74; --brick-soft:#331E1C;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#12171B; --surface:#1A2126; --surface-2:#232C33;
  --ink:#E3E7EA; --muted:#94A0A9; --hair:#33404A;
  --spoken:#82AECE; --spoken-soft:#1E2E3A;
  --hidden:#CE9C5E; --hidden-soft:#332617;
  --auto:#83B599; --auto-soft:#1B2A22;
  --brick:#CF7C74; --brick-soft:#331E1C;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{direction:rtl;background:var(--ground);color:var(--ink);margin:0;
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:0 16px 70px;}
body.sbe-hasnav{padding-top:38px;}
.wrap{max-width:860px;margin:0 auto;}

/* ניווט — הוחלף מתפריט-צד קבוע לסרגל דק + תפריט נפתח (09/09/2026), כדי
   שיהיה עקבי עם כל שאר המסכים ("תוריד את תפריט הצד במקומות שעדיין יש
   ותחליף בתפריט הזה"). התפריט הנפתח כולל שלוש קבוצות: לשוניות אזור הניהול
   (לוחצת מחליפה tab בתוך admin.html, לא מנווטת), מסכים נוספים (קישור אמיתי
   לקובץ אחר), וכניסה. נבנה מחדש בכל render() כדי לשקף את הלשונית הפעילה. */
#navBar{position:fixed;top:0;inset-inline-start:0;inset-inline-end:0;height:38px;z-index:9997;
  display:flex;align-items:center;gap:6px;padding:0 10px;direction:rtl;
  background:var(--surface);border-bottom:1px solid var(--hair);
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;}
#navBack,#navHome,#navMenuBtn{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:12px;
  border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.4;}
#navBack:hover,#navHome:hover,#navMenuBtn:hover{border-color:var(--spoken);}
#navHome[hidden]{display:none;}
#navPanel{position:fixed;top:38px;inset-inline-start:10px;z-index:9997;width:260px;
  max-height:75vh;overflow-y:auto;background:var(--surface);border:1px solid var(--hair);border-radius:10px;
  box-shadow:0 14px 40px var(--shadow);padding:10px 0;direction:rtl;
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;}
#navPanel[hidden]{display:none;}
#navPanel h5{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:12px 16px 4px;font-weight:700;}
#navPanel h5:first-child{margin-top:0;}
#navPanel button.nlink,#navPanel a.nlink{display:block;width:100%;text-align:inherit;
  font-family:inherit;font-size:13px;padding:6px 16px;border:none;background:none;
  color:var(--ink);text-decoration:none;cursor:pointer;border-inline-start:3px solid transparent;}
#navPanel button.nlink:hover,#navPanel a.nlink:hover{background:var(--ground);}
#navPanel button.nlink.on{border-inline-start-color:var(--spoken);background:var(--spoken-soft);
  color:var(--spoken);font-weight:700;}
/* התראה על תוספות "אחר" חדשות שממתינות לסקירה (22/09/2026) — ראו
   countUnseenAdditions(). לא שער אישור (הוכרע 09/09/2026 שתוספת אינה
   צריכה אישור), רק תזכורת גלויה שיש מה לעבור עליו. */
.navbadge{display:inline-flex;align-items:center;justify-content:center;
  margin-inline-start:6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--brick);color:#fff;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;font-weight:700;line-height:1;}
.newtag{font-size:11px;font-weight:700;color:var(--brick);border:1px solid var(--brick-soft);
  background:var(--brick-soft);border-radius:9px;padding:2px 7px;flex:0 0 auto;}

/* תפריט צד קבוע במסכי הניהול (20/09/2026) — בקשה חוזרת: "עדיין אין תפריט
   צד". ב-09/09/2026 תפריט צד קבוע הוחלף בסרגל+תפריט-נפתח לאחידות עם שאר
   המערכת ("תוריד את תפריט הצד... ותחליף בתפריט הזה") — אבל מסך הניהול הוא
   המסך שבו משתמשת הכי הרבה בין כל המסכים, וקליק נדרש בכל טעינה לא מספיק
   טוב. פתרון: היברידי, לא חזרה מלאה לישן ולא ויתור על התפריט הנפתח —
   ברוחב מסך רחב (≥900px) התפריט קבוע וגלוי תמיד לצד התוכן; במסך צר (טלפון)
   נשאר בדיוק אותו כפתור-טריגר כמו קודם. אותו #navPanel/render() בדיוק,
   רק ה-CSS קובע אם הוא "נפתח בלחיצה" או "תמיד גלוי". */
@media (min-width:900px){
  #navMenuBtn{display:none;}
  #navPanel{position:fixed;inset-inline-start:0;top:38px;bottom:0;width:260px;
    height:auto;max-height:none;border-radius:0;box-shadow:none;
    border-inline-end:1px solid var(--hair);}
  #navPanel[hidden]{display:block;}
  body.sbe-hasnav{padding-inline-start:280px;}
}

header{padding:32px 0 10px;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(26px,5vw,34px);
  line-height:1.14;margin:0 0 5px;}
.lead{color:var(--muted);font-size:15.5px;margin:0;max-width:62ch;}

.roleswitch{background:var(--hidden-soft);border:1px solid var(--hair);
  border-inline-start:3px solid var(--hidden);border-radius:8px;padding:12px 16px;
  margin:16px 0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;}
.roleswitch b{color:var(--hidden);}
.roleswitch select{font-family:inherit;font-size:14.5px;background:var(--surface);
  border:1px solid var(--hair);border-radius:6px;padding:6px 10px;color:var(--ink);
  margin-inline-start:auto;}

.panel{display:none;} .panel.on{display:block;}
h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:19px;margin:0 0 5px;}
.sub{font-size:14.5px;color:var(--muted);margin:0 0 14px;max-width:64ch;}

.evalframe{width:100%;height:80vh;border:1px solid var(--hair);border-radius:9px;background:#fff;}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px var(--shadow);}
.card>h3{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:16.5px;font-weight:700;margin:0;
  padding:15px 18px 12px;border-bottom:1px solid var(--hair);
  display:flex;gap:10px;align-items:baseline;}
.card>h3 em{font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted);margin-inline-start:auto;
  font-family:"IBM Plex Mono",monospace;}
.card .in{padding:17px 18px;}

.codebox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.bigcode{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;
  letter-spacing:.1em;color:var(--spoken);font-variant-numeric:tabular-nums;}
.bigcode.none{color:var(--muted);opacity:.4;}
.meta{font-size:13.5px;color:var(--muted);}

.rows{display:flex;flex-direction:column;}
.r{display:grid;grid-template-columns:1fr auto auto;gap:0 12px;padding:11px 0;
  align-items:center;font-size:15px;}
.r+.r{border-top:1px solid var(--hair);}
.r .nm{min-width:0;}
.r .nm b{display:block;font-weight:600;}
.r .nm span{font-size:13px;color:var(--muted);}
.role{font-size:12.5px;border:1px solid var(--hair);border-radius:20px;padding:3px 11px;
  color:var(--muted);background:var(--ground);white-space:nowrap;}
.role.adm{border-color:var(--spoken);color:var(--spoken);background:var(--spoken-soft);}
/* מוסד פעיל/מושהה (22/09/2026) — הפכה מ-span סטטי לכפתור אמיתי, ראו pInsts */
button.role{font-family:inherit;cursor:pointer;}
button.role.role-on{border-color:var(--auto,var(--spoken));color:var(--auto,var(--spoken));background:var(--auto-soft,var(--spoken-soft));}
button.role.role-off{border-color:var(--brick);color:var(--brick);background:var(--brick-soft);}
button.role:hover{opacity:.85;}
.r.inactive{opacity:.55;}

button.act{font-family:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:6px;
  border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);cursor:pointer;}
button.act.p{background:var(--spoken);border-color:var(--spoken);color:#fff;}
:root[data-theme="dark"] button.act.p,:root:not([data-theme="light"]) button.act.p{color:#0F1418;}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) button.act.p{color:#fff;}}
button.act.d{color:var(--brick);border-color:var(--brick-soft);background:var(--brick-soft);}
button.act:disabled{opacity:.4;cursor:not-allowed;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

input,select.f{font-family:inherit;font-size:15px;color:var(--ink);background:var(--ground);
  border:1px solid var(--hair);border-radius:6px;padding:9px 11px;direction:rtl;}
input:focus,select.f:focus{outline:2px solid var(--spoken);outline-offset:1px;}
.inst{padding:12px 0;}
.inst+.inst{border-top:1px solid var(--hair);}
/* מוסד מקופל: שורה אחת, ובפתיחה ארבעה חלקים ממוספרים (04/10/2026) */
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px;}
.hcard{display:grid;gap:2px;text-align:start;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;cursor:pointer;}
.hcard:hover{border-color:var(--spoken);}
.hcard:focus-visible{outline:2px solid var(--spoken);outline-offset:2px;}
.hcard .hn{font-family:"IBM Plex Mono",monospace;font-size:26px;color:var(--muted);font-variant-numeric:tabular-nums;}
.hcard .ht{font-weight:700;font-size:15px;}
.hcard .hd{font-size:12.5px;color:var(--muted);}
.hcard.has{border-inline-start:4px solid var(--spoken);} .hcard.has .hn{color:var(--spoken);}
.hcard.urgent{border-inline-start:4px solid var(--brick);background:var(--brick-soft);} .hcard.urgent .hn{color:var(--brick);}
details.ibox>summary{list-style:none;cursor:pointer;border-radius:8px;padding:8px 10px;margin:0 -10px;}
details.ibox>summary::-webkit-details-marker{display:none;}
details.ibox>summary::before{content:"◂";color:var(--muted);font-size:13px;transition:transform .15s;}
details.ibox[open]>summary::before{transform:rotate(-90deg);}
details.ibox>summary:hover{background:var(--surface-2);}
details.ibox>summary:focus-visible{outline:2px solid var(--spoken);outline-offset:2px;}
.ibody{display:grid;gap:10px;padding:6px 0 10px;}
.isec{border:1px solid var(--hair);border-radius:8px;padding:10px 12px;background:var(--surface);}
.isec.quiet{background:transparent;}
.isec h4{margin:0 0 6px;font-size:14.5px;color:var(--ink);}
.isec .btnrow{margin-top:8px;}
.hint{margin:0 0 6px;font-size:13px;color:var(--muted);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips .chip{font-size:12.5px;background:var(--spoken-soft);color:var(--spoken);border-radius:99px;padding:2px 10px;font-weight:600;}
.coderow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:5px 0;border-bottom:1px dashed var(--hair);font-size:14px;}
.coderow .cl{min-width:110px;color:var(--muted);font-size:13px;}
.coderow .mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;font-size:15px;letter-spacing:.04em;}
.coderow .what{flex-basis:100%;font-size:12.5px;color:var(--muted);}
.linkbtn.danger{color:var(--brick);}
details.old{margin-top:8px;font-size:13px;}
details.old>summary{cursor:pointer;color:var(--muted);}
details.setcard>summary{cursor:pointer;font-weight:700;padding:12px 16px;}
.irow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;}
.irow .nm{flex:1;min-width:180px;display:flex;flex-direction:column;}
.irow .nm span{font-size:13px;color:var(--muted);}
.iacts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px;}
.icodes{font-size:13px;color:var(--muted);}
.icodes .mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:isolate;color:var(--ink);}
.linkbtn{background:none;border:none;color:var(--spoken);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;}
.pill.ok{background:var(--auto-soft,var(--spoken-soft));color:var(--auto,var(--spoken));}
.pill.warn{background:var(--hidden-soft,var(--spoken-soft));color:var(--hidden,var(--ink));}
.pill.danger{background:var(--brick-soft);color:var(--brick);}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:14px;}
.setrow>span:first-child{min-width:260px;}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--hair);}
.addrow input{flex:1;min-width:150px;}

.lock{background:var(--brick-soft);border:1px solid var(--hair);
  border-inline-start:3px solid var(--brick);border-radius:8px;padding:13px 17px;
  margin:14px 0;font-size:14.5px;line-height:1.6;}
.lock b{color:var(--brick);}
.note{background:var(--surface);border:1px solid var(--hair);border-inline-start:3px solid var(--spoken);
  border-radius:8px;padding:13px 17px;margin:14px 0;font-size:14.5px;line-height:1.6;}

.lib{display:flex;flex-direction:column;}
.li{display:grid;grid-template-columns:26px 1fr auto;gap:0 11px;padding:9px 0;align-items:center;font-size:14.5px;}
.li+.li{border-top:1px solid var(--hair);}
.li .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);}
.li input{width:100%;border-color:transparent;background:transparent;padding:5px 7px;}
.li input:hover{border-color:var(--hair);background:var(--ground);}
.more{font-size:13.5px;color:var(--muted);padding:10px 0 0;}

.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px;}
.stat>div{background:var(--surface);border:1px solid var(--hair);border-radius:8px;
  padding:13px 15px;box-shadow:0 1px 2px var(--shadow);}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--spoken);
  font-variant-numeric:tabular-nums;line-height:1.2;}
.stat span{font-size:13px;color:var(--muted);}

.facetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px;margin-bottom:4px;}
.facet{position:relative;}
.facet h4{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 6px;
  letter-spacing:.02em;}
.facet-trigger{width:100%;text-align:inherit;font-family:inherit;font-size:13.5px;
  padding:7px 12px;border:1px solid var(--hair);border-radius:20px;background:var(--surface);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:border-color .12s,box-shadow .12s;}
.facet-trigger:hover:not(:disabled){border-color:var(--spoken);}
.facet-trigger:disabled{opacity:.4;cursor:not-allowed;}
.facet-trigger .ph{color:var(--muted);}
.facet-trigger .fcnt{margin-inline-start:auto;flex:0 0 auto;font-family:"IBM Plex Mono",monospace;
  font-size:10px;color:#fff;background:var(--spoken);border-radius:9px;padding:1px 6px;}
.facet-panel{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:30;
  background:var(--surface);border:1px solid var(--hair);border-radius:11px;
  box-shadow:0 10px 28px var(--shadow);padding:8px 9px;max-height:min(340px,65vh);
  display:flex;flex-direction:column;gap:6px;}
.facet-panel[hidden]{display:none;}
/* נפתח כלפי מעלה כשאין מקום למטה עד תחתית המסך (22/09/2026) — ראו activity-planner.html. */
.facet-panel.flip-up{top:auto;bottom:calc(100% + 6px);}
.facet-search{width:100%;font-family:inherit;font-size:13.5px;padding:5px 9px;
  border:1px solid var(--hair);border-radius:16px;background:var(--ground);color:var(--ink);
  direction:rtl;flex:0 0 auto;}
.facet-search:focus{outline:2px solid var(--spoken);outline-offset:1px;}
.facet-body{overflow-y:auto;flex:1 1 auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;}
.fchip{font-family:inherit;font-size:12px;padding:3px 10px;border-radius:14px;
  border:1px solid var(--hair);background:var(--ground);color:var(--ink);cursor:pointer;
  transition:background .1s,border-color .1s,color .1s;}
.fchip:hover{border-color:var(--spoken);}
.fchip.on{background:var(--spoken);border-color:var(--spoken);color:#fff;font-weight:600;}
:root[data-theme="dark"] .fchip.on,:root:not([data-theme="light"]) .fchip.on{color:#0F1418;}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .fchip.on{color:#fff;}}

dialog{border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:var(--ink);
  max-width:480px;width:92vw;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);}
dialog::backdrop{background:rgba(10,14,18,.55);}
.dh{padding:15px 20px;border-bottom:1px solid var(--hair);font-weight:700;
  font-family:"Frank Ruhl Libre",Georgia,serif;font-size:18px;}
.db{padding:16px 20px;font-size:15px;line-height:1.6;}
.df{padding:12px 20px;border-top:1px solid var(--hair);display:flex;gap:8px;}
@media(max-width:600px){.r{grid-template-columns:1fr auto;}.r>button{grid-column:2;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}

.brandrow{display:flex;align-items:center;gap:11px;margin:0 0 12px;}
.brandrow img{height:38px;width:auto;display:block;}
.brandrow .eyebrow{margin:0;}
:root[data-theme="dark"] .brandrow img{filter:none;background:#EEF1F4;border-radius:6px;padding:2px 5px;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brandrow img{filter:none;background:#EEF1F4;border-radius:6px;padding:2px 5px;}
}
</style>

<div id="navBar">
  <button type="button" id="navBack" title="חזרה צעד אחד">→ חזרה</button>
  <button type="button" id="navHome" title="חזרה למסך שנפתח אחרי הכניסה שלך" hidden>⌂ המסך שלי</button>
  <button type="button" id="navMenuBtn" title="כל המסכים">☰ תפריט</button>
</div>
<div id="navPanel" hidden></div>

// התראה במסך הניהול (22/09/2026, בקשה מפורשת: "בכל התפריטים הנפתחים צריכה
// להיות אפשרות הוספה עם אישור מיידי. מנהלת המערכת תקבל התראה במסך הניהול
// ותוכל לאשר/למחוק/לערוך") — סופר את כל התוספות (בשתי המשפחות גם יחד) שעוד
// לא סומנו כנסקרות. לא שער-לפני-כניסה (התוספת כבר בתוקף) — רק תזכורת.
function countUnseenAdditions(){
  let n = 0;
  const ct = loadCustomTaxonomy();
  Object.values(ct).forEach(arr => (arr||[]).forEach(x => { if (!x.seen) n++; }));
  const cl = loadCustomLists();
  Object.values(cl).forEach(arr => (arr||[]).forEach(x => { if (!x.seen) n++; }));
  return n;
}

// input-screen.html) — השכבה הזאת היא "overrides" נפרד: מיפוי ערך-מקורי →
// ערך-מתוקן, ורשימת ערכים-מקוריים שנמחקו. מפתח על הערך המקורי (לא הנוכחי),

// שכבות. אותו מפתח localStorage משמש גם ב-input-screen.html כדי שהתוצאה
// תשתקף בבחירה בזמן יצירת תרחיש, לא רק כאן.
function loadTaxonomyOverrides(){
  try { return JSON.parse(localStorage.getItem("sbe.taxonomy.overrides.v1")) || {}; }
  catch(e){ return {}; }
}
function saveTaxonomyOverrides(ov){ try { localStorage.setItem("sbe.taxonomy.overrides.v1", JSON.stringify(ov)); } catch(e){} }
function overrideFor(key){
  const ov = loadTaxonomyOverrides();
  if (!ov[key]) ov[key] = { edits:{}, deletes:[] };
  if (!ov[key].edits) ov[key].edits = {};
  if (!ov[key].deletes) ov[key].deletes = [];
  return ov;
}

function pFeedback(){
  const FB = SBE_FB;

  w.append(el("h2",{},"מדדי המשוב"), el("p",{class:"sub"},
    "שלושה שאלונים — למנחה, למתנסה ולצופה. המנחה בוחרת " + FB.MIN + "–" + FB.MAX + " מדדים לכל שאלון במסך הסדנה, לפני שהיא פותחת אותה. המדדים המסומנים כאן מוצעים לה כברירת המחדל של המוסד."));

  w.append(el("div",{class:"note"},
    el("b",{},"הבנק משותף בין כל המוסדות, בדיוק כמו מאגר התרחישים המשותף. "),
    "מדד שהוספת כאן נגיש למוסדות אחרים, ומסומן בשם התורמת, בשם המוסד ובתאריך. ",
    "הסימון של ברירת המחדל משפיע רק על המוסד שלך. מדד לא נמחק לעולם."));

  const bank = loadBank();
  const TYPE_LABEL = { scale:"סולם", opts:"בחירה", text:"פתוחה" };

  FB.ROLES.forEach(role=>{
    const r = bank[role];
    const n = r.active.length, total = Object.keys(r.bank).length;
    const c = el("div",{class:"card"});
    c.append(el("h3",{}, "שאלון " + FB.ROLE_LABEL[role], el("em",{}, n + " בברירת המחדל · " + total + " מדדים בבנק")));
    const inn = el("div",{class:"in"});
    if (!FB.valid(n)) inn.append(el("div",{class:"note"}, "ברירת המחדל צריכה לכלול " + FB.MIN + "–" + FB.MAX + " מדדים, כדי שהמנחה תוכל לפתוח סדנה בלי לשנות דבר."));
    const full = n >= FB.MAX;
    FB.grouped(role, bank).forEach(({ g, items })=>{
      inn.append(el("div",{style:"font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 4px"}, g));
      const rows = el("div",{class:"rows"});
      items.forEach(({ id, q })=>{
        const isOn = r.active.includes(id);
        const row = el("div",{class:"r"});
        const label = el("label",{style:"display:flex;gap:10px;align-items:baseline;cursor:pointer;flex:1;min-width:0"});
        const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = isOn; cb.disabled = !isOn && full;
        const txt = el("span",{class:"nm"}, el("b",{style: isOn ? "" : "font-weight:400"}, q.l));
        if (q.by || q.creator) txt.append(el("span",{}, "נוסף על ידי " + [q.creator, q.by, q.date].filter(Boolean).join(" · ")));
        cb.addEventListener("change",()=>{
          if (cb.checked) { if (!r.active.includes(id) && r.active.length < FB.MAX) r.active.push(id); }
          else r.active = r.active.filter(x=>x!==id);
          saveBank(bank); render();
        });
        label.append(cb, txt);
        row.append(label, el("span",{class:"role"}, TYPE_LABEL[q.type] || q.type));
        rows.append(row);
      });
      inn.append(rows);
    });

    const add = el("div",{class:"addrow"});
    const who = el("input",{placeholder:"שם מלא — לקרדיט"}); who.style.flex = "0 0 150px";
    const nm = el("input",{placeholder:"מדד חדש לשאלון " + FB.ROLE_LABEL[role]});
    const ty = el("select",{}); ty.append(el("option",{value:"scale"},"סולם 5 דרגות"), el("option",{value:"text"},"שאלה פתוחה"));
    ty.style.flex = "0 0 130px";
    const bAdd = el("button",{class:"act p"},"הוספה");
    bAdd.addEventListener("click",()=>{
      const v = nm.value.trim(); if (!v) return;
      const id = FB.addMetric(role, { l:v, type:ty.value, creator: who.value.trim()||null, by:D.instName });
      const b = loadBank();
      if (id && !b[role].active.includes(id) && b[role].active.length < FB.MAX) { b[role].active.push(id); saveBank(b); }
      render();
    });
    add.append(who, nm, ty, bAdd); inn.append(add);
    c.append(inn); w.append(c);
  });

    ()=>{ FB.resetBank(); render(); }));
  w.append(el("div",{class:"btnrow"}, reset));
  return w;
}

// ── מוסדות ──
function pInsts(){
  const w = el("div",{class:"panel on"});
  w.append(el("h2",{},"מוסדות וקודים"), el("p",{class:"sub"},
    "לכל מוסד: אילו מערכות פתוחות לו, עד מתי המנוי, והקודים שלו. מנהל/ת מוסד מפיק/ה קודים לצוות רק מתוך המערכות הפתוחות."));

  const fmt = (ymd) => ymd ? ymd.slice(0,10).split("-").reverse().map((x,i)=>i===2?x.slice(2):x).join(".") : "";
  const SUB = { ok:["בתוקף","ok"], warn:["מסתיים בקרוב","warn"], grace:["בתקופת חסד","danger"], expired:["הסתיים","danger"], inactive:["מושהה","danger"] };

  const st = el("div",{class:"stat"});
  st.append(el("div",{}, el("b",{},String(instList.length)), el("span",{},"מוסדות")),
            el("div",{}, el("b",{},String(instList.filter(x => x.sub && (x.sub.state === "ok" || x.sub.state === "warn")).length)), el("span",{},"פעילים")),
            el("div",{}, el("b",{},String(instList.filter(x => x.sub && ["warn","grace","expired"].includes(x.sub.state)).length)), el("span",{},"דורשים חידוש")));
  w.append(st);

  // מנויים שמסתיימים בקרוב / בחסד / הסתיימו
  const soon = instList.filter(x => x.sub && ["warn","grace","expired"].includes(x.sub.state))
    .sort((a,b) => String(a.subEnd).localeCompare(String(b.subEnd)));
  if (soon.length) {
    const c = el("div",{class:"card"});
    c.append(el("h3",{},"מנויים שמסתיימים בקרוב"));
    const inn = el("div",{class:"in"});
    soon.forEach(x => {
      const [l, k] = SUB[x.sub.state];
      const line = el("div",{class:"irow"}, el("span",{class:"nm"}, el("b",{},x.name),
        el("span",{}, "עד " + fmt(x.subEnd) + (x.sub.state === "warn" ? " · עוד " + x.sub.daysLeft + " ימים" : x.sub.state === "grace" ? " · חסד עד " + fmt(x.sub.graceEnd) : ""))),
        el("span",{class:"pill " + k}, l));
      const r = el("button",{class:"act p"},"חידוש לשנה");
      r.addEventListener("click", () => act("renewSubscription", { name: x.name, months: 12 }));
      line.append(r); inn.append(line);
    });
    c.append(inn); w.append(c);
  }

  // בקשות חידוש ורכישה שהגיעו מהטופס — מוצגות רק כשיש בקשה פתוחה
  const rc = el("div",{class:"card"}); rc.hidden = true;
  rc.append(el("h3",{},"בקשות חידוש ורכישה", el("em",{},"ממתינות לך")));

  rc.append(rin); w.append(rc);
  accessCall("renewList").then(d => {
    rin.textContent = "";
    const open = (d.requests || []).filter(q => !q.done);
    if (!open.length) return;
    rc.hidden = false;
    const PER = { year:"שנה", half:"חצי שנה", other:"אחר" };
    open.forEach(q => {
      const when = new Date(q.at).toLocaleString("he-IL", { dateStyle:"short", timeStyle:"short" });
      const sysNames = [...new Set((q.systems || []).map(p => p === "lecturer" ? "academic" : p))].map(p => MOD_LABELS[p] ? MOD_LABELS[p].replace(/ \(.*\)$/, "") : p);
      const box = el("div",{class:"inst"});
      box.append(el("div",{class:"irow"},
        el("span",{class:"nm"}, el("b",{}, q.inst || q.instTyped || "—"),
          el("span",{}, when + " · " + (PER[q.period] || "שנה") + (q.inst ? "" : (q.type === "new" ? " · מוסד חדש" : " · המוסד לא זוהה (נכתב: " + (q.instTyped || "") + ")")))),
        el("span",{class:"pill " + (q.type === "new" ? "ok" : "warn")}, q.type === "new" ? "רכישה חדשה" : "חידוש"),
        el("span",{class:"pill warn"},"ממתין לשיחה")));
      box.append(el("div",{class:"icodes"},
        el("b",{}, q.fullName || q.name || ""), " · ",
        el("a",{href:"tel:" + (q.phone || q.contact || ""), style:"direction:ltr;unicode-bidi:isolate"}, String(q.phone || q.contact || "").replace(/^(05\d)(\d{7})$/, "$1-$2")), " · ",

          catch (e) { accessFail(e); }

  // רשימת המוסדות — כל מוסד מקופל לשורה אחת; בפתיחה: ארבעה חלקים ברורים
  const c = el("div",{class:"card"});
  c.append(el("h3",{},"המוסדות", el("em",{}, "לחצי על מוסד כדי לנהל אותו")));
  const inn = el("div",{class:"in"});
  if (!instList.length) inn.append(el("p",{class:"sub",style:"margin:0"},"עדיין אין מוסדות."));
  const copyBtn = (txt) => { const b = el("button",{class:"linkbtn"},"העתקה");
    b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(txt); b.textContent = "הועתק ✓"; setTimeout(() => b.textContent = "העתקה", 1400); } catch(e){} }); return b; };
  instList.forEach(x=>{
    const active = x.active !== false;
    const [sl, sk] = active ? SUB[(x.sub && x.sub.state) || "ok"] : SUB.inactive;
    const openNames = (x.open || []).map(p => (MOD_LABELS[p] || p).replace(/ \(.*\)$/, ""));
    const pcs = x.personalCodes || [];
    const box = el("details",{class:"inst ibox"});
    if (openInst === x.name) box.open = true;
    box.addEventListener("toggle", () => { if (box.open) openInst = x.name; else if (openInst === x.name) openInst = null; });
    box.append(el("summary",{class:"irow"},
      el("span",{class:"nm"}, el("b",{},x.name),
        el("span",{}, [openNames.length ? openNames.length + " מערכות פתוחות" : "עדיין בלי מערכות",
          x.adminCode ? "יש קוד מנהל/ת" : "בלי קוד מנהל/ת", pcs.length ? pcs.length + " קודים אישיים" : "",
          (x.staffCodes || 0) ? x.staffCodes + " קודי צוות" : ""].filter(Boolean).join(" · "))),
      el("span",{class:"pill " + sk}, sl)));
    const body = el("div",{class:"ibody"});

    // 1. מערכות פתוחות
    const s1 = el("section",{class:"isec"}, el("h4",{},"1. מערכות פתוחות"),
      el("p",{class:"hint"},"מנהל/ת המוסד יכול/ה לתת לצוות רק מתוך הרשימה הזו."));
    s1.append(openNames.length ? el("div",{class:"chips"}, ...openNames.map(n => el("span",{class:"chip"}, n)))
      : el("p",{style:"margin:0;color:var(--brick);font-weight:600"},"עדיין לא נפתחו מערכות."));
    const bMod = el("button",{class:"act"}, openNames.length ? "עריכה" : "בחירת מערכות");
    bMod.addEventListener("click",()=> openModDlg(x.name));
    s1.append(el("div",{class:"btnrow"}, bMod));

    // 2. מנוי
    const s2 = el("section",{class:"isec"}, el("h4",{},"2. מנוי"),
      el("p",{style:"margin:0"}, x.subEnd ? "בתוקף עד " + fmt(x.subEnd) : "ללא תאריך סיום"));
    const bRenew = el("button",{class:"act p"},"חידוש לשנה");
    bRenew.addEventListener("click", () => act("renewSubscription", { name: x.name, months: 12 }));
    const bDate = el("button",{class:"act"},"שינוי תאריך");
    bDate.addEventListener("click", () => openSubDlg(x, act));
    s2.append(el("div",{class:"btnrow"}, bRenew, bDate));

    // 3. קודים
    const s3 = el("section",{class:"isec"}, el("h4",{},"3. קודים"));
    const admRow = el("div",{class:"coderow"}, el("span",{class:"cl"},"מנהל/ת המוסד"));
    if (x.adminCode) admRow.append(el("b",{class:"mono"}, x.adminCode), copyBtn(x.adminCode));
    else admRow.append(el("i",{},"עדיין לא הופק"));
    const bAdm = el("button",{class: x.adminCode ? "linkbtn" : "act p"}, x.adminCode ? "החלפה" : "הפקת קוד למנהל/ת");
    bAdm.addEventListener("click",()=> ask(x.adminCode ? "קוד חדש למנהל/ת " + x.name : "קוד למנהל/ת " + x.name,
      x.adminCode ? "הקוד הנוכחי של מנהל/ת המוסד יבוטל ויופק חדש. קודי הצוות שכבר הופקו ממשיכים לעבוד." : "מנהל/ת המוסד נכנס/ת עם כל המערכות הפתוחות למוסד, ומפיק/ה קודים לצוות — רק מתוך המערכות האלה.",
      async () => {
        try {
          if (x.adminCode) await accessCall("codeRevoke", { code: x.adminCode });
          await accessCall("codeCreate", { kind: "instadmin", inst: x.name });
          instList = null; render();
        } catch (e) { accessFail(e); }
      }));
    admRow.append(bAdm);
    s3.append(admRow, el("p",{class:"hint"},"קוד אישי: לאדם אחד, בלי ניהול צוות — רק המערכות שבוחרים."));
    pcs.forEach(pc => {
      const what = pc.perms.map(p => (MOD_LABELS[p] || p).replace(/ \(.*\)$/, "")).join(", ");
      const rv = el("button",{class:"linkbtn danger"},"ביטול");
      rv.addEventListener("click",()=> ask("ביטול הקוד " + pc.code, "הקוד יפסיק לעבוד מיד.",
        async () => { try { await accessCall("codeRevoke", { code: pc.code }); instList = null; render(); } catch (e) { accessFail(e); } }));
      s3.append(el("div",{class:"coderow"}, el("span",{class:"cl"}, pc.label || "קוד אישי"), el("b",{class:"mono"}, pc.code), copyBtn(pc.code), rv,
        el("span",{class:"what"}, what)));
    });
    const bPc = el("button",{class:"act"},"+ קוד אישי חדש");
    bPc.addEventListener("click",()=> openPersonalDlg(x));
    s3.append(el("div",{class:"btnrow"}, bPc));
    const old = el("details",{class:"old"}, el("summary",{},"קוד מוסד ישן (כל הצוות, השיטה הקודמת)"));
    const bOld = el("button",{class:"linkbtn"},"החלפה");
    bOld.addEventListener("click",()=> ask("קוד מוסד ישן חדש ל" + x.name,
      "הקוד הישן — שכל הצוות נכנס איתו עד עכשיו — יוחלף מיד. עדיף לעבור לקודי צוות אישיים שמנהל/ת המוסד מפיק/ה.",
      () => act("newInstitutionCode", { name: x.name })));
    old.append(el("div",{class:"coderow"}, el("b",{class:"mono"}, x.code), copyBtn(x.code), bOld));
    s3.append(old);

    // 4. השהיה ומחיקה
    const s4 = el("section",{class:"isec quiet"}, el("h4",{},"4. השהיה ומחיקה"));
    const status = el("button",{class:"act"}, active ? "השהיה" : "הפעלה מחדש");
    status.addEventListener("click",()=> active
      ? ask("השהיית " + x.name, "אף קוד של המוסד לא יאפשר כניסה עד שתפעילי אותו מחדש. הנתונים נשמרים.",
          () => act("setInstitutionActive", { name: x.name, active: false }))
      : act("setInstitutionActive", { name: x.name, active: true }));
    const bDel = el("button",{class:"act d"},"מחיקת המוסד");
    bDel.addEventListener("click",()=> ask("מחיקת " + x.name,
      "המוסד יימחק לגמרי: כל הקודים שלו (מנהל/ת וצוות וסטודנטים) יפסיקו לעבוד, והמערכות שנפתחו לו וכיתות החוסן שלו עם כל התשובות יימחקו. אי אפשר לבטל את זה.",
      () => act("deleteInstitution", { name: x.name })));
    s4.append(el("div",{class:"btnrow"}, status, bDel));

    body.append(s1, s2, s3, s4); box.append(body);
    inn.append(box);
  });
  c.append(inn);
  w.append(c);

  // הגדרות כלליות — מקופלות
  const sc = el("details",{class:"card setcard"});
  sc.append(el("summary",{},"הגדרות מנויים וקודים"));
  const sin = el("div",{class:"in"});
  const S = sysSettings || { graceDays:14, academic:{ maxActive:50, days:7, uses:3 } };
  const num = (v, min, max) => el("input",{type:"number", min:String(min), max:String(max), value:String(v), style:"width:90px"});
  const g = num(S.graceDays, 0, 90), ma = num(S.academic.maxActive, 1, 500), dd = num(S.academic.days, 1, 60), us = num(S.academic.uses, 1, 50);
  const lineOf = (label, inp, tail) => el("div",{class:"setrow"}, el("span",{},label), inp, el("span",{class:"sub"},tail));
  sin.append(lineOf("ימי חסד אחרי סוף המנוי", g, "ימים"),
    lineOf("קודי \"משוב לעבודות\" — מקסימום פעילים למרצה", ma, "קודים"),
    lineOf("תוקף כל קוד", dd, "ימים"), lineOf("הפקות משוב לכל קוד", us, "הפקות"));
  const save = el("button",{class:"act p"},"שמירה");
  save.addEventListener("click", () => accessCall("setSettings", { graceDays: g.value, academic: { maxActive: ma.value, days: dd.value, uses: us.value } })
    .then(d => { sysSettings = d.settings; instList = null; render(); }).catch(accessFail));
  sin.append(el("div",{class:"btnrow"}, save));
  sc.append(sin); w.append(sc);
  return w;
}

// תאריך סיום מנוי — בחירת תאריך או "ללא תאריך סיום".
function openSubDlg(x, act){
  $("dh").textContent = "תאריך סיום המנוי — " + x.name;
  const body = $("db"); body.textContent = "";
  const d = el("input",{type:"date", value: x.subEnd || ""});
  const none = el("label",{style:"display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"}, el("input",{type:"checkbox"}), "ללא תאריך סיום");
  if (!x.subEnd) none.querySelector("input").checked = true;
  body.append(el("p",{style:"margin:0 0 8px"},"כל הקודים של המוסד פוקעים לכל המאוחר בתאריך הזה (ועוד ימי החסד)."), d, none);
  const dlg = $("dlg"); dlg.showModal();
  $("dok").onclick = () => { dlg.close(); act("setSubscription", { name: x.name, subEnd: none.querySelector("input").checked ? null : (d.value || null) }); };
  $("dno").onclick = () => dlg.close();
}

// ── רשימות ──
// מיומנויות/רגשות/צרכים — אוצר מילים קבוע, לא ספרייה. תוספת "אחר" שיוצרת
// מוסיפה במסך הקלט (app/input-screen.html) נכנסת לתוקף מיד, בלי אישור —
// הכרעת המשתמשת (09/09/2026): "תוספת אינה צריכה אישור. במקרה שצריך יהיה
// למחוק אני אעשה זאת דרך ממשק הניהול." הרשת ביטחון היא עריכה/מחיקה כאן בכל
// עת, לא שער מראש. ראו "עיקרון-על: שיתופיות עם קרדיט" ב-CLAUDE.md.
// שורות "תוספות קהילה" — משותף לטקסונומיות (מיומנויות/רגשות/צרכים) ולרשימות
// הנוספות (קהל יעד/תחום דעת) — אותה חוויה בדיוק בשני המקומות (22/09/2026).
// item.seen===false מציג תג "חדש" + כפתור "✓ אישור" (סימון-כנסקר, לא שער
// לפני כניסה — התוספת כבר בתוקף). עריכה מסמנת seen אוטומטית, כי זה כבר סוג
// של סקירה.
// filterFn אופציונלי (22/09/2026) — מציג רק פריטים שעומדים בתנאי (למשל
// item.group===groupId), אבל עדיין עורך/מוחק לפי המיקום האמיתי במערך
// המלא (indexed), כדי שעריכה על תצוגה מסוננת תפגע בפריט הנכון.
function renderCommunityRows(lib, loadFn, saveFn, groupKey, filterFn){
  lib.textContent = "";
  const all = (loadFn()[groupKey] || []);
  const indexed = all.map((item,i)=>({item,i})).filter(x => !filterFn || filterFn(x.item));
  if (!indexed.length) { lib.append(el("p",{style:"margin:0;font-size:13px;color:var(--muted)"},"אין תוספות עדיין.")); return; }
  indexed.forEach(({item,i})=>{
    const r = el("div",{class:"li"});
    const inp = el("input"); inp.value = item.value;
    // item.detail (אופציונלי, למשל פירוט קריטריון ב-academic-review.html) —
    // לא ניתן לעריכה כאן (רק ה-value), אבל מוצג ב-tooltip לצד הקרדיט.
    inp.title = [item.creator, item.inst, item.date, item.detail].filter(Boolean).join(" · ") || "בלי פרטי קרדיט";
    inp.addEventListener("change",()=>{
      const cur = loadFn();
      if (cur[groupKey] && cur[groupKey][i]) { cur[groupKey][i].value = inp.value.trim(); cur[groupKey][i].seen = true; }
      saveFn(cur);
    });
    const cell3 = el("div",{style:"display:flex;gap:6px;align-items:center;"});
    if (!item.seen) {
      cell3.append(el("span",{class:"newtag"},"חדש"));
      const ok = el("button",{class:"act p", title:"סימון כנסקר"},"✓ אישור");
      ok.addEventListener("click",()=>{
        const cur = loadFn(); if (cur[groupKey] && cur[groupKey][i]) cur[groupKey][i].seen = true;
        saveFn(cur); render();
      });
      cell3.append(ok);
    }
    const del = el("button",{class:"act d"},"הסרה");
    del.addEventListener("click",()=>{
      const cur = loadFn();
      cur[groupKey] = (cur[groupKey]||[]).filter((_,ix)=>ix!==i);
      saveFn(cur); render();
    });
    cell3.append(del);
    r.append(el("span",{class:"n"},String(i+1)), inp, cell3);
    lib.append(r);
  });
}

function pTaxonomies(){
  const w = el("div",{class:"panel on"});
  w.append(el("h2",{},"רשימות"), el("p",{class:"sub"},
    "מיומנויות, רגשות וצרכים — אוצר המילים הקבוע שנפתח כאפשרויות בחירה בזמן יצירת תרחיש. הניסוח חייב להישאר זהה בין מוסדות כדי לאפשר הצלבת נתוני מחקר."));

  const unseenNow = countUnseenAdditions();
  w.append(el("div",{class:"note"},
    el("b",{},"תוספות מהיוצרות נכנסות מיד, בלי אישור. "),
    "כל תוספת נושאת קרדיט (שם, מוסד, תאריך — מוצג בריחוף מעל הפריט). כל תוספת חדשה מסומנת \"חדש\" עד שתסמני אותה כנסקרת (או תערכי/תמחקי אותה) — זו ההתראה שלך, לא שער לפני כניסה."
    + (unseenNow ? " כרגע ממתינות " + unseenNow + " תוספות לסקירה." : " אין כרגע תוספות חדשות.")));

  const ct = loadCustomTaxonomy();

  ["skills","emotions","needs"].forEach(key=>{
    const base = TAXONOMIES[key];
    const baseCount = base.reduce((a,g)=>a+g.items.length,0);
    const deletedCount = (overrideFor(key)[key].deletes || []).length;

    const c = el("div",{class:"card"});
    const extraNow = () => (loadCustomTaxonomy()[key] || []);
    c.append(el("h3",{}, TAX_LABELS[key],
      el("em",{}, (baseCount-deletedCount+extraNow().length) + " פריטים · " + base.length + " קבוצות בסיס")));
    const inn = el("div",{class:"in"});

    // הרשימה הקבועה (40/64/30) — לכל קבוצה כותרת משנה, שורה ניתנת לעריכה
    // לכל פריט בסיס, תוספות הקהילה ששייכות לקבוצה הזאת, והוספה ישירה
    // לתוך הקבוצה הזאת בדיוק (22/09/2026, "אפשרות הוספה תהיה ליד כל
    // תת-סעיף ברשימה אחרת אין ערך לחלוקה זו") — במקום דלי שטוח אחד של כל
    // התוספות וכפתור הוספה גלובלי אחד בסוף, שלא ידע לשייך תוספת לתת-סעיף.
    // עריכה/מחיקה של פריטי בסיס חלות על ה-overrides, לא על TAXONOMIES עצמו.
    const ov = overrideFor(key);
    base.forEach(group=>{
      inn.append(el("p",{style:"margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--muted)"}, group.name));
      const glib = el("div",{class:"lib"});
      group.items.forEach((original,i)=>{
        if (ov[key].deletes.includes(original)) return;   // נמחק — לא מוצג
        const current = ov[key].edits[original] || original;
        const r = el("div",{class:"li"});
        const inp = el("input"); inp.value = current;
        inp.addEventListener("change",()=>{
          const v = inp.value.trim(); if (!v) { inp.value = current; return; }
          const cur = overrideFor(key);
          if (v === original) delete cur[key].edits[original];
          else cur[key].edits[original] = v;
          saveTaxonomyOverrides(cur);
        });
        const del = el("button",{class:"act d"},"הסרה");
        del.addEventListener("click",()=> ask("הסרת \"" + current + "\"",
          "פריט מהרשימה הקבועה, לא תוספת יוצרת. ההסרה חלה על כל מי שיוצרת תרחיש מעכשיו, בכל מוסד. שינוי ניסוח נעשה בעריכה, לא בהסרה והוספה מחדש — כדי לא לאבד את המקום בקבוצה.",
          ()=>{
            const cur = overrideFor(key);
            cur[key].deletes.push(original);
            saveTaxonomyOverrides(cur); render();
          }));
        r.append(el("span",{class:"n"},String(i+1)), inp, del);
        glib.append(r);
      });
      inn.append(glib);

      // תוספות קהילה ששייכות לתת-הסעיף הזה בדיוק
      const glib2 = el("div",{class:"lib"});
      renderCommunityRows(glib2, loadCustomTaxonomy, saveCustomTaxonomy, key, x => x.group === group.id);
      inn.append(glib2);

      // הוספה ישירה לתת-הסעיף הזה
      const add = el("div",{class:"addrow"});
      const nm = el("input",{placeholder:"הוספה ל\"" + group.name + "\" — נכנסת לתוקף מיד"});
      const bAdd = el("button",{class:"act p"},"הוספה");
      bAdd.addEventListener("click",()=>{
        const v = nm.value.trim(); if(!v) return;
        const cur = loadCustomTaxonomy();
        // seen:true — ניהול המערכת היא זו שמוסיפה, אין צורך להתריע לעצמה.
        cur[key] = [...(cur[key]||[]),
          { value:v, group:group.id, creator:"ניהול המערכת", inst:null, date:new Date().toISOString().slice(0,10), seen:true }];
        saveCustomTaxonomy(cur); render();
      });
      add.append(nm,bAdd); inn.append(add);
    });

    // תוספות ללא שיוך לקבוצה קיימת (תוספות ישנות שנוספו לפני 22/09/2026,
    // לפני שהיה group על כל פריט) — לא נעלמות, רק מרוכזות בנפרד בסוף.
    const isUnassigned = x => !base.some(g => g.id === x.group);
    if (extraNow().some(isUnassigned)) {
      inn.append(el("p",{style:"margin:16px 0 6px;font-size:12px;font-weight:700;color:var(--muted)"}, "תוספות ללא שיוך לתת-סעיף"));
      const lib3 = el("div",{class:"lib"});
      renderCommunityRows(lib3, loadCustomTaxonomy, saveCustomTaxonomy, key, isUnassigned);
      inn.append(lib3);
    }

    c.append(inn); w.append(c);
  });

  // ── רשימות נוספות (22/09/2026) — קהל יעד ותחום דעת מ-activity-planner.html,
  // אותו מנגנון בדיוק (sbe.lists.custom.v1 במקום sbe.taxonomy.custom.v1) —
  // "בכל התפריטים הנפתחים צריכה להיות אפשרות הוספה עם אישור מיידי". ניתן
  // להרחיב ל-LIST_LABELS נוספים בעתיד בלי לשנות את הלוגיקה כאן.
  Object.keys(LIST_LABELS).forEach(key=>{
    const c = el("div",{class:"card"});
    const extraNow = () => (loadCustomLists()[key] || []);
    c.append(el("h3",{}, LIST_LABELS[key], el("em",{}, extraNow().length + " תוספות")));
    const inn = el("div",{class:"in"});
    const lib = el("div",{class:"lib"});
    renderCommunityRows(lib, loadCustomLists, saveCustomLists, key);
    inn.append(lib);

    const add = el("div",{class:"addrow"});
    const nm = el("input",{placeholder:"הוספה ישירה — נכנסת לתוקף מיד"});
    const bAdd = el("button",{class:"act p"},"הוספה");
    bAdd.addEventListener("click",()=>{

// קריטריוני הסינון. array:true = שדה שהוא רשימה (בחירה תואמת אם אחד
// מהערכים ברשימה נבחר). "וגם" בין קריטריונים, "או" בתוך קריטריון —
// הכרעת המשתמשת (09/09/2026): "ניתן יהיה לבחור גם.... וגם... לפי הררכיה."
// ההיררכיה ממומשת כ"אפשרויות מצטמצמות": הערכים המוצעים בכל קריטריון
// מחושבים מהתרחישים שעדיין תואמים לכל הקריטריונים האחרים שנבחרו.
const FACETS = [
  {key:"inst", label:"מוסד"},
  {key:"creator", label:"שם יוצרת"},
  {key:"year", label:"שנה"},
  {key:"lang", label:"שפה"},
  {key:"age", label:"שכבת גיל"},
  {key:"approach", label:"גישה חינוכית"},
  {key:"conflictType", label:"סוג קונפליקט"},
  {key:"emotions", label:"רגש", array:true},
  {key:"needs", label:"צורך", array:true},
];
const scenarioFilter = {};   // key -> Set, גלובלי כדי לשרוד בין קריאות render()
// איזה תפריט-קריטריון פתוח כרגע — גם זה גלובלי, כדי שה-render() המלא שרץ
// אחרי כל שינוי (הדפוס הקיים בקובץ הזה) לא יסגור תפריט שהיא באמצע לבחור
// ממנו. הכרעת המשתמשת (09/09/2026): "הכל יהיה בתפריטים נפתחים כי כשהמאגר
// יתמלא הפריסה הזאת תהיה בלתי נסבלת" — הצ'יפים הגלויים-תמיד לכל קריטריון
// הוחלפו בתפריט מתקפל, אותו רעיון בדיוק כמו רכיב ה-combo ב-input-screen.html.
let openFacetKey = null;
document.addEventListener("click", e => {
  if (openFacetKey && !e.target.closest(".facet")) { openFacetKey = null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openFacetKey) { openFacetKey = null; render(); }
});
const facetVal = (rec,key,arr) => arr ? (rec[key]||[]) : [rec[key]];
function scenarioMatchesAll(rec){
  return FACETS.every(f => {
    const sel = scenarioFilter[f.key];
    if (!sel || !sel.size) return true;
    return facetVal(rec,f.key,f.array).some(v => sel.has(v));
  });
}
function availableFacetValues(base, key, arr){
  const set = new Set();
  base.filter(rec => FACETS.every(f => {
    if (f.key === key) return true;
    const sel = scenarioFilter[f.key];
    if (!sel || !sel.size) return true;
    return facetVal(rec,f.key,f.array).some(v => sel.has(v));
  })).forEach(rec => facetVal(rec,key,arr).forEach(v => v && set.add(v)));
  return [...set].sort((a,b)=>String(a).localeCompare(String(b),"he"));
}
function exportScenarioRecords(list, fmt){
  const cols = ["id","name","inst","creator","year","lang","age","approach","conflictType","emotions","needs","characters"];
  let content, mime, filename;
  if (fmt === "json") {
    content = JSON.stringify(list, null, 2);
    mime = "application/json"; filename = "תרחישים.json";
  } else {
    const esc = v => '"' + (Array.isArray(v) ? v.join("; ") : String(v ?? "")).replace(/"/g,'""') + '"';
    const lines = [cols.join(",")];
    list.forEach(r => lines.push(cols.map(c=>esc(r[c])).join(",")));
    content = "﻿" + lines.join("\r\n");
    mime = "text/csv;charset=utf-8"; filename = "תרחישים.csv";
  }
  const blob = new Blob([content], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

      if (!chosen.length) { trigger.append(el("span",{class:"ph"}, "הכל")); }
      else {
        const label = chosen.length > 2 ? chosen.slice(0,2).join("، ") + ` ועוד ${chosen.length-2}` : chosen.join("، ");
        trigger.append(document.createTextNode(label));
        trigger.append(el("span",{class:"fcnt"}, String(chosen.length)));
      }
    }
    updateTrigger();
    if (!values.length) trigger.disabled = true;

    const panel = el("div",{class:"facet-panel"});
    panel.hidden = (openFacetKey !== f.key);
    const search = el("input",{class:"facet-search", placeholder:"חיפוש..."});
    const body = el("div",{class:"facet-body"});
    function renderChips(filterText){
      body.textContent = "";
      const q = (filterText||"").trim();
      const list = q ? values.filter(v=>v.includes(q)) : values;
      if (!list.length) body.append(el("span",{style:"font-size:12px;color:var(--muted)"},"אין תוצאה תואמת."));
      list.forEach(v=>{
        const chip = el("button",{type:"button", class:"fchip"+(sel.has(v)?" on":"")}, v);
        chip.addEventListener("click",()=>{
          if (sel.has(v)) sel.delete(v); else sel.add(v);
          render();
        });
        body.append(chip);
      });
    }
    search.addEventListener("input", ()=> renderChips(search.value));
    trigger.addEventListener("click", ()=>{
      openFacetKey = (openFacetKey === f.key) ? null : f.key;
      render();
      // render() בנתה DOM חדש מאפס — הפאנל הפתוח (אם יש) נמצא עכשיו מחדש
      // ולא דרך המשתנה המקומי panel, שכבר לא מחובר למסמך (22/09/2026).
      if (openFacetKey) {
        const p = document.querySelector(".facet-panel:not([hidden])");
        if (p) {
          p.classList.remove("flip-up");
          const r = p.getBoundingClientRect();
          if (r.bottom > window.innerHeight - 8) p.classList.add("flip-up");
        }
      }
    });
    if (!panel.hidden) renderChips("");
    panel.append(search, body);
    box.append(trigger, panel);
    fgrid.append(box);

  const anyActive = facetsForRole.some(f => scenarioFilter[f.key] && scenarioFilter[f.key].size);

  } else {
    const rows = el("div",{class:"rows"});
    matching.forEach(rec=>{

      // כל 16 הרשומות כאן הן נתוני הדגמה (SCENARIO_RECORDS_SEED) — אין עדיין

      // הוא תרחיש אמיתי ומאושר עם תוצרים אמיתיים בפועל (doc-actor/card-actor/
      // doc-trainee/doc-facilitator.html) — הקישור מוצג רק אליו, לא לשאר,
      // כדי לא ליצור רושם כוזב שלכל 16 יש תוצר (20/09/2026, בעקבות "רשימת
      // התרחישים אינה מקושרת לתוצר עצמו").
      const REAL_PRODUCTS = { s1: "doc-facilitator.html" };

      if (!REAL_PRODUCTS[rec.id]) nm.append(el("span",{style:"color:var(--muted);font-size:11.5px"},"אין תוצר אמיתי — רשומת הדגמה"));

      del.addEventListener("click",()=> ask("הסרת \""+rec.name+"\"",
        "מחיקת תרחיש בודד, בלתי הפיכה. מומלץ לייצא לפני.",
        ()=>{
          saveScenarioRecords(loadScenarioRecords().filter(x=>x.id!==rec.id));
          render();
        }));
      r.append(el("span",{class:"role"}, rec.age), del);
      rows.append(r);
    });

  }

  // פעולות על התוצאה: ייצוא (לא "למחקר" — פשוט ייצוא, בלי קשר לשימוש
  // שהיא מתכננת) ומחיקה מדורגת, שתי הפעולות פועלות על matching בלבד.
  const arow = el("div",{style:"margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);display:flex;gap:8px;flex-wrap:wrap;align-items:center"});

  bCsv.disabled = !matching.length;
  bCsv.addEventListener("click",()=> exportScenarioRecords(matching,"csv"));
  const bJson = el("button",{class:"act"},"ייצוא JSON");
  bJson.disabled = !matching.length;
  bJson.addEventListener("click",()=> exportScenarioRecords(matching,"json"));
  // "מחיקה תמיד תהיה לקבוצת תרחישים שתבחר לפי קריטריונים או לתרחיש בודד.
  // אסור שיהיה כפתור מחיקה כולל!" — מנוטרל כשאין שום סינון פעיל.
  const bDel = el("button",{class:"act d"}, "מחיקת " + matching.length + " המסוננים");
  bDel.disabled = !anyActive || !matching.length;
  bDel.title = anyActive ? "" : "בחרי קריטריון סינון אחד לפחות — אין כפתור שמוחק הכול";

      matching.slice(0,3).map(r=>r.name).join("، ") + (matching.length>3 ? " ועוד "+(matching.length-3) : "") +

      const ids = new Set(matching.map(r=>r.id));

  cf.append(finn); w.append(cf);
  return w;
}

// ── סיסמאות וקודים (ניהול מערכת) ──
// הכול נשמר ונבדק בשרת ב-Render (harness/lib/access.mjs). סיסמת מנהלת המערכת
// נשלחת עם כל פעולה ונשמרת רק בזיכרון הדף הזה (משתנה), לא ב-storage ולא בכתובת.
const ACCESS_URL = "https://sbe-server.onrender.com/api/access";
let accessAuth = "";
let accessState = null;

async function accessCall(action, extra = {}){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 75000);
  try {
    const r = await fetch(ACCESS_URL, { method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ action, auth: accessAuth, token: sysToken(), ...extra }), signal: ctrl.signal });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || String(r.status)); e.status = r.status; e.data = data; throw e; }
    return data;
  } finally { clearTimeout(timer); }
}

// נתונים שנטענו מהשרת אחרי אימות — מתאפסים כשהסיסמה כבר לא תקפה.
let inbox = null;      // פניות מפרקטי (רעיונות / תקלות / שאלות)
let instList = null;   // מוסדות וקודים (ניהול מערכת)
let sysSettings = null; // ימי חסד ומגבלות קודי "משוב לעבודות"
// מנהלת המערכת שנכנסה עם סיסמה ב-entry.html מקבלת אסימון חתום — ואז אין צורך
// להקליד את הסיסמה שוב כאן. אם האסימון פג, חוזר כרטיס הסיסמה.
let tokenFailed = false;
function sysToken(){
  if (tokenFailed) return "";
  try { return sessionStorage.getItem("sbe.session.homeUrl") === "admin.html?role=sys" ? (sessionStorage.getItem("sbe.session.token") || "") : ""; } catch(e){ return ""; }
}
let myInst = null;     // קוד המוסד של מנהלת המוסד
let openInst = null;   // המוסד שפתוח כרגע ברשימה (נשאר פתוח אחרי שמירה)
let gateFailed = false;

function resetAccessData(){ if (!accessAuth && sysToken()) tokenFailed = true; accessAuth = ""; accessState = null; instList = null; homeData = null; myInst = null; inbox = null; critData = null; }

function accessFail(e){
  ask("הפעולה לא בוצעה",
    e.status === 403 ? "הסיסמה כבר לא תקפה. הקלידי אותה מחדש." : "אין כרגע חיבור לשרת. נסי שוב בעוד רגע.",
    () => { if (e.status === 403) { resetAccessData(); render(); } });
}

// כרטיס אימות משותף. הסיסמה נשמרת רק בזיכרון הדף (accessAuth), לא ב-storage.
function unlockCard(pwLabel, loader){
  const c = el("div",{class:"card"});
  c.append(el("h3",{},"אימות"));
  const inn = el("div",{class:"in"});
  const pw = el("input",{type:"password", placeholder:pwLabel, autocomplete:"off"});
  pw.style.width = "100%";
  const err = el("div",{class:"lock"}, "אין כרגע חיבור לשרת. נסי שוב בעוד רגע.");
  err.hidden = !gateFailed;
  const go = el("button",{class:"act p"},"פתיחה");
  const submit = async () => {
    accessAuth = pw.value.replace(/[‎‏؜]/g, "").trim();
    gateFailed = false;
    go.disabled = true; go.textContent = "בודקת... (לפעמים עד דקה)";
    try { await loader(); render(); }
    catch (e) {
      accessAuth = "";
      err.textContent = e.status === 403 ? "סיסמה שגויה." : "אין כרגע חיבור לשרת. נסי שוב בעוד רגע.";
      err.hidden = false; go.disabled = false; go.textContent = "פתיחה";
    }
  };
  go.addEventListener("click", submit);
  pw.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  inn.append(el("p",{style:"margin:0 0 10px;font-size:14.5px;color:var(--muted)"},
    "כדי לראות ולשנות, הקלידי את " + pwLabel + ". היא נשמרת רק כל עוד הדף הזה פתוח."),
    pw, err, el("div",{class:"btnrow"}, go));
  c.append(inn);
  return c;
}

// מחזירה true כשהנתונים כבר נטענו. אחרת: אם כבר יש סיסמה בזיכרון — טוענת
// ברקע ומציגה "טוענת"; אם אין — מציגה את כרטיס האימות.
function gate(w, loaded, loader, pwLabel){
  if (loaded) return true;
  if ((accessAuth || sysToken()) && !gateFailed) {
    w.append(el("p",{class:"sub"},"טוענת... (לפעמים עד דקה)"));
    loader().then(() => render())
      .catch(e => { if (e.status === 403) resetAccessData(); else gateFailed = true; render(); });
    return false;
  }
  w.append(unlockCard(pwLabel, loader));
  return false;
}

    el("div",{class:"bigcode" + (code ? "" : " none")}, code || "————"),
    el("div",{class:"meta"}, code
      ? ["נוצר ב-" + new Date(accessState.academicCreatedAt).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit"}), el("br"), "מקלידים אותו בשדה \"הקוד שלך\" במסך הכניסה — ומגיעים רק למשוב לעבודות"]
      : "אין קוד פעיל. אף אחת לא יכולה להיכנס כרגע ל\"משוב לעבודות\".")));
  const row1 = el("div",{class:"btnrow"});
  if (code) {
    const bCopy = el("button",{class:"act"},"העתקה");
    bCopy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(code);
      bCopy.textContent = "הועתק"; setTimeout(() => bCopy.textContent = "העתקה", 1400); } catch(e){} });
    row1.append(bCopy);
  }
  const bNew = el("button",{class:"act p"}, code ? "החלפת קוד" : "הפקת קוד");
  bNew.addEventListener("click", () => {
    const run = async () => { try { accessState = await accessCall("newAcademicCode"); render(); } catch(e){ fail(e); } };
    if (code) ask("החלפת הקוד", "הקוד הנוכחי יפסיק לעבוד מיד. מי שכבר בתוך מסך המשוב תוכל להמשיך, אבל כל כניסה חדשה תדרוש את הקוד החדש.", run);
    else run();
  });
  row1.append(bNew);
  if (code) {
    const bOff = el("button",{class:"act d"},"ביטול הקוד");
    bOff.addEventListener("click", () => ask("ביטול הקוד", "אחרי הביטול אף אחת לא תוכל להיכנס ל\"משוב לעבודות\" עד שתפיקי קוד חדש.",
      async () => { try { accessState = await accessCall("revokeAcademicCode"); render(); } catch(e){ fail(e); } }));
    row1.append(bOff);
  }
  in1.append(row1); c1.append(in1);

  // החלפת סיסמאות
  const c2 = el("div",{class:"card"});
  c2.append(el("h3",{},"החלפת הסיסמה"));
  const in2 = el("div",{class:"in"});
  const LABELS = { sys:"מנהלת המערכת" };
  // מנהלי/ות המוסדות לא נכנסים בסיסמה: לכל מוסד קוד משלו, בלשונית "מוסדות".
  ["sys"].forEach((kind, i) => {
    const box = el("div",{style: i ? "margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)" : ""});
    const isDefault = accessState.defaultPasswords[kind];
    box.append(el("b",{style:"display:block;margin-bottom:4px"}, "סיסמת " + LABELS[kind]),
      el("p",{style:"margin:0 0 8px;font-size:13.5px;color:var(--muted)"}, isDefault
        ? "עדיין בתוקף הסיסמה הישנה, שהייתה גלויה בקוד של האתר. מומלץ להחליף."
        : "הוחלפה. הסיסמה הישנה כבר לא עובדת."));
    const p1 = el("input",{type:"password", placeholder:"סיסמה חדשה (8 תווים לפחות)", autocomplete:"new-password"});
    const p2 = el("input",{type:"password", placeholder:"הקלדה חוזרת", autocomplete:"new-password"});
    [p1, p2].forEach(x => { x.style.flex = "1"; x.style.minWidth = "150px"; });
    const msg = el("div",{class:"lock"}); msg.hidden = true;
    const bSet = el("button",{class:"act p"},"החלפה");
    bSet.addEventListener("click", () => {
      const a = p1.value.replace(/[‎‏؜]/g, "").trim(), b = p2.value.replace(/[‎‏؜]/g, "").trim();
      msg.hidden = true;
      if (a.length < 8) { msg.textContent = "הסיסמה צריכה להיות באורך 8 תווים לפחות."; msg.hidden = false; return; }
      if (a !== b) { msg.textContent = "שתי ההקלדות לא זהות."; msg.hidden = false; return; }
      ask("החלפת סיסמת " + LABELS[kind],
        "הסיסמה הקודמת תפסיק לעבוד מיד. שמרי את החדשה במקום בטוח — אי אפשר לשחזר אותה, רק להחליף שוב.",
        async () => {
          try {
            accessState = await accessCall("setPassword", { kind, newPassword: a });
            if (kind === "sys") accessAuth = a;
            render();
          } catch(e){ fail(e); }
        });
    });
    box.append(el("div",{class:"btnrow"}, p1, p2, bSet), msg);
    in2.append(box);
  });
  c2.append(in2);

  w.append(c2, c1, el("div",{class:"note"},
    el("b",{},"טוב לדעת. "),
    "הסיסמאות נשמרות בשרת באופן מוצפן, ולכן גם כאן אי אפשר לראות אותן — רק להחליף. את קוד המשוב לעבודות אפשר לראות, כי צריך למסור אותו."));
  return w;
}

function ask(t, msg, ok){
  $("dh").textContent = t; $("db").textContent = msg;
  const d = $("dlg"); d.showModal();
  $("dok").onclick = () => { d.close(); ok(); };
  $("dno").onclick = () => d.close();
}

// קוד אישי (01/10/2026): לאדם יחיד — למשל מרצה שמקבלת רק "משוב לעבודות" — בלי קוד
// מנהל/ת ובלי ניהול צוות. פותח רק את המערכות שמסומנות, ורק מתוך מה שפתוח למוסד.
function openPersonalDlg(x) {
  const d = $("pcDlg"), body = $("pcDb"), ok = $("pcOk");
  $("pcDh").textContent = "קוד אישי — " + x.name;
  body.textContent = ""; ok.hidden = false; ok.disabled = false;
  $("pcCancel").onclick = () => d.close();
  const open = x.open || [];
  if (!open.length) {
    body.append(el("p",{style:"margin:0;color:var(--brick)"}, "עדיין לא נפתחו מערכות למוסד הזה. קודם לחצי \"מערכות פתוחות\" ובחרי מה פתוח לו."));
    ok.hidden = true; d.showModal(); return;
  }
  body.append(el("p",{style:"margin:0 0 12px;font-size:13.5px;color:var(--muted);line-height:1.6"},
    "קוד לאדם אחד. מי שנכנס/ת איתו רואה רק את מה שמסומן כאן, ולא מנהל/ת צוות. אם מסמנים \"הפקת קודים לסטודנטים\" — אפשר גם לתת לסטודנטים קודים למשוב."));
  const name = el("input",{type:"text",placeholder:"שם (למשל: ולרי)",maxlength:"60",
    style:"width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--hair);border-radius:6px;background:var(--ground);color:var(--ink);margin-bottom:12px"});
  body.append(name);
  const cbs = {};
  open.forEach(p => {
    const cb = el("input",{type:"checkbox",id:"pc_"+p,style:"width:18px;height:18px"}); cb.checked = true; cbs[p] = cb;
    body.append(el("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:8px"}, cb,
      el("label",{"for":"pc_"+p,style:"font-size:15px"}, MOD_LABELS[p] || p)));
  });
  const out = el("div",{style:"margin-top:12px"}); body.append(out);
  ok.onclick = async () => {
    const perms = open.filter(p => cbs[p].checked);
    if (!perms.length) { out.textContent = "צריך לסמן לפחות מערכת אחת."; return; }
    ok.disabled = true; out.textContent = "מפיקה... (לפעמים עד דקה)";
    try {
      const r = await accessCall("codeCreate", { kind: "staff", inst: x.name, perms, label: name.value.trim(),
        expiresAt: x.sub && x.sub.subEnd ? x.sub.subEnd : null });
      out.textContent = "";
      out.append(el("div",{style:"font-size:13.5px;color:var(--muted)"}, "הקוד מוכן. מעבירים אותו לאדם, והוא/היא מקלידים אותו במסך הכניסה:"),
        el("div",{class:"bigcode",style:"margin-top:6px"}, r.code.code));
      ok.hidden = true; instList = null; render();
    } catch (e) { ok.disabled = false; out.textContent = "לא הצלחתי להפיק קוד. נסי שוב."; }
  };
  d.showModal();
}

function openModDlg(instName) {
  $("modDh").textContent = "מערכות פתוחות — " + instName;
  const body = $("modDb");
  body.textContent = "";

  body.append(el("p",{style:"margin:0;font-size:14px;color:var(--muted)"}, "טוענת את ההגדרות... (לפעמים עד דקה)"));
  $("modSave").disabled = true;
  $("modDlg").showModal();
  $("modCancel").onclick = () => $("modDlg").close();

  accessCall("getModules", { inst: instName })
    .then(cfg => ({ cfg, loaded: true }))
    .catch(() => ({ cfg: {}, loaded: false }))
    .then(({ cfg, loaded }) => {
      body.textContent = "";
      $("modSave").disabled = false;
      if (!loaded) body.append(el("div",{class:"lock",style:"margin-top:0"},
        "לא הצלחתי לטעון את ההגדרות השמורות מהשרת — מוצג כאן \"הכול כבוי\". שמירה תחליף את מה ששמור."));

      const note = el("p",{style:"margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.6"},
        "התקרה של המוסד: רק מה שמסומן כאן מנהל/ת המוסד יכול/ה לתת לצוות. ברירת מחדל: הכול כבוי — מסמנים רק את מה שהמוסד צריך.");
      body.append(note);

      const toggles = {};
      Object.entries(MOD_LABELS).forEach(([k, label]) => {
        const row = el("div",{style:"display:flex;align-items:center;gap:12px;margin-bottom:10px;"});
        const cb = el("input",{type:"checkbox",id:"mod_"+k,style:"width:18px;height:18px;cursor:pointer;"});
        cb.checked = cfg[k] === true;
        toggles[k] = cb;
        const lbl = el("label",{"for":"mod_"+k,style:"font-size:15px;cursor:pointer;"}, label);
        row.append(cb, lbl);
        body.append(row);
      });

      // סיסמת מנהלת המערכת: אם כבר הוקלדה בלשונית "סיסמאות וקודים" בדף הזה —
      // משתמשים בה; אחרת מבקשים אותה כאן. נשמרת רק בזיכרון הדף.
      const sep = el("div",{style:"margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);"});
      const pwInput = el("input",{type:"password",placeholder:"סיסמת מנהלת המערכת", autocomplete:"off",
        style:"width:100%;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--hair);border-radius:6px;background:var(--ground);color:var(--ink);direction:rtl;"});
      const errMsg = el("p",{style:"display:none;color:var(--brick);font-size:13px;margin:6px 0 0;"}, "");
      if (!accessAuth && !sysToken()) {
        sep.append(el("label",{style:"display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;"},
          "סיסמת מנהלת המערכת לאישור השמירה"), pwInput);
      }
      sep.append(errMsg);
      body.append(sep);

      const dlg = $("modDlg");
      $("modSave").onclick = async () => {
        const typed = pwInput.value.replace(/[‎‏؜]/g, "").trim();
        if (!accessAuth && !sysToken() && !typed) { errMsg.textContent = "יש להקליד את סיסמת מנהלת המערכת."; errMsg.style.display = "block"; return; }
        errMsg.style.display = "none";
        $("modSave").disabled = true;
        $("modSave").textContent = "שומרת...";
        const prevAuth = accessAuth;
        if (!accessAuth) accessAuth = typed;
        try {
          const modules = {};
          Object.keys(toggles).forEach(k => modules[k] = toggles[k].checked);
          await accessCall("setModules", { inst: instName, modules });
          dlg.close(); instList = null; render();
        } catch (e) {
          accessAuth = prevAuth;
          errMsg.textContent = e.status === 403 ? "סיסמה שגויה." : "אין כרגע חיבור לשרת. נסי שוב בעוד רגע.";
          errMsg.style.display = "block";
        } finally {
          $("modSave").disabled = false;
          $("modSave").textContent = "שמירה בשרת";
        }
      };
    });
}

$("role").addEventListener("change", e => { if (!isSysSession) return; role = e.target.value; render(); });

function checkCritPending(){
  if (role !== "sys" || !sysToken()) return;
  accessCall("critAdmin").then(d => { const n = (d.pending || []).length; critData = d; if (n !== critPendingN) { critPendingN = n; render(); } }).catch(() => {});
}
checkCritPending(); setInterval(checkCritPending, 300000);
// מסע אל החוסן — כמה מסעות ממתינים למנהלת המערכת
function checkJourneys(){
  if (role !== "sys" || !sysToken()) return;
  accessCall("jrAll").then(d => { const n = (d.items || []).filter(x => x.pendingAdmin).length; if (n !== jrPendingN) { jrPendingN = n; render(); } }).catch(() => {});
}
checkJourneys(); setInterval(checkJourneys, 300000);

// ── סרגל הניווט הגלובלי (חזרה/תפריט) — אותו רכיב שיש לכל שאר המסכים,
// מוטמע כאן ישירות (לא הקובץ המשותף) כי התפריט חייב לדעת להחליף tab
// פנימי, לא רק לנווט לקובץ אחר (09/09/2026, מחליף את תפריט הצד הקבוע). ──
const navPanel = $("navPanel");
$("navMenuBtn").addEventListener("click", () => { navPanel.hidden = !navPanel.hidden; });
$("navBack").addEventListener("click", () => {
  if (window.history.length > 1) window.history.back();
  else location.href = "entry.html";
});
// כפתור "⌂ המסך שלי" (22/09/2026) — אותה לוגיקה כמו lib/nav-widget.html,
// מוטמעת כאן כי admin.html לא משתמש בקובץ המשותף. admin.html עצמו הוא לרוב
// ה-homeUrl של מנהלת/ניהול מערכת — הכפתור מוסתר אוטומטית כשכבר נמצאים כאן.
try {
  const homeUrl = sessionStorage.getItem("sbe.session.homeUrl");
  if (homeUrl) {
    const hereFull = (location.pathname.split("/").pop() || "") + location.search;
    if (hereFull !== homeUrl) {
      const homeBtn = $("navHome");
      homeBtn.hidden = false;
      homeBtn.addEventListener("click", () => { location.href = homeUrl; });
    }
  }
} catch(e){}
document.addEventListener("click", e => {
  if (!navPanel.hidden && !e.target.closest("#navPanel") && !e.target.closest("#navMenuBtn")) navPanel.hidden = true;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !navPanel.hidden) navPanel.hidden = true;
});

      <label>ההצעות של המערכת התאימו למה שרצית?</label>
      <select id="rptFit"><option value="">לא צוין</option><option>כן במלואן</option><option>חלקית</option><option>לא</option></select>
      <label>המערכת ידידותית</label>
      <select id="rptFriendly"><option value="">לא צוין</option><option>במידה רבה</option><option>במידה בינונית</option><option>במידה מועטה</option></select>
      <label>האם תרצה/י להמשיך להשתמש במערכת?</label>
      <select id="rptContinue"><option value="">לא צוין</option><option>במידה רבה</option><option>במידה בינונית</option><option>במידה מועטה</option></select>
      <label>למי היית ממליץ/ה להשתמש במערכת?</label>
      <input id="rptRecommend" placeholder="לא חובה">
      <label>מה חסר, מה היה מבלבל, או הערה אחרת?</label>
      <textarea id="rptUsageNotes" placeholder="לא חובה"></textarea>
    </div>
    <label>צילום מסך (לא חובה)</label>
    <input type="file" id="rptFile" accept="image/*">
  </div>
  <div class="rf">
    <button type="button" class="p" id="rptSend">שליחה במייל</button>
    <button type="button" id="rptCancel">ביטול</button>
  </div>
</dialog>
<script>
(function(){
  "use strict";
  if (window.self !== window.top) {
    // מוטמע בתוך iframe (admin.html/demo-hub.html) — העמוד המארח
    // מציג דיווח משלו; עותק כפול היה מתמקם לפי חלון ה-iframe ולא לפי המסך.
    var _rf = document.getElementById("rptFab"); if (_rf) _rf.remove();
    var _rd = document.getElementById("rptDlg"); if (_rd) _rd.remove();
    return;
  }
  var fab = document.getElementById("rptFab");
  var dlg = document.getElementById("rptDlg");
  var nameEl = document.getElementById("rptName");
  var dateEl = document.getElementById("rptDate");
  var roleEl = document.getElementById("rptRole");
  var errEl = document.getElementById("rptErr");
  var typeEl = document.getElementById("rptType");
  var genericEl = document.getElementById("rptGeneric");
  var usageEl = document.getElementById("rptUsage");
  var screenEl = document.getElementById("rptScreen");
  var screenName = document.title || location.pathname;

  // "משוב על השימוש במערכת" (17/09/2026) — סוג פנייה נוסף עם חמש שאלות
  // ייעודיות במקום "פירוט" חופשי, ותיוג אוטומטי של המסך שממנו זה נשלח
  // (המשתמשת: "איך אדע באיזה חלק השולח השתמש/ה?"). כל שליחה נשמרת גם
  // ב-localStorage (sbe.reports.<ts>), לא רק דרך mailto — כדי שיהיה מסך
  // תוצאות לקרוא אותן בחזרה, לא רק תיבת מייל.
  function syncType(){
    var isUsage = typeEl.value === "משוב על השימוש במערכת";
    genericEl.hidden = isUsage;
    usageEl.hidden = !isUsage;
  }
  typeEl.addEventListener("change", syncType);

  function openDlg(presetType){
    dateEl.value = new Date().toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit"});
    if (!nameEl.value) { try { nameEl.value = sessionStorage.getItem("sbe.session.name") || ""; } catch(e){} }
    try { roleEl.value = sessionStorage.getItem("sbe.session.role") || ""; } catch(e){}
    errEl.hidden = true;
    screenEl.textContent = "נשלח מהמסך: " + screenName;
    if (presetType) typeEl.value = presetType;
    syncType();
    dlg.showModal();
  }
  fab.addEventListener("click", function(){ openDlg(null); });
  // נקודת חיבור לפתיחה אוטומטית בסיום תרגול/יצירה — מסכים אחרים באותו
  // קובץ קוראים ל-window.sbeOpenUsageFeedback() מתוך handler ההשלמה שלהם.
  window.sbeOpenUsageFeedback = function(){ openDlg("משוב על השימוש במערכת"); };

  document.getElementById("rptCancel").addEventListener("click", function(){ dlg.close(); });
  document.getElementById("rptSend").addEventListener("click", function(){
    var name = nameEl.value.trim();
    var type = typeEl.value;
    var isUsage = type === "משוב על השימוש במערכת";
    var details = document.getElementById("rptDetails").value.trim();
    if (!name || (!isUsage && !details)) {
      errEl.textContent = isUsage ? "שם מלא הוא שדה חובה." : "שם מלא ופירוט הם שדות חובה.";
      errEl.hidden = false;
      return;
    }
    var roleVal = roleEl.value.trim() || "לא צוין";
    var record = {
      name: name, date: dateEl.value, role: roleVal, type: type, screen: screenName,
      details: details,
      fit: isUsage ? document.getElementById("rptFit").value : "",
      friendly: isUsage ? document.getElementById("rptFriendly").value : "",
      continueUsing: isUsage ? document.getElementById("rptContinue").value : "",
      recommend: isUsage ? document.getElementById("rptRecommend").value.trim() : "",
      notes: isUsage ? document.getElementById("rptUsageNotes").value.trim() : "",
      ts: Date.now()
    };
    try { localStorage.setItem("sbe.reports." + record.ts, JSON.stringify(record)); } catch(e){}
    var bodyLines = [
      "שם מלא: " + name,
      "תאריך: " + record.date,
      "תפקיד: " + roleVal,
      "סוג פנייה: " + type,
      "מסך: " + screenName,
      ""
    ];
    if (isUsage) {
      bodyLines.push(
        "ההצעות התאימו: " + (record.fit || "לא צוין"),
        "ידידותיות: " + (record.friendly || "לא צוין"),
        "ממשיכה להשתמש: " + (record.continueUsing || "לא צוין"),
        "המלצה למי: " + (record.recommend || "-"),
        "מה חסר/הערות: " + (record.notes || "-")
      );
    } else {
      bodyLines.push("פירוט:", details);
    }
    var subject = "Begood · " + type + " · " + name;
    // נשלח לתיבת הפניות בשרת (ומשם במייל למנהלת המערכת); בלי חיבור לשרת — חלון מייל כמו קודם
    var mailto = "mailto:yael.sade@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    var sendBtn = document.getElementById("rptSend");
    sendBtn.disabled = true;
    fetch("https://sbe-server.onrender.com/api/access", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "fbSubmit", type: type, name: name, contact: "", text: bodyLines.join("\n"), source: "דיווח / רעיון", page: screenName }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (!d || !d.ok) throw new Error("fail"); dlg.close(); alert("נשלח, תודה! הפנייה הגיעה למנהלת המערכת."); })
      .catch(function(){ dlg.close(); location.href = mailto; })
      .then(function(){ sendBtn.disabled = false; });
  });
})();
</script>
