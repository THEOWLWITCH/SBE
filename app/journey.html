<nav class="topnav no-print">

<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
// מסע אל החוסן — מסך המשתתפים: מיפוי → הצעת מסע עם אפשרויות → בחירות והסבר → אישור (ד״ר יעל שדה) → אבני דרך → תעודות → תו חוסן.
const J = window.SBE_JOURNEY, SRC = window.SBE_ADVISOR_SOURCES;
const AI_SERVER = 'https://sbe-server.onrender.com', ACCESS = AI_SERVER + '/api/access';
const F = k=>document.getElementById(k);
try{ const h=sessionStorage.getItem('sbe.session.homeUrl'); if(h) F('nav-home').href=h; }catch(e){}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;}
function withRefs(text){ // טקסט עם [מפתח] → קישורים למקורות; מפתח לא מוכר נשאר טקסט
  const frag=document.createDocumentFragment();
  String(text||'').split(/(\[[A-Za-z]+[0-9]{4}\])/).forEach(part=>{
    const m=part.match(/^\[([A-Za-z]+[0-9]{4})\]$/);
    if(m&&SRC.byKey[m[1]]&&SRC.byKey[m[1]].hidden){frag.appendChild(document.createTextNode('[ד״ר יעל שדה, Begood]'));}
    else if(m&&SRC.byKey[m[1]]){const a=el('a','ref',m[1]);a.href='resilience-advisor-sources.html#'+m[1];a.target='_blank';a.title=SRC.byKey[m[1]].apa;frag.appendChild(document.createTextNode('['));frag.appendChild(a);frag.appendChild(document.createTextNode(']'));}
    else if(!m)frag.appendChild(document.createTextNode(part)); // מפתח שאינו ברשימה — לא מוצג
  });
  return frag;
}
function inlineRich(text){ // **מודגש** → הדגשה, [מפתח] → קישור; כוכביות בודדות לא מוצגות
  const frag=document.createDocumentFragment();
  String(text||'').split(/\*\*([^*]+)\*\*/).forEach((part,i)=>{
    part=part.replace(/\*\*/g,'');
    if(i%2){const b=el('b');b.appendChild(withRefs(part));frag.appendChild(b);}else frag.appendChild(withRefs(part));
  });
  return frag;
}
// טקסט ארוך → פסקאות, תבליטים, רשימות ממוספרות ותת־כותרות, עם רווח ביניהם (לקריאה נוחה)
function richText(text){
  const box=el('div','rich');let list=null;
  const close=()=>{list=null;};
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line){close();return;}
    let m;
    if((m=line.match(/^#{1,6}\s*(.+)$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    if((m=line.match(/^(?:[-•*●▪]|–)\s+(.+)$/))){if(!list||list.tagName!=='UL'){list=el('ul');box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[1]));list.appendChild(li);return;}
    if((m=line.match(/^(\d{1,2})[.)]\s+(.+)$/))){if(!list||list.tagName!=='OL'){list=el('ol');list.start=+m[1];box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[2]));list.appendChild(li);return;}
    if((m=line.match(/^\*\*([^*]+)\*\*[:：]?$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    close();const p=el('p');p.appendChild(inlineRich(line));box.appendChild(p);
  });
  return box;
}
async function complete(system,messages,maxTokens){
  // ברקע, עם שאילת מצב (lib/ai-call.js) — בקשה ארוכה אחת נקטעה בדרך (06/10/2026)
  return String(await sbeCallAI(AI_SERVER,{system,messages,maxTokens},480000)||'');
}



function accessApi(body){return fetch(ACCESS,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json().catch(()=>({})).then(d=>{d._status=r.status;return d;}));}
function token(){try{return sessionStorage.getItem('sbe.session.token')||'';}catch(e){return '';}}
const api = (action, extra) => accessApi({ action, token: token(), ...(extra || {}) });
const fmt = d => d ? String(d).slice(0,10).split('-').reverse().map((x,i)=>i===2?x.slice(2):x).join('.') : '';
const today = () => new Date().toISOString().slice(0,10);
const daysTo = d => Math.round((Date.parse(d) - Date.parse(today())) / 864e5);
const unitT = k => (J.UNITS.find(u => u.k === k) || {}).t || '';
const clT = c => (J.CLUSTERS.find(x => x.k === +c) || {}).t || '';
const stT = s => (J.STAGES.find(x => x.k === +s) || {}).t || '';
const draftKey = id => window.sbeUserKey ? sbeUserKey('sbe.journey.draft.' + id) : 'sbe.journey.draft.' + id;
function loadDraft(id){ try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}') || {}; } catch(e){ return {}; } }
function saveDraft(id, d){ try { localStorage.setItem(draftKey(id), JSON.stringify(d)); } catch(e){} }
function btn(text, cls, fn){ const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
function card(){ const c = el('div', 'card'); F('app').appendChild(c); return c; }
function errLine(c){ const e = el('p', 'err'); e.hidden = true; c.appendChild(e); return t => { e.textContent = t || ''; e.hidden = !t; }; }
function parseJSON(t){ const m = String(t || '').match(/\{[\s\S]*\}/); if (!m) throw new Error('לא התקבל מבנה תקין'); return JSON.parse(m[0]); }

// מפת המסע: חמש תחנות
function journeyMap(j){
  const box = el('div', 'jmap'); const ms = j.milestones || [];
  const cur = ms.length ? ((ms.find(m => m.status !== 'approved') || {}).stage || 6) : (j.startStage || 1);
  J.STAGES.forEach(s => {
    const st = el('div', 'st' + (s.k < cur || (ms.length && ms.every(m => m.status === 'approved')) ? ' reached' : '') + (s.k === cur ? ' now' : ''));
    st.appendChild(el('div', 'dot', s.k < cur ? '✓' : s.k));
    st.appendChild(el('div', 'nm', s.t)); st.appendChild(el('div', 'sb', s.sub));
    const mine = ms.filter(m => m.stage === s.k);
    if (mine.length) st.appendChild(el('div', 'cnt', mine.filter(m => m.status === 'approved').length + '/' + mine.length));
    box.appendChild(st);
  });
  return box;
}

// ── רשימת המסעות + מסע חדש ──
async function viewList(){
  const app = F('app'); app.textContent = '';
  const c = card();
  c.appendChild(el('h1', null, 'מסע אל החוסן'));
  const p = el('p'); p.appendChild(inlineRich('מסע מלווה בשלבים אל **תו חוסן לקהילת חוסן** — מגן ומכיתה ועד בית ספר וקהילה. מתחילים במיפוי קצר, מקבלים הצעת מסע עם אפשרויות, בוחרים יחד, ויוצאים לדרך עם אבני דרך ברורות ותעודה על כל אחת מהן. לאורך כל הדרך — ליווי אישי של ד״ר יעל שדה.')); c.appendChild(p);
  { const ar = el('p', 'muted'); ar.style.cssText = 'font-size:.9rem;margin:.45rem 0 0'; ar.appendChild(document.createTextNode('📖 ')); const a = el('a', null, 'לבחור בחוסן שלנו'); a.href = 'about.html?from=journey.html#article'; a.target = '_blank'; a.rel = 'noopener'; a.style.fontWeight = '700'; ar.appendChild(a); ar.appendChild(document.createTextNode('. מאמר קצר על המושגים שבבסיס המסע: מנגנונים חברתיים, קהילת חוסן ותו חוסן.')); c.appendChild(ar); }
  if (window.SBE_PEEK) SBE_PEEK.mount(null, c.lastElementChild); // תוצר לדוגמה (lib/example-peek.js)
  const tmp = el('div', 'jmap'); J.STAGES.forEach(s => { const st = el('div', 'st'); st.appendChild(el('div', 'dot', s.k)); st.appendChild(el('div', 'nm', s.t)); st.appendChild(el('div', 'sb', s.sub)); tmp.appendChild(st); }); c.appendChild(tmp);
  const list = card(); list.appendChild(el('h2', null, 'המסעות שלי')); const lw = el('p', 'muted', 'טוענת...'); list.appendChild(lw);
  const d = await api('jrMine'); lw.remove();
  if (d._status === 403) { list.appendChild(el('p', 'err', 'כדי לצאת למסע, אפשר להיכנס עם קוד שיש בו הרשאת "מסע אל החוסן".')); return; }
  (d.items || []).forEach(s => {
    const r = el('div', 'ms'); const h = el('h3'); h.appendChild(document.createTextNode(s.unitName)); h.appendChild(el('span', 'tagx', unitT(s.unit))); r.appendChild(h);
    const st = { mapping: 'מיפוי ראשוני', proposal: 'הצעת המסע מחכה לבחירות שלכם', review: 'ההצעה אצל ד״ר יעל שדה', active: 'בדרך: ' + stT(s.stage), done: 'קהילת חוסן: המסע הושלם 🎉' }[s.status] || '';
    r.appendChild(el('div', 'meta', st + (s.total ? ' · ' + s.approved + '/' + s.total + ' אבני דרך' : '') + (s.next ? ' · הבאה: ' + fmt(s.next) : '')));
    const b = btn('כניסה למסע', 'btn-ghost', () => { location.hash = s.id; }); b.style.marginTop = '.5rem'; r.appendChild(b); list.appendChild(r);
  });
  if (!(d.items || []).length) list.appendChild(el('p', 'muted', 'עדיין אין מסעות. אפשר לצאת למסע חדש למטה.'));
  // מסע חדש
  const n = card(); n.appendChild(el('h2', null, 'יוצאים למסע חדש'));
  const row = el('div', 'row2'); const a = el('div'), b2 = el('div');
  a.appendChild(el('label', null, 'המסגרת')); const sel = document.createElement('select'); J.UNITS.forEach(u => { const o = el('option', null, u.t + ' (כ-' + u.months + ' חודשים)'); o.value = u.k; sel.appendChild(o); }); a.appendChild(sel);

function mappingText(m){
  const L = ['המסגרת: ' + unitT(JR.unit) + ' — ' + JR.unitName, ''];

  L.push('', 'נקודות שבירה (חלופות):'); J.FAILS.forEach(f => L.push('- ' + f.t + (f.critical ? ' (קריטית)' : '') + ': ' + (m.fails[f.k] === undefined ? 'לא נענה' : J.FAIL_OPTS[m.fails[f.k]])));

    'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc('בעוד שבוע: ' + m.title), 'END:VALARM', 'BEGIN:VALARM', 'TRIGGER:-P2D', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc('בעוד יומיים: ' + m.title), 'END:VALARM', 'END:VEVENT'); });
  L.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' })); a.download = 'begood-journey.ics'; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
}
function viewActive(){
  const ms = JR.milestones || []; const next = ms.find(m => m.status !== 'approved');
  const c = card();
  if (JR.status === 'done') { c.appendChild(el('h2', null, '🎉 קהילת חוסן: המסע הושלם')); const last = ms[ms.length - 1];
    if (last && last.cert) { const a = el('a', 'btn', 'לתו החוסן לקהילת חוסן'); a.href = 'journey-cert.html?id=' + JR.id + '&code=' + last.cert.code; a.target = '_blank'; a.style.textDecoration = 'none'; c.appendChild(a); }
    finalReflection(c);
  } else if (next) {
    const dd = daysTo(next.due);
    c.appendChild(el('p', 'banner-soft', (next.status === 'submitted' ? 'הגשתם את "' + next.title + '": המשוב בדרך.' : dd < 0 ? J.ICON.rest + ' עצירת התרעננות: "' + next.title + '" חיכתה ל-' + fmt(next.due) + '. אפשר להגיש עכשיו, או לבקש דחייה.' : 'אבן הדרך הבאה: "' + next.title + '" — ' + (dd === 0 ? 'היום' : 'בעוד ' + dd + ' ימים') + ' (' + fmt(next.due) + ').')));
  }

  ms.forEach((m, i) => milestoneCard(m, i));
}
function milestoneCard(m, i){
  const c = el('div', 'ms ' + m.status); F('app').appendChild(c);
  const h = el('h3'); h.appendChild(document.createTextNode((i + 1) + '. ' + m.title));
  if (m.gate) h.appendChild(el('span', 'tagx gate', J.ICON.gate + ' שער: סיום ' + stT(m.stage)));
  h.appendChild(el('span', 'tagx ' + ({ approved: 'ok', submitted: 'sub', needs: 'need' }[m.status] || ''), (m.status === 'approved' ? J.ICON.done + ' ' : '') + J.MS_LABEL[m.status]));
  c.appendChild(h); c.appendChild(el('div', 'meta', stT(m.stage) + ' · עד ' + fmt(m.due)));
  // טבלה (07/10/2026, "קו אחיד"): יעדים · מה מגישים · טיפ
  const rows = [];
  if ((m.goals || []).length) { const ul = el('ul'); m.goals.forEach(g => { const li = el('li'); li.appendChild(el('span', 'cl-chip', clT(g.c))); li.appendChild(document.createTextNode(g.goal)); if (g.measure) li.appendChild(el('div', 'muted', 'איך נדע: ' + g.measure)); ul.appendChild(li); }); rows.push(['יעדים ואיך נדע', ul]); }

  if (m.status === 'approved' && m.cert) { const a = el('a', 'btn btn-ghost', '🏅 לתעודה'); a.href = 'journey-cert.html?id=' + JR.id + '&code=' + m.cert.code; a.target = '_blank'; a.style.textDecoration = 'none'; c.appendChild(a); }
  if (JR.status === 'active' && (m.status === 'open' || m.status === 'needs')) submitForm(c, m, i);
  threadInline(c, i);
}
function submitForm(c, m, i){
  const det = document.createElement('details'); det.className = 'no-print'; const sm = el('summary', null, m.status === 'needs' ? 'השלמה והגשה מחדש' : 'הגשת אבן הדרך'); sm.style.cssText = 'cursor:pointer;color:var(--spoken);font-weight:700;margin-top:.5rem'; det.appendChild(sm);
  det.appendChild(el('label', null, 'מה עשיתם: תיאור והראיות *'));
  const ev = document.createElement('textarea'); ev.maxLength = 3000; ev.placeholder = 'תארו מה נעשה, מי השתתף, ומה רואים היום שלא היה קודם. בלי פרטים מזהים של ילדים.'; det.appendChild(ev);
  det.appendChild(el('label', null, 'קישורים (תיעוד, תמונות, מסמכים): קישור בכל שורה'));

  if (m.gate) {
    det.appendChild(el('h3', null, 'רפלקציה בשער'));

    const eff = document.createElement('select'); ['', 'קידמו מאוד', 'קידמו', 'לא השפיעו במיוחד', 'עיכבו מעט', 'עיכבו'].forEach(x => { const o = el('option', null, x || 'בחירה'); o.value = x; eff.appendChild(o); }); det.appendChild(eff);
    const effT = document.createElement('textarea'); effT.maxLength = 800; effT.placeholder = 'כמה מילים על ההשפעה'; effT.style.minHeight = '3rem'; det.appendChild(effT);
    det.appendChild(el('label', null, 'אם הייתם מחליטים שוב היום, מה הייתם בוחרים? נשמח לשמוע את השיקולים'));
    const ag = document.createElement('textarea'); ag.maxLength = 800; ag.style.minHeight = '3rem'; det.appendChild(ag);
    det.appendChild(el('label', null, 'מה גיליתם על עצמכם כקהילה?'));
    const lr = document.createElement('textarea'); lr.maxLength = 800; lr.style.minHeight = '3rem'; det.appendChild(lr);
    refl = () => ({ effect: [eff.value, effT.value.trim()].filter(Boolean).join(': '), again: ag.value.trim(), learned: lr.value.trim() });
  }
  const err = errLine(det);
  const go = btn('הגשה', '', async () => {
    if (ev.value.trim().length < 10) return err('נשמח לתיאור קצר של מה שנעשה.');
    go.disabled = true; const r = await api('jrSubmitMilestone', { id: JR.id, mi: i, submission: { evidence: ev.value.trim(), links: ln.value.split('\n').map(x => x.trim()).filter(x => /^https?:\/\//.test(x)).slice(0, 10), reflection: refl ? refl() : undefined } });
    if (r.ok) { await viewJourney(JR.id); } else { err('ההגשה לא נשלחה. נסו שוב.'); go.disabled = false; }
  }); go.style.marginTop = '.6rem'; det.appendChild(go);
  c.appendChild(det);
}
// שרשור: לכל אבן דרך (ולמסע כולו) — הערות, ערעור, בקשת דחייה ותשובות
function threadInline(c, mi){
  const msgs = (JR.thread || []).filter(x => (x.mi === mi));
  const t = el('div', 'thread');
  msgs.forEach(x => { const m = el('div', 'm ' + (x.by === 'admin' ? 'admin' : 'owner')); m.appendChild(el('span', 'who', (x.by === 'admin' ? 'ד״ר יעל שדה' : ({ appeal: 'ערעור', extension: 'בקשת דחייה', comment: 'אתם' }[x.kind] || 'אתם')) + ' · ' + fmt(x.at))); m.appendChild(document.createTextNode(x.text)); t.appendChild(m); });
  if (JR.status !== 'done') {
    const det = document.createElement('details'); det.className = 'no-print'; const sm = el('summary', null, mi === null ? 'הודעה לד״ר יעל שדה' : 'הערה, שאלה, ערעור או בקשת דחייה'); sm.style.cssText = 'cursor:pointer;color:var(--muted);font-size:.88rem'; det.appendChild(sm);
    const kind = document.createElement('select'); [['comment', 'הערה או שאלה'], ['appeal', 'ערעור: הדרישה לא מתאימה או קשה מדי'], ['extension', 'בקשת דחייה של המועד']].forEach(([v, x]) => { const o = el('option', null, x); o.value = v; kind.appendChild(o); });
    if (mi !== null) det.appendChild(kind);
    const tx = document.createElement('textarea'); tx.maxLength = 2000; tx.placeholder = 'כתבו כאן: ההודעה נשמרת במסע ומגיעה לד״ר יעל שדה'; det.appendChild(tx);
    const err = errLine(det);
    const go = btn('שליחה', 'btn-ghost', async () => { if (tx.value.trim().length < 2) return err('אפשר לכתוב כאן כמה מילים ואז לשלוח.'); go.disabled = true;
      const r = await api('jrPost', { id: JR.id, mi, kind: mi === null ? 'comment' : kind.value, text: tx.value.trim() }); if (r.ok) await viewJourney(JR.id); else { err('לא נשלח. נסו שוב.'); go.disabled = false; } });
    go.style.marginTop = '.4rem'; det.appendChild(go); t.appendChild(det);
  }
  c.appendChild(t);
}
function threadCard(){ const c = card(); c.appendChild(el('h2', null, 'שיחה על המסע')); threadInline(c, null); }
function finalReflection(c){
  if (JR.final) { c.appendChild(el('p', 'muted', 'תודה על התחקיר המסכם!')); return; }
  c.appendChild(el('h3', null, 'תחקיר מסכם'));
