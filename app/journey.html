<nav class="topnav no-print">

  <a id="nav-home" href="home.html">⌂ המרחב שלי</a>
  <span class="crumb">Begood › רשת החוסן החברתי</span>

<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
// מסע אל החוסן — מסך המשתתפים: מיפוי → הצעת מסע עם אפשרויות → בחירות והסבר → אישור (ד״ר יעל שדה) → אבני דרך → תעודות → תו חוסן.
const J = window.SBE_JOURNEY, SRC = window.SBE_ADVISOR_SOURCES;
const AI_SERVER = 'https://sbe-server.onrender.com', ACCESS = AI_SERVER + '/api/access';
const F = k=>document.getElementById(k);
try{ const h=sessionStorage.getItem('sbe.session.homeUrl'); if(h) F('nav-home').href=h; }catch(e){}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;}
function withRefs(text){ // טקסט עם [מפתח] → קישורים למקורות; מפתח לא מוכר נשאר טקסט
  const frag=document.createDocumentFragment();
  String(text||'').split(/(\[[A-Za-z]+[0-9]{4}\])/).forEach(part=>{
    const m=part.match(/^\[([A-Za-z]+[0-9]{4})\]$/);
    if(m&&SRC.byKey[m[1]]&&SRC.byKey[m[1]].hidden){frag.appendChild(document.createTextNode('[ד״ר יעל שדה, Begood]'));}
    else if(m&&SRC.byKey[m[1]]){const a=el('a','ref',m[1]);a.href='resilience-advisor-sources.html#'+m[1];a.target='_blank';a.title=SRC.byKey[m[1]].apa;frag.appendChild(document.createTextNode('['));frag.appendChild(a);frag.appendChild(document.createTextNode(']'));}
    else if(!m)frag.appendChild(document.createTextNode(part)); // מפתח שאינו ברשימה — לא מוצג
  });
  return frag;
}
function inlineRich(text){ // **מודגש** → הדגשה, [מפתח] → קישור; כוכביות בודדות לא מוצגות
  const frag=document.createDocumentFragment();
  String(text||'').split(/\*\*([^*]+)\*\*/).forEach((part,i)=>{
    part=part.replace(/\*\*/g,'');
    if(i%2){const b=el('b');b.appendChild(withRefs(part));frag.appendChild(b);}else frag.appendChild(withRefs(part));
  });
  return frag;
}
// טקסט ארוך → פסקאות, תבליטים, רשימות ממוספרות ותת־כותרות, עם רווח ביניהם (לקריאה נוחה)
function richText(text){
  const box=el('div','rich');let list=null;
  const close=()=>{list=null;};
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line){close();return;}
    let m;
    if((m=line.match(/^#{1,6}\s*(.+)$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    if((m=line.match(/^(?:[-•*●▪]|–)\s+(.+)$/))){if(!list||list.tagName!=='UL'){list=el('ul');box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[1]));list.appendChild(li);return;}
    if((m=line.match(/^(\d{1,2})[.)]\s+(.+)$/))){if(!list||list.tagName!=='OL'){list=el('ol');list.start=+m[1];box.appendChild(list);}const li=el('li');li.appendChild(inlineRich(m[2]));list.appendChild(li);return;}
    if((m=line.match(/^\*\*([^*]+)\*\*[:：]?$/))){close();const h=el('h4');h.appendChild(inlineRich(m[1]));box.appendChild(h);return;}
    close();const p=el('p');p.appendChild(inlineRich(line));box.appendChild(p);
  });
  return box;
}
async function complete(system,messages,maxTokens,review){
  // ברקע, עם שאילת מצב (lib/ai-call.js) — בקשה ארוכה אחת נקטעה בדרך (06/10/2026)
  return String(await sbeCallAI(AI_SERVER,{system,messages,maxTokens,customerReview:!!review},480000)||'');
}
function completeJson(system,messages,maxTokens,review,check){
  return sbeCallAIJson(AI_SERVER,{system,messages,maxTokens,customerReview:!!review},480000,check);
}



async function accessApi(body){
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 90000);
  try {
    const r = await fetch(ACCESS,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
    const d = await r.json().catch(()=>({})); d._status = r.status; return d;
  } finally { clearTimeout(timer); }
}
function token(){try{return sessionStorage.getItem('sbe.session.token')||'';}catch(e){return '';}}
const api = (action, extra) => accessApi({ action, token: token(), ...(extra || {}) });
const fmt = d => d ? String(d).slice(0,10).split('-').reverse().map((x,i)=>i===2?x.slice(2):x).join('.') : '';
const today = () => new Date().toISOString().slice(0,10);
const daysTo = d => Math.round((Date.parse(d) - Date.parse(today())) / 864e5);
const unitT = k => (J.UNITS.find(u => u.k === k) || {}).t || '';
const clT = c => (J.CLUSTERS.find(x => x.k === +c) || {}).t || '';
const stT = s => (J.STAGES.find(x => x.k === +s) || {}).t || '';
const draftKey = id => window.sbeUserKey ? sbeUserKey('sbe.journey.draft.' + id) : 'sbe.journey.draft.' + id;
function loadDraft(id){ try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}') || {}; } catch(e){ return {}; } }
function saveDraft(id, d){ try { localStorage.setItem(draftKey(id), JSON.stringify(d)); } catch(e){} }
function btn(text, cls, fn){ const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; }
function card(){ const c = el('div', 'card'); F('app').appendChild(c); return c; }
function errLine(c){ const e = el('p', 'err'); e.hidden = true; c.appendChild(e); return t => { e.textContent = t || ''; e.hidden = !t; }; }
function parseJSON(t){ const m = sbeJsonMatch(String(t || '')); if (!m) throw new Error('לא התקבל מבנה תקין'); return JSON.parse(m[0]); }

// מפת המסע: חמש תחנות
function journeyMap(j){
  const box = el('div', 'jmap'); const ms = j.milestones || [];
  const cur = ms.length ? ((ms.find(m => m.status !== 'approved') || {}).stage || 6) : (j.startStage || 1);
  J.STAGES.forEach(s => {
    const st = el('div', 'st' + (s.k < cur || (ms.length && ms.every(m => m.status === 'approved')) ? ' reached' : '') + (s.k === cur ? ' now' : ''));
    st.appendChild(el('div', 'dot', s.k < cur ? '✓' : s.k));
    st.appendChild(el('div', 'nm', s.t)); st.appendChild(el('div', 'sb', s.sub));
    const mine = ms.filter(m => m.stage === s.k);
    if (mine.length) st.appendChild(el('div', 'cnt', mine.filter(m => m.status === 'approved').length + '/' + mine.length));
    box.appendChild(st);
  });
  return box;
}

// ── רשימת המסעות + מסע חדש ──
// דרך לצאת מכל מסך במסע (11/10/2026: "אין לי איך לצאת מכאן"), גם כשסרגל הניווט העליון לא נראה
function exitRow(inJourney){
  const r = el('div', 'exit-row no-print'); let home = 'home.html'; try { home = sessionStorage.getItem('sbe.session.homeUrl') || home; } catch(e){}
  if (inJourney) { const all = el('a', null, '← לכל המסעות'); all.href = '#'; all.addEventListener('click', e => { e.preventDefault(); location.hash = ''; }); r.appendChild(all); }
  const h = el('a', null, '⌂ המרחב שלי'); h.href = home; r.appendChild(h);
  const x = el('a', null, 'יציאה'); x.href = 'entry.html?logout=1'; r.appendChild(x);
  return r;
}
async function viewList(){
  if (/^#[a-z0-9]{6,24}$/.test(location.hash)) return;
  const load = ++loadGeneration, hash = location.hash;
  const app = F('app'); app.textContent = '';

  c.appendChild(clusterTable(p));
  const start = J.journeyStage(Object.fromEntries((p.clusters || []).map(x => [x.c, x.stage])));
  c.appendChild(el('p', 'banner-soft', 'נקודת היציאה של המסע: ' + stT(start) + ', לפי האשכול שנמצא בשלב הנמוך ביותר: חוזק באשכול אחד לא מפצה על אשכול אחר.'));
  if ((p.fails || []).length) { c.appendChild(el('h3', null, 'מכשולים בדרך, וגשרים שאפשר לבנות'));
    c.appendChild(failTable(p));
  } else c.appendChild(el('p', 'obst', J.ICON.clear + ' לא נמצא כשל מערכתי משמעותי.'));
  c.appendChild(printBtn(c, 'הצעת המסע'));
  const ch = card(); ch.appendChild(el('h2', null, 'ההחלטות שלכם'));
  ch.appendChild(el('p', 'muted', 'זו הצעה ולא הוראה: אפשר לבחור בכל החלטה את האפשרות שמתאימה לכם, ולספר מה הוביל אתכם אליה. אפשר להתייעץ עם הצוות לפני השליחה: הבחירות נשמרות במכשיר.'));
  (p.decisions || []).forEach(dec => ch.appendChild(decisionBlock(dec, state, save)));
  const u = J.UNITS.find(x => x.k === JR.unit) || J.UNITS[5];
  ch.appendChild(decisionBlock({ id: 'pace', q: 'באיזה קצב רוצים ללכת?', options: J.PACES.map(x => ({ label: x.t, explain: 'בערך ' + Math.round(u.months * x.f) + ' חודשים למסע כולו' })) }, state, save));
  const err = errLine(ch);
  const go = btn('שליחת הבחירות לד״ר יעל שדה', '', async () => {
    const ids = (p.decisions || []).map(x => x.id).concat('pace');

    const noEx = ids.filter(k => !state[k].reasons.length && !state[k].explain.trim()); if (noEx.length) return err('נשמח להסבר קצר בכל החלטה: אפשר לסמן סיבה או לכתוב כמה מילים.');
    err(''); go.disabled = true; go.textContent = 'בונה את אבני הדרך לפי הבחירות שלכם... (עד שתי דקות)';
    try {
      const counts = J.plannedCounts(JR.unit, start);
      const ctx = ['המיפוי:', mappingText(JR.mapping || { answers: {}, fails: {} }), '', 'הצעת המסע:', JSON.stringify(p), '', 'הבחירות והשיקולים:',
        ...ids.map(k => '- ' + k + ': ' + state[k].option + ' | שיקולים: ' + state[k].reasons.concat(state[k].explain ? [state[k].explain] : []).join('; ') + (state[k].who.length ? ' | שותפים: ' + state[k].who.join(', ') : ''))].join('\n');
      const plan = parseJSON(await complete(J.planSystem(JR.unit, counts), [{ role: 'user', content: ctx }], 20000, true));
      const paceK = (J.PACES.find(x => x.t === state.pace.option) || J.PACES[1]).k;
      const r = await api('jrSubmitChoices', { id: JR.id, choices: state, plan, startStage: start, pace: paceK });
      if (!r.ok) throw new Error(r.error === 'explain required' ? 'חסר הסבר באחת ההחלטות' : 'השליחה לא הצליחה');
      Object.assign(JR, { status: 'review', choices: state, plan, startStage: start, pace: paceK }); render(); window.scrollTo(0, 0);
    } catch(e) { err('לא הצלחנו לשלוח (' + (e.name === 'AbortError' ? 'לקח יותר מדי זמן' : e.message) + '). אפשר לנסות שוב.'); go.disabled = false; go.textContent = 'שליחת הבחירות לד״ר יעל שדה'; }
  }); go.style.marginTop = '.8rem'; ch.appendChild(go);
}

// שלב 3: ממתינים לאישור
function viewReview(){
  const c = card(); c.appendChild(el('h2', null, 'ההצעה והבחירות אצל ד״ר יעל שדה'));
  c.appendChild(el('p', 'banner-soft', 'קיבלנו! ד״ר יעל שדה תעבור על הבחירות שלכם ותחזור אליכם כאן, במסך הזה. אחרי האישור, יוצאים לדרך.'));

}
// PDF כמוצר מוגמר (12/10/2026, בדיקת הלקוחה): רק הטבלאות, במסמך ההדפסה של Begood
function printBtn(node, kind){
  const b = btn('🖨 הדפסה / שמירה כ-PDF', 'ghost no-print', () => { const n = node.cloneNode(true); n.querySelectorAll('.banner-soft,.no-print,button,h2').forEach(x => x.remove());
    if (window.SBE_DOC) SBE_DOC.print({ title: (JR.unitName || 'מסע אל החוסן'), kind, node: n, landscape: true }); });

// שלב 4: בדרך — אבני דרך, הגשות, תעודות
function ics(){
  const ms = JR.milestones || []; const esc = s => String(s).replace(/[,;\\]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Begood//Journey//HE'];
  ms.forEach((m, i) => { const d = String(m.due).replace(/-/g, ''); L.push('BEGIN:VEVENT', 'UID:' + JR.id + '-' + i + '@begood', 'DTSTAMP:' + d + 'T080000Z', 'DTSTART;VALUE=DATE:' + d,
    'SUMMARY:' + esc((m.gate ? 'שער: ' : 'אבן דרך: ') + m.title + ' · ' + JR.unitName), 'DESCRIPTION:' + esc('מסע אל החוסן · ' + stT(m.stage)),
    'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc('בעוד שבוע: ' + m.title), 'END:VALARM', 'BEGIN:VALARM', 'TRIGGER:-P2D', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc('בעוד יומיים: ' + m.title), 'END:VALARM', 'END:VEVENT'); });
  L.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' })); a.download = 'begood-journey.ics'; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
}
function viewActive(){
  const ms = JR.milestones || []; const next = ms.find(m => m.status !== 'approved');
  const c = card();
  if (JR.status === 'done') { c.appendChild(el('h2', null, '🎉 קהילת חוסן: המסע הושלם')); const last = ms[ms.length - 1];
    if (last && last.cert) { const a = el('a', 'btn', 'לתו החוסן לקהילת חוסן'); a.href = 'journey-cert.html?id=' + JR.id + '&code=' + last.cert.code; a.target = '_blank'; a.style.textDecoration = 'none'; c.appendChild(a); }
    finalReflection(c);
  } else if (next) {
    const dd = daysTo(next.due);
    c.appendChild(el('p', 'banner-soft', (next.status === 'submitted' ? 'הגשתם את "' + next.title + '": המשוב בדרך.' : dd < 0 ? J.ICON.rest + ' עצירת התרעננות: "' + next.title + '" תוכננה ל-' + fmt(next.due) + '. אפשר להגיש עכשיו, או לבקש דחייה.' : 'אבן הדרך הבאה: "' + next.title + '". המועד: ' + (dd === 0 ? 'היום' : 'בעוד ' + dd + ' ימים') + ' (' + fmt(next.due) + ').')));
  }
  const bar = el('div', 'btns no-print'); bar.appendChild(btn('הוספת המועדים ליומן', 'btn-ghost', ics)); c.appendChild(bar);
  ms.forEach((m, i) => milestoneCard(m, i));
}
function milestoneCard(m, i){
  const c = el('div', 'ms ' + m.status); F('app').appendChild(c);
  const h = el('h3'); h.appendChild(document.createTextNode((i + 1) + '. ' + m.title));
  if (m.gate) h.appendChild(el('span', 'tagx gate', J.ICON.gate + ' שער: סיום ' + stT(m.stage)));
  h.appendChild(el('span', 'tagx ' + ({ approved: 'ok', submitted: 'sub', needs: 'need' }[m.status] || ''), (m.status === 'approved' ? J.ICON.done + ' ' : '') + J.MS_LABEL[m.status]));
  c.appendChild(h); c.appendChild(el('div', 'meta', stT(m.stage) + ' · עד ' + fmt(m.due)));
  // טבלה (07/10/2026, "קו אחיד"): יעדים · מה מגישים · טיפ
  const rows = [];
  if ((m.goals || []).length) { const box = el('div', 'goals'); m.goals.forEach((g, gi) => box.appendChild(goalBlock(m, i, g, gi))); rows.push(['יעדים', box]); }
  if ((m.submit || []).length) { const ul = el('ul'); m.submit.forEach(s => ul.appendChild(el('li', null, J.endDot(s)))); rows.push(['מה מגישים', ul]); }
  if (m.tip) rows.push(['💡 טיפ', J.endDot(m.tip)]);
  if (rows.length) c.appendChild(SBE_TABLE(null, rows, 'ms-table'));
  if (m.status === 'approved' && m.cert) { const a = el('a', 'btn btn-ghost', '🏅 לתעודה'); a.href = 'journey-cert.html?id=' + JR.id + '&code=' + m.cert.code; a.target = '_blank'; a.style.textDecoration = 'none'; c.appendChild(a); }
  if (JR.status === 'active' && (m.status === 'open' || m.status === 'needs')) submitForm(c, m, i);
  threadInline(c, i);
}
function submitForm(c, m, i){
  const det = document.createElement('details'); det.className = 'no-print'; const sm = el('summary', null, m.status === 'needs' ? 'השלמה והגשה מחדש' : 'הגשת אבן הדרך'); sm.style.cssText = 'cursor:pointer;color:var(--spoken);font-weight:700;margin-top:.5rem'; det.appendChild(sm);
  det.appendChild(el('label', null, 'מה עשיתם: תיאור וראיות *'));
  const ev = document.createElement('textarea'); ev.maxLength = 3000; ev.placeholder = 'תארו מה נעשה, מי השתתף, ומה רואים היום שלא היה קודם. בלי פרטים מזהים של ילדים.'; det.appendChild(ev);
  det.appendChild(el('label', null, 'קישורים (תיעוד, תמונות, מסמכים): קישור בכל שורה'));
  const ln = document.createElement('textarea'); ln.placeholder = 'https://...'; ln.style.minHeight = '3rem'; det.appendChild(ln);
  let refl = null;
  if (m.gate) {
    det.appendChild(el('h3', null, 'רפלקציה בשער'));
    det.appendChild(el('label', null, 'איך הבחירות שעשיתם השפיעו על הדרך?'));
    const eff = document.createElement('select'); ['', 'קידמו מאוד', 'קידמו', 'לא השפיעו במיוחד', 'עיכבו מעט', 'עיכבו'].forEach(x => { const o = el('option', null, x || 'בחירה'); o.value = x; eff.appendChild(o); }); det.appendChild(eff);
    const effT = document.createElement('textarea'); effT.maxLength = 800; effT.placeholder = 'כמה מילים על ההשפעה'; effT.style.minHeight = '3rem'; det.appendChild(effT);
    det.appendChild(el('label', null, 'אם הייתם מחליטים שוב היום, מה הייתם בוחרים? נשמח לשמוע את השיקולים'));
    const ag = document.createElement('textarea'); ag.maxLength = 800; ag.style.minHeight = '3rem'; det.appendChild(ag);
    det.appendChild(el('label', null, 'מה גיליתם על עצמכם כקהילה?'));
    const lr = document.createElement('textarea'); lr.maxLength = 800; lr.style.minHeight = '3rem'; det.appendChild(lr);
    refl = () => ({ effect: [eff.value, effT.value.trim()].filter(Boolean).join(': '), again: ag.value.trim(), learned: lr.value.trim() });
  }
  const err = errLine(det);
  const go = btn('הגשה', '', async () => {
    if (ev.value.trim().length < 10) return err('נשמח לתיאור קצר של מה שנעשה.');
    go.disabled = true; const r = await api('jrSubmitMilestone', { id: JR.id, mi: i, submission: { evidence: ev.value.trim(), links: ln.value.split('\n').map(x => x.trim()).filter(x => /^https?:\/\//.test(x)).slice(0, 10), reflection: refl ? refl() : undefined } });
    if (r.ok) { await viewJourney(JR.id); } else { err('ההגשה לא נשלחה. אפשר לנסות שוב.'); go.disabled = false; }
  }); go.style.marginTop = '.6rem'; det.appendChild(go);
  c.appendChild(det);
}
// יעד: כל חלק בשורה משלו, אחד מתחת לשני, עם נקודה בסוף (11/10/2026)
function goalLi(g){ const li = el('li', 'goal'); li.appendChild(el('div', 'goal-cl', clT(g.c))); J.goalParts(g).forEach(([k, v]) => { const p = el('p', 'goal-line'); p.appendChild(el('b', null, k + ': ')); p.appendChild(document.createTextNode(v)); li.appendChild(p); }); return li; }
// "צעד אחר צעד" ו"שאלה על הסעיף": היועצת עונה מיד, בלי לחכות לד״ר יעל שדה.
// השיחה נשמרת במכשיר (לפי משתמש/ת); להעביר לד״ר שדה רק אם רוצים.
const askKey = () => window.sbeUserKey ? sbeUserKey('sbe.journey.ask.' + JR.id) : 'sbe.journey.ask.' + JR.id;
function askLoad(){ try { return JSON.parse(localStorage.getItem(askKey()) || '{}') || {}; } catch(e){ return {}; } }
function askSave(all){ try { localStorage.setItem(askKey(), JSON.stringify(all)); } catch(e){} }
function goalBlock(m, mi, g, gi){
  const li = goalLi(g); const k = mi + ':' + gi;
  const ctx = 'המסגרת: ' + unitT(JR.unit) + ' · ' + (JR.unitName || '') + '. אבן הדרך: ' + m.title + ' (' + stT(m.stage) + (m.gate ? ', שער' : '') + '). האשכול: ' + clT(g.c) + '. הסעיף: ' + J.goalParts(g).map(x => x[0] + ': ' + x[1]).join(' ');
  const log = el('div', 'ask-log'); const bar = el('div', 'btns no-print ask-bar');
  const show = () => { log.textContent = ''; (askLoad()[k] || []).forEach(x => { const q = el('p', 'ask-q'); q.appendChild(el('b', null, x.mode === 'steps' ? 'צעד אחר צעד' : 'השאלה שלכם: ')); if (x.mode !== 'steps') q.appendChild(document.createTextNode(x.q)); log.appendChild(q); const a = richText(x.a); a.classList.add('ask-a'); log.appendChild(a); }); };
  const run = async (mode, q, b) => {
    const all = askLoad(); const hist = all[k] || [];
    const messages = []; hist.forEach(x => { messages.push({ role: 'user', content: x.mode === 'steps' ? 'פרקי את הסעיף לצעדים.' : x.q }); messages.push({ role: 'assistant', content: x.a }); });
    messages.push({ role: 'user', content: mode === 'steps' ? 'פרקי את הסעיף לצעדים.' : q });
    b.disabled = true; const wait = el('p', 'muted', 'כתיבת התשובה נמשכת עד כחצי דקה.'); log.appendChild(wait);
    try { const a = (await complete(J.explainSystem(JR.unit, ctx, mode), messages, 1600)).trim(); if (!a) throw 0; hist.push({ mode, q: q || '', a, at: new Date().toISOString() }); all[k] = hist.slice(-12); askSave(all); show(); }
    catch(e){ if (mode === 'ask' && q && !tx.value) tx.value = q; wait.textContent = 'אין כרגע חיבור. השאלה חזרה לתיבה, ואפשר לנסות שוב.'; }
    b.disabled = false;
  };
  const steps = btn('🧩 צעד אחר צעד', 'btn-ghost btn-sm', e => run('steps', '', e.currentTarget));
  const det = document.createElement('details'); const sm = el('summary', null, '❓ שאלה על הסעיף'); det.appendChild(sm);
  const tx = document.createElement('textarea'); tx.maxLength = 800; tx.placeholder = 'מה לא ברור? למשל: איזה שאלון בדיוק? מי מעביר אותו?'; tx.style.minHeight = '3rem'; det.appendChild(tx);
  const send = btn('שליחה ליועצת המסע', 'btn-ghost btn-sm', e => { const q = tx.value.trim(); if (q.length < 2) return; tx.value = ''; run('ask', q, e.currentTarget); });
  det.appendChild(send);
  det.appendChild(el('p', 'muted', 'היועצת עונה מיד. אם רוצים שד״ר יעל שדה תראה את השאלה, אפשר לשלוח אותה בשיחה שבסוף אבן הדרך.'));
  bar.appendChild(steps); bar.appendChild(det);
  li.appendChild(bar); li.appendChild(log); show();
  return li;
}
// שרשור: לכל אבן דרך (ולמסע כולו) — הערות, ערעור, בקשת דחייה ותשובות
function threadInline(c, mi){
  const msgs = (JR.thread || []).filter(x => (x.mi === mi));
  const t = el('div', 'thread');
  msgs.forEach(x => { const m = el('div', 'm ' + (x.by === 'admin' ? 'admin' : 'owner')); m.appendChild(el('span', 'who', (x.by === 'admin' ? 'ד״ר יעל שדה' : ({ appeal: 'ערעור', extension: 'בקשת דחייה', comment: 'אתם' }[x.kind] || 'אתם')) + ' · ' + fmt(x.at))); m.appendChild(document.createTextNode(x.text)); t.appendChild(m); });
  if (JR.status !== 'done') {
    const det = document.createElement('details'); det.className = 'no-print'; const sm = el('summary', null, mi === null ? 'הודעה לד״ר יעל שדה' : 'הערה, שאלה, ערעור או בקשת דחייה'); sm.style.cssText = 'cursor:pointer;color:var(--muted);font-size:.88rem'; det.appendChild(sm);
    const kind = document.createElement('select'); [['comment', 'הערה או שאלה'], ['appeal', 'ערעור: הדרישה לא מתאימה או קשה מדי'], ['extension', 'בקשת דחייה של המועד']].forEach(([v, x]) => { const o = el('option', null, x); o.value = v; kind.appendChild(o); });
    if (mi !== null) det.appendChild(kind);
    const tx = document.createElement('textarea'); tx.maxLength = 2000; tx.placeholder = 'אפשר לכתוב כאן: ההודעה נשמרת במסע ומגיעה לד״ר יעל שדה'; det.appendChild(tx);
    const err = errLine(det);
    const go = btn('שליחה', 'btn-ghost', async () => { if (tx.value.trim().length < 2) return err('אפשר לכתוב כאן כמה מילים ואז לשלוח.'); go.disabled = true;
      const targetId = JR.id, targetWorkspace = workspaceUI;
      const r = await api('jrPost', { id: targetId, mi, kind: mi === null ? 'comment' : kind.value, text: tx.value.trim() });
      if (location.hash !== '#' + targetId || !JR || JR.id !== targetId || workspaceUI !== targetWorkspace) return;
      if (r.ok) {
        if (targetWorkspace) targetWorkspace.acceptMetadataRevision(r);
        if (targetWorkspace && targetWorkspace.hasUnsaved()) { tx.value = ''; err('ההודעה נשלחה. השינויים המקומיים נשארו פתוחים לשמירה.'); go.disabled = false; }
        else await viewJourney(targetId);
      } else { err('לא נשלח. אפשר לנסות שוב.'); go.disabled = false; }
    });
    go.style.marginTop = '.4rem'; det.appendChild(go); t.appendChild(det);
  }
  c.appendChild(t);
}
function threadCard(){ const c = card(); c.appendChild(el('h2', null, 'שיחה על המסע')); threadInline(c, null); }
function finalReflection(c){
  if (JR.final) { c.appendChild(el('p', 'muted', 'תודה על התחקיר המסכם!')); return; }
  c.appendChild(el('h3', null, 'תחקיר מסכם'));
  c.appendChild(el('label', null, 'מה עבד, מה פחות, ומה גיליתם על עצמכם?')); const a = document.createElement('textarea'); a.maxLength = 1500; c.appendChild(a);
  c.appendChild(el('label', null, 'מה הייתם ממליצים למי שיוצא/ת עכשיו למסע?')); const b = document.createElement('textarea'); b.maxLength = 1500; c.appendChild(b);
  const go = btn('שליחה', 'btn-ghost', async () => { go.disabled = true; await api('jrFinalReflection', { id: JR.id, final: { learned: a.value.trim(), recommend: b.value.trim() } }); await viewJourney(JR.id); }); go.style.marginTop = '.5rem'; c.appendChild(go);
}

let lastRouteHash = location.hash;
function route(){
  if (workspaceUI) {
    if (!workspaceUI.canLeave()) { history.replaceState(null, '', location.pathname + location.search + lastRouteHash); return; }
    workspaceUI.destroy(); workspaceUI = null;
  }
  lastRouteHash = location.hash;
  const id = location.hash.replace('#', ''); if (/^[a-z0-9]{6,24}$/.test(id)) viewJourney(id); else viewList();
}
window.addEventListener('hashchange', route); route();
})();
