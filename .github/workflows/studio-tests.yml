name: Studio contracts
on:
  pull_request:
    paths: ['app/**', 'harness/**', '.github/workflows/studio-tests.yml']
  push:
    branches: [main]
    paths: ['app/**', 'harness/**', '.github/workflows/studio-tests.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
        working-directory: harness
