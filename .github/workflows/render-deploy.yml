# עדכון השרת ב-Render אחרי כל מיזוג ל-main (30/10/2026: "רואים את הכלי אבל לא מחובר לשרת").
# הכלים החדשים (תרגול צוותים, חדרי מעבדת האופק ועוד) עובדים רק אחרי שהשרת מתעדכן.
# הגדרה חד־פעמית: ב-Render, sbe-server › Settings › Deploy Hook › Copy,
# וב-GitHub, Settings › Secrets and variables › Actions › New repository secret בשם RENDER_DEPLOY_HOOK.
name: render-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # 12/11/2026: בלי הסוד השרת לא התעדכן מ-1.11 בלי שאיש ידע. מעכשיו זו שגיאה (וגיטהאב שולח מייל).
          if [ -z "$HOOK" ]; then echo "::error::RENDER_DEPLOY_HOOK לא הוגדר, והשרת לא יתעדכן. אפשר לעדכן ידנית: Manual Deploy ב-Render."; exit 1; fi
          code=$(curl -sS -X POST "$HOOK" -o /dev/null -w "%{http_code}")
          echo "deploy hook: $code"
          case "$code" in 2*) ;; *) echo "::error::Render לא קיבל את בקשת העדכון ($code)"; exit 1;; esac
      - name: Wait for the new version
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 40); do
            got=$(curl -sS -m 60 https://sbe-server.onrender.com/health | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
            echo "server: ${got:-?} · want: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 20
          done
          echo "::error::השרת עוד לא על הגרסה החדשה ($want). כדאי לבדוק ב-Render (Events ו-Logs)."
          exit 1
